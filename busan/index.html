<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script>
(function(){
'use strict';

/* =========================================================
   utils
   ========================================================= */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(arr, rng){
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* =========================================================
   config
   ========================================================= */
const WORLD_W = 800;
const ROAD_L = 28, ROAD_R = 772;
const ROAD_W = ROAD_R - ROAD_L;
const LANES = 8;
const LANE_W = ROAD_W / LANES;          // 93
function laneCenter(i){ return ROAD_L + (i + 0.5) * LANE_W; }

const SPD_SCALE = 3.9;                  // world units per (km/h) per second
const PLAYER = { w: 54, h: 110 };
const PLAYER_Y_OFF = 300;               // above the bottom edge
const HIT = 0.87;                       // 충돌 판정 배율 (86~88%)
const NEAR_MISS = 30;                   // 칼치기 판정 시각 간격 (world units)

/* ---------- themes ---------- */
const THEMES = {
  day:  { ground:['#2c5f3b','#35744a','#3d8454'], road:['#4b4a54','#5f5e69','#6a6975'],
          haze:'198,224,255', hazeA:0.30, night:0, lamp:'255,240,170' },
  dusk: { ground:['#3b3327','#4a3e2b','#55482f'], road:['#3f3a44','#4f4855','#595162'],
          haze:'255,166,110', hazeA:0.34, night:0.30, lamp:'255,205,140' },

/* =========================================================
   progress storage
   ========================================================= */
const STORE_KEY = 'busan8_progress_v2';
const MemStore = (function(){
  const m = {};
  return {
    getItem: function(k){ return Object.prototype.hasOwnProperty.call(m,k) ? m[k] : null; },
    setItem: function(k,v){ m[k] = String(v); },
    removeItem: function(k){ delete m[k]; }
  };
})();
function defaultStore(){
  try {
    if (typeof localStorage !== 'undefined' && localStorage) return localStorage;
  } catch(e){}
  return MemStore;
}
function blankProgress(){
  return { unlocked:1, cleared:{}, best:{}, infinite:false, runs:0, bestKm:0, bestScore:0, oldBestKm:0 };
}
function loadProgress(store){
  const st = store || defaultStore();
  try {
    const raw = st.getItem(STORE_KEY);
    if (!raw) return blankProgress();
    const o = JSON.parse(raw);
    const p = blankProgress();
    p.unlocked = clamp(parseInt(o.unlocked,10) || 1, 1, STAGES.length);
    p.cleared = (o.cleared && typeof o.cleared === 'object') ? o.cleared : {};
    p.best = (o.best && typeof o.best === 'object') ? o.best : {};
    p.infinite = !!o.infinite;
    p.runs = o.runs || 0;
    p.bestKm = o.bestKm || 0;
    p.bestScore = o.bestScore || 0;
    p.oldBestKm = o.oldBestKm || 0;
    return p;
  } catch(e){ return blankProgress(); }
}
function saveProgress(p, store){
  const st = store || defaultStore();
  try { st.setItem(STORE_KEY, JSON.stringify(p)); return true; } catch(e){ return false; }
}
function stageUnlocked(p, n){ return n >= 1 && n <= p.unlocked; }
function recordClear(p, n, time, score){
  const wasNew = n === p.unlocked && n < STAGES.length;
  const prev = p.cleared[n];
  if (prev === undefined || time < prev) p.cleared[n] = time;
  if (n === p.unlocked && n < STAGES.length) p.unlocked = n + 1;
  if (n === STAGES.length) p.infinite = true;
  p.runs = (p.runs || 0) + 1;
  if (score > (p.bestScore || 0)) p.bestScore = score;
  return { newlyUnlocked: n < STAGES.length ? p.unlocked : p.unlocked, firstClear: prev === undefined, wasNew: wasNew,
           allClear: n === STAGES.length };
}

  c.land = [];

}

/* =========================================================

function playerY(sim){ return sim.worldH - PLAYER_Y_OFF; }
function playerX(sim){ return laneCenter(sim.lanePos); }

function newGame(opts){
  opts = opts || {};
  let cfg, stageN = 0, mode = 'stage';
  if (opts.mode === 'infinite'){
    cfg = makeInfiniteCfg();
    mode = 'infinite';
  } else {
    stageN = clamp(opts.stage|0, 0, STAGES.length-1);
    cfg = Object.assign({}, STAGES[stageN]);
  }
  const seed = (opts.seed === undefined || opts.seed === null)
    ? ((Date.now() ^ 0x9e3779b9) >>> 0) : (opts.seed >>> 0);
  const cruise = (cfg.startKmh + cfg.maxKmh) / 2 * 0.88;
  const kmDiv = cfg.kmDiv || (cfg.secs * cruise / cfg.km);

  return {
    state: 'title',
    mode: mode,
    stage: stageN,
    cfg: cfg,
    theme: THEMES[cfg.theme] || THEMES.day,
    seed: seed,
    rng: mulberry32(seed),

    worldH: opts.worldH || 1422,
    lanePos: 4, targetLane: 4, laneVel: 0,
    speed: cfg.startKmh, maxSpeed: cfg.maxKmh,
    kmDiv: kmDiv,
    dist: 0, bonus: 0, score: 0, kalchi: 0, time: 0, rush: 0,
    scroll: 0,

    obstacles: [], pops: [], particles: [],
    nextId: 1,
    spawnTimer: 0.55,
    waveCount: 0,
    corridor: 4,
    gapScale: 1,
    landIdx: 0,
    section: cfg.city,

    blocked: false, blockT: 0, lastBlockT: -9,
    lateLeft: cfg.lateSec, lateTotal: cfg.lateSec,
    drain: 1,
    shake: 0, crashT: 0, finishT: 0,
    crashCause: null, endInfo: null,
    gantry: null,
    horn: 0, cutCount: 0,
    bestKm: 0, bestScore: 0, bestTime: 0
  };
}

function start(sim){
  sim.state = 'playing';
  sim.speed = sim.cfg.startKmh;
  sim.spawnTimer = 0.55;
  sim.lateLeft = sim.cfg.lateSec;
  return sim;
}

function steer(sim, dir){
  if (sim.state !== 'playing') return false;
  const t = clamp(Math.round(sim.targetLane) + dir, 0, LANES - 1);
  if (t === sim.targetLane) return false;
  sim.targetLane = t;
  return true;
}

function setLane(sim, lane){
  if (lane < 0 || lane > LANES - 1) return false;
  sim.targetLane = lane;
  return true;
}

/* =========================================================
   obstacles
   ========================================================= */
function makeObstacle(sim, props){
  return {
    id: sim.nextId++,
    type: props.type || 'car',
    x: props.x,
    y: props.y,
    w: props.w,
    h: props.h,
    speed: props.speed === undefined ? 90 : props.speed,
    color: props.color || '#e6e8ef',
    lane: props.lane === undefined ? 0 : props.lane,
    cutter: !!props.cutter,
    cutLane: props.cutLane === undefined ? null : props.cutLane,
    blinker: !!props.blinker,
    cutState: 'idle',
    cutT: 0,
    cutDur: props.cutDur || 0.26,
    cutFrom: props.x,
    cutTo: props.x,
    passed: false,
    minGap: Infinity,
    dead: false
  };
}

function addObstacle(sim, props){ const o = makeObstacle(sim, props); sim.obstacles.push(o); return o; }

/* 차선이 y 밴드 안에서 점유됐는지 (차체 폭 + 여유) */
function freeInBand(sim, y0, y1){
  const busy = new Array(LANES).fill(false);
  const margin = PLAYER.w * 0.34;
  for (let k=0;k<sim.obstacles.length;k++){
    const o = sim.obstacles[k];
    if (o.dead) continue;
    if (o.y + o.h/2 < y0 || o.y - o.h/2 > y1) continue;
    const x0 = o.x - o.w/2 - margin, x1 = o.x + o.w/2 + margin;
    for (let i=0;i<LANES;i++){
      const cx = laneCenter(i);
      if (cx > x0 && cx < x1) busy[i] = true;
    }
  }
  const free = [];
  for (let i=0;i<LANES;i++) if (!busy[i]) free.push(i);
  return free;
}

function addCone(sim, lane, y){
  return addObstacle(sim, { type:'cone', x: laneCenter(lane), y: y, w: 24, h: 26, speed: 0, lane: lane });
}

function carSpeed(sim, rng, spread){
  const c = sim.cfg;
  return Math.max(40, c.trafficKmh * (1 + (rng() - 0.5) * (spread === undefined ? 0.26 : spread)));
}

/* 웨이브 하나 스폰: 항상 탈출 차로를 남긴다 */
function spawnWave(sim){
  const cfg = sim.cfg, rng = sim.rng;
  const y0 = -340 - rng() * 150;
  const free = freeInBand(sim, y0 - 120, y0 + 120);
  if (free.length < 3) return null;

  /* 예약 차로: 플레이어 ±2 안에 반드시 뚫린 차로를 하나 남긴다 (탈출 보장) */
  const mine = clamp(Math.round(sim.lanePos), 0, LANES - 1);
  let reserved = -1, rd = 9;
  for (let k=0;k<free.length;k++){
    const d = Math.abs(free[k] - mine);
    if (d >= 1 && d <= 2 && d < rd){ rd = d; reserved = free[k]; }
  }
  if (reserved < 0 && free.indexOf(mine) >= 0) reserved = mine;
  if (reserved < 0){
    for (let k=0;k<free.length;k++){
      const d = Math.abs(free[k] - mine);
      if (d < rd){ rd = d; reserved = free[k]; }
    }
  }
  sim.corridor = reserved;
  const pool = free.filter(function(l){ return l !== reserved; });
  if (!pool.length) return null;

  const ids = [];
  function place(props){
    const o = addObstacle(sim, props);
    ids.push(o.id);
    return o;
  }

  const w = cfg.weights;
  const roll = rng();
  const pCone = w.pack + w.truck + w.cone;
  const pCut = pCone + w.cut;
  let kind;

  if (roll < w.pack) kind = 'pack';
  else if (roll < w.pack + w.truck) kind = 'truck';
  else if (roll < pCone) kind = 'cone';
  else if (roll < pCut) kind = 'cut';
  else kind = 'zig';

  /* --- 화물차/버스 병목 --- */
  if (kind === 'truck'){
    const n = Math.min(pool.length - (cfg.escapeMin - 1), rng() < 0.45 ? 2 : 1);
    if (n <= 0) return null;
    const lanes = shuffle(pool.slice(), rng).slice(0, n);
    for (let i=0;i<lanes.length;i++){
      const isBus = rng() < 0.45;
      place({
        type: isBus ? 'bus' : 'truck',
        lane: lanes[i],
        x: laneCenter(lanes[i]),
        y: y0 - i * 26,
        w: isBus ? 70 : 68,
        h: isBus ? 212 : 198,
        speed: cfg.trafficKmh * (0.50 + rng() * 0.16),
        color: isBus ? '#2b6fd6' : (rng() < 0.5 ? '#eceff5' : '#d7dbe4')
      });
    }
  }

  /* --- 차량 벽 (1~2개 빈틈) --- */
  else if (kind === 'pack'){
    const maxBlock = Math.min(pool.length, cfg.blockMax);
    if (maxBlock <= 0) return null;
    const k = 1 + Math.floor(rng() * maxBlock);
    const lanes = shuffle(pool.slice(), rng).slice(0, k);
    const v = carSpeed(sim, rng, 0.16);
    for (let i=0;i<lanes.length;i++){
      place({
        type: 'car', lane: lanes[i], x: laneCenter(lanes[i]),
        y: y0 - rng() * 34, w: 50, h: 104,
        speed: v * (0.96 + rng() * 0.08),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)]
      });
    }
  }

  /* --- 공사구간 꼬깔콘 (2~4차선 점유) --- */
  else if (kind === 'cone'){
    const maxBlock = Math.min(pool.length, cfg.coneMax || 2, cfg.blockMax);
    if (maxBlock < 1) return null;
    const k = 1 + Math.floor(rng() * maxBlock);
    const lanes = shuffle(pool.slice(), rng).slice(0, k);
    const n = Math.max(2, cfg.coneLen - 1 + Math.floor(rng() * 2));
    for (let i=0;i<lanes.length;i++){
      for (let j=0;j<n;j++){
        addCone(sim, lanes[i], y0 - j * 88);
        ids.push(sim.obstacles[sim.obstacles.length-1].id);
      }
    }
  }

  /* --- 칼치기 차량 --- */
  else if (kind === 'cut'){
    const mine = Math.floor(sim.lanePos);
    const near = pool.filter(function(l){ return Math.abs(l - mine) <= 2; });
    const cutPool = near.length ? near : pool;
    const lane = cutPool[Math.floor(rng() * cutPool.length)];
    const n = rng() < 0.35 ? 2 : 1;
    for (let i=0;i<n;i++){
      let dir = mine - lane;
      dir = dir === 0 ? (rng() < 0.5 ? -1 : 1) : (dir > 0 ? 1 : -1);
      if (rng() < 0.22) dir = -dir;
      const cutLane = clamp(lane + dir, 0, LANES - 1);
      const o = place({
        type: 'car', lane: lane, x: laneCenter(lane),
        y: y0 - rng() * 90, w: 50, h: 104,
        speed: Math.max(70, sim.speed * (0.92 + rng() * 0.14)),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)],
        cutter: cutLane !== lane, cutLane: cutLane,
        blinker: rng() < (cfg.n >= 3 ? 0.12 : 0.30),
        cutDur: cfg.n >= 4 ? 0.22 : 0.26
      });
      if (o.cutter) sim.cutCount++;
    }
  }

  /* --- 지그재그 --- */
  else {
    const lanes = shuffle(pool.slice(), rng).slice(0, Math.min(3, pool.length));
    for (let i=0;i<3;i++){
      const lane = lanes[Math.floor(rng() * lanes.length)];
      place({
        type: 'car', lane: lane, x: laneCenter(lane),
        y: y0 - i * 118, w: 50, h: 104,
        speed: carSpeed(sim, rng, 0.2),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)]
      });
    }
  }

  if (!ids.length) return null;

  /* 탈출 차로 보장: 밴드 안에 최소 escapeMin 차로가 비어 있어야 함 */
  pruneForEscape(sim, ids, y0 - 200, y0 + 470, cfg.escapeMin);
  if (!ids.length) return null;

  sim.waveCount++;
  return { kind: kind, y: y0, ids: ids };
}

function pruneForEscape(sim, ids, y0, y1, minFree){
  let guard = 0;
  while (ids.length && guard++ < 40){
    if (freeInBand(sim, y0, y1).length >= minFree) return true;
    const id = ids.pop();
    for (let i=sim.obstacles.length-1;i>=0;i--){
      if (sim.obstacles[i].id === id){ sim.obstacles.splice(i,1); break; }
    }
  }
  return freeInBand(sim, y0, y1).length >= minFree;
}

/* =========================================================
   endings
   ========================================================= */
function pickEnding(sim, cause){
  const c = sim.cfg;
  const r = sim.rng();
  const left = Math.max(0, c.km - sim.dist);
  if (!c.infinite && left < 8){
    return { tag:'아깝다…', text: c.to + ' ' + Math.ceil(left) + 'km 남기고 폐차 💀', sub:'국밥은 다음 생에' };
  }
  if (cause === 'cone'){
    return r < 0.5
      ? { tag:'공사구간 참변', text:'꼬깔콘에 데이고 견인차 대기 중 🚧', sub:'공사는 나라가 하는 거다' }
      : { tag:'공사구간 참변', text:'꼬깔콘 3개를 다 밟고 폐차 🚧', sub:'안전제일' };
  }
  if (cause === 'truck'){
    return r < 0.55
      ? { tag:'1차로 참변', text:'정속주행 트럭 뒤에서 분노조절 실패 😤', sub:'트럭: 저는 규정속도입니다' }
      : { tag:'화물차 참변', text:'화물차에 막혀 있다가 그대로 데임 🚚', sub:'1차로는 추월차로!' };
  }
  if (cause === 'cutter'){
    return r < 0.5
      ? { tag:'끼어들기 참변', text:'깜빡이 없는 차한테 데여서 보험사 대기 중 🚑', sub:'깜빡이는 장식이 아니다' }
      : { tag:'끼어들기 참변', text:'훅 들어온 차에 데고 8차로가 전면 개편됨 🚗💥', sub:'그 차는 그냥 갔습니다' };
  }
  return r < 0.5
    ? { tag:'스치기 참변', text:'스치기만 해도 사고. 그게 한국 도로다 🚗💥', sub:'데이면 끝' }
    : { tag:'스치기 참변', text:'옆 차 사이드미러에 데고 인생도 데임 🔧', sub:'보험료 할증 확정' };
}

function lateEnding(sim){
  return {
    tag:'지각 엔딩',
    text:'제한 시간 초과! 지각입니다 📞',
    sub: (sim.cfg.to || '부산') + ' 못 가고 회사에 전화하는 중'
  };
}

/* =========================================================
   crash / finish / late
   ========================================================= */
function makeParticles(sim, o){
  const px = playerX(sim), py = playerY(sim);
  const parts = [];
  const rng = sim.rng;
  for (let i=0;i<26;i++){
    const a = rng() * Math.PI * 2, sp = 60 + rng() * 420;
    parts.push({
      x: px + (o ? (o.x - px) * 0.5 : 0),
      y: py + (o ? (o.y - py) * 0.5 : 0),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      life: 0.5 + rng() * 0.9, max: 1.4,
      size: 3 + rng() * 12,
      color: ['#ffd166','#ff8c42','#ff5252','#fff3c4','#b0b8c4'][Math.floor(rng()*5)]
    });
  }
  return parts;
}

function crashAt(sim, o){
  if (sim.state !== 'playing') return [];
  sim.state = 'crash';
  sim.crashT = 0;
  sim.shake = 1;
  const cause = o.type === 'cone' ? 'cone'
    : (o.type === 'truck' || o.type === 'bus') ? 'truck'
    : (o.cutter ? 'cutter' : 'car');
  sim.crashCause = cause;
  sim.endInfo = pickEnding(sim, cause);
  sim.particles = makeParticles(sim, o);
  sim.speed = Math.max(0, sim.speed * 0.15);
  sim.score = Math.floor(sim.dist * 10) + sim.bonus;
  return [{ type:'crash', cause: cause, info: sim.endInfo }];
}

function finishRun(sim){
  sim.state = 'finish';
  sim.finishT = 0;
  sim.dist = sim.cfg.km;
  const timeBonus = Math.max(0, Math.round((sim.lateLeft) * 25));
  sim.bonus += timeBonus;
  sim.score = Math.floor(sim.dist * 10) + sim.bonus;
  sim.particles = makeParticles(sim, null);
  return [{ type:'finish', stage: sim.stage + 1, time: sim.time, score: sim.score,
            kalchi: sim.kalchi, timeBonus: timeBonus }];
}

function lateRun(sim){
  if (sim.state !== 'playing') return [];
  sim.state = 'late';
  sim.crashT = 0;
  sim.endInfo = lateEnding(sim);
  sim.score = Math.floor(sim.dist * 10) + sim.bonus;
  return [{ type:'late', info: sim.endInfo }];
}

/* =========================================================
   update
   ========================================================= */
function updateParticles(sim, dt){
  const ps = sim.particles;
  for (let i=ps.length-1;i>=0;i--){
    const p = ps[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 900 * dt; p.vx *= (1 - 1.6 * dt);
    p.life -= dt;
    if (p.life <= 0) ps.splice(i,1);
  }
}

function updatePops(sim, dt){
  const pop = sim.pops;
  for (let i=pop.length-1;i>=0;i--){
    const p = pop[i];
    p.y -= 52 * dt;
    p.life -= dt;
    if (p.life <= 0) pop.splice(i,1);
  }
}

function update(sim, dt){
  const ev = [];
  if (dt === undefined) dt = 1/60;
  dt = Math.min(dt, 0.05);

  if (sim.state === 'crash' || sim.state === 'late'){
    sim.crashT += dt;
    sim.shake = Math.max(0, sim.shake - dt * 2.4);
    updateParticles(sim, dt); updatePops(sim, dt);
    return ev;
  }
  if (sim.state === 'finish'){
    sim.finishT += dt;
    sim.shake = Math.max(0, sim.shake - dt * 2.4);
    updateParticles(sim, dt); updatePops(sim, dt);
    sim.speed = Math.max(0, sim.speed - dt * 120);
    sim.scroll = (sim.scroll || 0) + sim.speed * SPD_SCALE * dt;
    for (let i=0;i<sim.obstacles.length;i++){
      const o = sim.obstacles[i];
      o.y += (sim.speed - o.speed) * SPD_SCALE * dt;
    }
    return ev;
  }
  if (sim.state !== 'playing'){
    updatePops(sim, dt);
    return ev;
  }

  const cfg = sim.cfg;
  sim.time += dt;

  /* 무한 모드 램프업 */
  if (sim.mode === 'infinite'){
    sim.maxSpeed = cfg.maxKmh + Math.min(90, sim.time * 0.30);
    sim.gapScale = Math.max(0.55, 1 - sim.time / 260);
  }

  /* --- lane movement --- */
  const prevLane = sim.lanePos;
  const k = 1 - Math.exp(-dt * 13);
  sim.lanePos += (sim.targetLane - sim.lanePos) * k;
  if (Math.abs(sim.targetLane - sim.lanePos) < 0.004) sim.lanePos = sim.targetLane;
  sim.laneVel = (sim.lanePos - prevLane) / Math.max(dt, 1e-6);

  const px = playerX(sim);
  const py = playerY(sim);

  /* --- blocking (길막) --- */
  let blocker = null;
  for (let i=0;i<sim.obstacles.length;i++){
    const o = sim.obstacles[i];
    if (o.dead || o.type === 'cone') continue;
    const dy = py - o.y;
    if (dy < 30 || dy > 640) continue;
    const latGap = Math.abs(o.x - px) - (o.w + PLAYER.w) / 2 * 0.55;
    if (latGap > 0) continue;
    if (!blocker || o.y > blocker.y) blocker = o;
  }
  sim.blocked = !!blocker;
  let goal = sim.maxSpeed;
  if (blocker){
    sim.blockT += dt;
    const gap = (py - blocker.y) - (blocker.h + PLAYER.h) / 2;
    goal = Math.max(35, Math.min(sim.maxSpeed, blocker.speed + Math.max(0, gap - 150) * 0.6));
    if (gap < 260 && blocker.speed < sim.speed - 8 && sim.time - sim.lastBlockT > 1.4){
      sim.lastBlockT = sim.time;
      ev.push({ type:'block', obs: blocker });
    }
  } else {
    sim.blockT = 0;
  }

  /* --- speed --- */
  sim.rush = Math.max(0, sim.rush - dt);
  const cap = sim.maxSpeed * (1 + 0.10 * Math.min(1, sim.rush / 1.5));
  if (goal > cap) goal = cap;
  const rate = (goal < sim.speed) ? 380 : 60;
  if (goal > sim.speed) sim.speed = Math.min(goal, sim.speed + rate * dt);
  else sim.speed = Math.max(goal, sim.speed - rate * dt);
  sim.speed = clamp(sim.speed, 30, cap * 1.02);

  /* --- distance / scroll --- */
  sim.scroll = (sim.scroll || 0) + sim.speed * SPD_SCALE * dt;
  sim.dist += (sim.speed / sim.kmDiv) * dt;

  /* --- spawn --- */
  sim.spawnTimer -= dt;
  if (sim.spawnTimer <= 0){
    spawnWave(sim);
    const rel = Math.max(150, (sim.speed - cfg.trafficKmh * 0.62) * SPD_SCALE);
    const gap = lerp(cfg.gapMin, cfg.gapMax, sim.rng()) * sim.gapScale;
    sim.spawnTimer = Math.max(0.22, gap / rel);
  }

  /* --- obstacles --- */
  for (let i=0;i<sim.obstacles.length;i++){
    const o = sim.obstacles[i];
    if (o.dead) continue;
    o.y += (sim.speed - o.speed) * SPD_SCALE * dt;

    if (o.cutter && o.cutLane !== null){
      if (o.cutState === 'idle'){
        if (o.y > 20 && o.y < py - 300 && sim.state === 'playing'){
          if (o.blinker){
            o.cutState = 'warn'; o.cutT = 0;
            o.cutFrom = o.x; o.cutTo = laneCenter(o.cutLane);
            o.cutDur = 0.46;
          } else {
            o.cutState = 'cut'; o.cutT = 0;
            o.cutFrom = o.x; o.cutTo = laneCenter(o.cutLane);
            sim.cutCount++;
            ev.push({ type:'cut', obs: o });
          }
        }
      } else if (o.cutState === 'warn'){
        o.cutT += dt;
        if (o.cutT >= 0.42){ o.cutState = 'cut'; o.cutT = 0; o.cutFrom = o.x; }
      } else if (o.cutState === 'cut'){
        o.cutT += dt;
        const p = Math.min(1, o.cutT / o.cutDur);
        const e = p * p * (3 - 2 * p);
        o.x = lerp(o.cutFrom, o.cutTo, e);
        if (p >= 1) o.cutState = 'done';
      }
    }
  }

  /* --- collision / near miss --- */
  for (let i=0;i<sim.obstacles.length;i++){
    const o = sim.obstacles[i];
    if (o.dead) continue;
    const dx = Math.abs(o.x - px);
    const dy = Math.abs(o.y - py);

    const gx = dx - (o.w + PLAYER.w) / 2;
    const gy = dy - (o.h + PLAYER.h) / 2;
    const gap = Math.max(gx, gy);
    if (gap < o.minGap) o.minGap = gap;

    if (dx < (o.w + PLAYER.w) / 2 * HIT && dy < (o.h + PLAYER.h) / 2 * HIT){
      o.dead = true;
      return ev.concat(crashAt(sim, o));
    }

    if (!o.passed && o.y - o.h / 2 > py + PLAYER.h / 2){
      o.passed = true;
      if (o.minGap < NEAR_MISS){
        sim.kalchi++;
        sim.bonus += 50;
        sim.rush = Math.min(2.2, sim.rush + 0.7);
        ev.push({ type:'kalchi', x: o.x, y: py - 40, obs: o });
      }
    }
  }

  /* --- cleanup --- */
  for (let i=sim.obstacles.length-1;i>=0;i--){
    const o = sim.obstacles[i];
    if (o.dead || o.y - o.h / 2 > sim.worldH + 260) sim.obstacles.splice(i,1);
  }

  /* --- landmarks --- */
  while (sim.landIdx < cfg.land.length && sim.dist >= cfg.land[sim.landIdx].p * cfg.km){
    const m = cfg.land[sim.landIdx];
    sim.landIdx++;
    if (m.p >= 1) break;
    sim.bonus += 120;
    sim.section = m.name;
    sim.gantry = { name: m.name, sub: m.sub, km: Math.round(m.p * cfg.km), y: -260, t: 0 };
    ev.push({ type:'milestone', m: m });
  }

  /* --- gantry scroll --- */
  if (sim.gantry){
    sim.gantry.y += sim.speed * SPD_SCALE * dt;
    sim.gantry.t += dt;
    if (sim.gantry.y > sim.worldH + 300) sim.gantry = null;
  }

  sim.score = Math.floor(sim.dist * 10) + sim.bonus;
  updatePops(sim, dt);

  /* --- finish --- */
  if (!cfg.infinite && sim.dist >= cfg.km){
    return ev.concat(finishRun(sim));
  }

  /* --- late (지각) --- */
  if (!cfg.infinite){
    sim.drain = sim.blocked ? 1.6 : 1;
    sim.lateLeft -= dt * sim.drain;
    if (sim.lateLeft <= 0){
      sim.lateLeft = 0;
      return ev.concat(lateRun(sim));
    }
  }

  return ev;
}

/* =========================================================
   drawing
   ========================================================= */
function rr(ctx, x, y, w, h, r){
  const rad = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rad, y);
  ctx.lineTo(x+w-rad, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+rad);
  ctx.lineTo(x+w, y+h-rad);
  ctx.quadraticCurveTo(x+w, y+h, x+w-rad, y+h);
  ctx.lineTo(x+rad, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-rad);
  ctx.lineTo(x, y+rad);
  ctx.quadraticCurveTo(x, y, x+rad, y);
  ctx.closePath();
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r + amt), 0, 255);
  g = clamp(Math.round(g + amt), 0, 255);
  b = clamp(Math.round(b + amt), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawGround(ctx, sim){
  const H = sim.worldH, W = WORLD_W;
  const th = sim.theme;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.ground[0]);
  g.addColorStop(0.4, th.ground[1]);
  g.addColorStop(1, th.ground[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const period = 190;
  const off = (sim.scroll * 0.9) % period;
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  for (let y = -period + off; y < H + period; y += period){
    ctx.fillRect(0, y, W, period * 0.48);
  }
}

function drawRoad(ctx, sim){
  const H = sim.worldH;
  const th = sim.theme;
  const g = ctx.createLinearGradient(0, 0, WORLD_W, 0);
  g.addColorStop(0, th.road[0]);
  g.addColorStop(0.22, th.road[1]);
  g.addColorStop(0.5, th.road[2]);
  g.addColorStop(0.78, th.road[1]);
  g.addColorStop(1, th.road[0]);
  ctx.fillStyle = g;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  for (let i=0;i<LANES;i++){
    if (i % 2 === 0) continue;
    ctx.fillStyle = i === 7 ? 'rgba(60,120,220,0.20)' : 'rgba(255,255,255,0.035)';
    ctx.fillRect(laneCenter(i) - LANE_W/2, 0, LANE_W, H);
  }
  ctx.fillStyle = 'rgba(45,100,200,0.16)';
  ctx.fillRect(laneCenter(7) - LANE_W/2, 0, LANE_W, H);

  const dash = 78, gapd = 58, per = dash + gapd;
  const off = sim.scroll % per;
  for (let l=1;l<LANES;l++){
    if (l === 7) continue;
    const x = ROAD_L + l * LANE_W - 3;
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    for (let y = -per + off; y < H + per; y += per){
      ctx.fillRect(x, y, 6, dash);
    }
  }
  ctx.fillStyle = 'rgba(150,200,255,0.85)';
  for (let y = -per + off; y < H + per; y += per){
    ctx.fillRect(laneCenter(7) - LANE_W/2 - 2, y, 5, dash * 1.1);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(ROAD_L + 4, 0, 7, H);
  ctx.fillRect(ROAD_R - 11, 0, 7, H);

  const rp = 44;
  const roff = sim.scroll % rp;
  ctx.fillStyle = 'rgba(255,180,60,0.34)';
  for (let y = -rp + roff; y < H + rp; y += rp){
    ctx.fillRect(ROAD_L, y, 5, rp * 0.5);
    ctx.fillRect(ROAD_R - 5, y, 5, rp * 0.5);
  }

  const sp = 1100;
  const soff = sim.scroll % sp;
  ctx.save();
  ctx.globalAlpha = 0.20;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 26px system-ui,sans-serif';
  for (let y = -sp + soff; y < H + sp; y += sp){
    ctx.fillText('1차로', laneCenter(0), y + 40);
    ctx.fillText('버스전용', laneCenter(7), y + 60);
  }
  ctx.restore();
}

function drawHaze(ctx, sim){
  const H = sim.worldH;
  const th = sim.theme;
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.42);
  g.addColorStop(0, 'rgba(' + th.haze + ',' + th.hazeA + ')');
  g.addColorStop(0.55, 'rgba(' + th.haze + ',' + (th.hazeA * 0.24) + ')');
  g.addColorStop(1, 'rgba(' + th.haze + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, WORLD_W, H * 0.42);
}

function drawScenery(ctx, sim){
  const H = sim.worldH;
  const sp = 300;
  const off = sim.scroll % sp;

  ctx.strokeStyle = 'rgba(210,220,230,0.75)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(16, 0); ctx.lineTo(16, H);
  ctx.moveTo(WORLD_W - 16, 0); ctx.lineTo(WORLD_W - 16, H);
  ctx.stroke();

  const psp = 60;
  const poff = sim.scroll % psp;
  ctx.fillStyle = 'rgba(160,175,190,0.6)';
  for (let y = -psp + poff; y < H + psp; y += psp){
    ctx.fillRect(12, y, 4, 26);
    ctx.fillRect(WORLD_W - 16, y, 4, 26);
  }

  const th = sim.theme;
  for (let i = -1; i < Math.ceil(H / sp) + 2; i++){
    const y = i * sp + off;
    if (y < -260 || y > H + 260) continue;
    const idx = Math.round((i * sp - off) / sp);
    const seed = ((idx % 7) + 7) % 7;

    ctx.fillStyle = 'rgba(20,26,34,0.85)';
    ctx.fillRect(6, y, 5, 96);
    ctx.fillRect(6, y, 26, 5);
    ctx.fillStyle = 'rgba(' + th.lamp + ',0.9)';
    ctx.beginPath(); ctx.arc(31, y + 3, 4, 0, 7); ctx.fill();

    const y2 = y + sp * 0.5;
    if (y2 < H + 200){
      ctx.fillStyle = 'rgba(20,26,34,0.85)';
      ctx.fillRect(WORLD_W - 11, y2, 5, 96);
      ctx.fillRect(WORLD_W - 32, y2, 26, 5);
      ctx.fillStyle = 'rgba(' + th.lamp + ',0.9)';
      ctx.beginPath(); ctx.arc(WORLD_W - 31, y2 + 3, 4, 0, 7); ctx.fill();
    }

    const tx = 8 + (seed % 3) * 6;
    ctx.fillStyle = 'rgba(26,66,38,0.95)';
    ctx.beginPath(); ctx.arc(tx + 6, y + 150, 13 + (seed % 3) * 3, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(36,88,50,0.95)';
    ctx.beginPath(); ctx.arc(WORLD_W - 14, y + 220 + (seed % 4) * 8, 12 + (seed % 2) * 4, 0, 7); ctx.fill();
  }
}

function drawCar(ctx, o){
  const x = o.x, y = o.y, w = o.w, h = o.h;
  const isTruck = o.type === 'truck', isBus = o.type === 'bus';

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  rr(ctx, x - w/2 + 3, y - h/2 + 6, w, h, w*0.22);
  ctx.fill();

  if (o.type === 'cone'){
    ctx.fillStyle = '#2b2b30';
    rr(ctx, x - w/2, y + h/2 - 5, w, 6, 2); ctx.fill();
    ctx.fillStyle = '#ff7a1a';
    ctx.beginPath();
    ctx.moveTo(x, y - h/2);
    ctx.lineTo(x + w/2, y + h/2 - 4);
    ctx.lineTo(x - w/2, y + h/2 - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.moveTo(x, y - h*0.12);
    ctx.lineTo(x + w*0.26, y + h*0.16);
    ctx.lineTo(x - w*0.26, y + h*0.16);
    ctx.closePath(); ctx.fill();
    return;
  }

  const g = ctx.createLinearGradient(x - w/2, 0, x + w/2, 0);
  g.addColorStop(0, shade(o.color, -34));
  g.addColorStop(0.42, o.color);
  g.addColorStop(1, shade(o.color, -46));
  ctx.fillStyle = g;
  rr(ctx, x - w/2, y - h/2, w, h, w*0.2);
  ctx.fill();

  if (isTruck){
    ctx.fillStyle = 'rgba(248,249,252,0.94)';
    rr(ctx, x - w/2 + 3, y - h/2 + h*0.30, w - 6, h*0.66, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 2;
    for (let i=1;i<6;i++){
      const yy = y - h/2 + h*0.30 + i * (h*0.66)/6;
      ctx.beginPath(); ctx.moveTo(x - w/2 + 5, yy); ctx.lineTo(x + w/2 - 5, yy); ctx.stroke();
    }
    ctx.fillStyle = '#3b4a63';
    rr(ctx, x - w/2 + 1, y - h/2 + 2, w - 2, h*0.27, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(22,32,48,0.9)';
    rr(ctx, x - w/2 + 7, y - h/2 + h*0.08, w - 14, h*0.11, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,210,120,0.9)';
    ctx.fillRect(x - 10, y - h/2 + 4, 4, 3);
    ctx.fillRect(x + 6, y - h/2 + 4, 4, 3);
  } else if (isBus){
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(ctx, x - w/2 + 5, y - h/2 + 5, w - 10, h - 10, 9);
    ctx.fill();
    ctx.fillStyle = 'rgba(14,24,38,0.92)';
    rr(ctx, x - w/2 + 7, y - h/2 + 8, w - 14, h*0.065, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(20,30,46,0.35)';
    rr(ctx, x - w/2 + 12, y - h*0.16, w - 24, h*0.2, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(x - w/2 + 4, y - h/2 + 30, 4, h - 60);
    ctx.fillRect(x + w/2 - 8, y - h/2 + 30, 4, h - 60);
  } else {
    ctx.fillStyle = 'rgba(18,26,40,0.9)';
    rr(ctx, x - w/2 + 6, y - h/2 + 10, w - 12, h*0.2, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rr(ctx, x - w/2 + 7, y - h/2 + h*0.36, w - 14, h*0.3, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(18,26,40,0.86)';
    rr(ctx, x - w/2 + 7, y + h*0.22, w - 14, h*0.16, 4);
    ctx.fill();
  }

  ctx.fillStyle = '#ff4444';
  ctx.fillRect(x - w/2 + 4, y + h/2 - 9, 10, 5);
  ctx.fillRect(x + w/2 - 14, y + h/2 - 9, 10, 5);
  ctx.fillStyle = 'rgba(255,246,200,0.8)';
  ctx.fillRect(x - w/2 + 4, y - h/2 + 3, 9, 4);
  ctx.fillRect(x + w/2 - 13, y - h/2 + 3, 9, 4);

  if (o.blinker && (o.cutState === 'warn' || o.cutState === 'cut')){
    const on = (o.cutT * 7 | 0) % 2 === 0;
    if (on){
      const dir = o.cutTo > o.x ? 1 : -1;
      ctx.fillStyle = '#ffb020';
      ctx.beginPath();
      ctx.arc(x + dir * (w/2 - 3), y + h/2 - 14, 4.5, 0, 7);
      ctx.fill();
    }
  }
  if (o.cutter && !o.blinker && o.cutState === 'cut'){
    ctx.strokeStyle = 'rgba(255,120,90,0.55)';
    ctx.lineWidth = 2;
    rr(ctx, x - w/2 - 2, y - h/2 - 2, w + 4, h + 4, w*0.24);
    ctx.stroke();
  }
}

/* 차량 등화 (야간 가시성) */
function drawCarLights(ctx, o, strength){
  const x = o.x, y = o.y, w = o.w, h = o.h;
  if (o.type === 'cone') return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 후미등 (플레이어 쪽)
  const ry = y + h/2 - 6;
  ctx.fillStyle = 'rgba(255,40,40,' + (0.16 * strength) + ')';
  ctx.beginPath(); ctx.arc(x - w*0.30, ry, 17 * strength, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w*0.30, ry, 17 * strength, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,70,' + (0.55 * strength) + ')';
  ctx.beginPath(); ctx.arc(x - w*0.30, ry, 7 * strength, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w*0.30, ry, 7 * strength, 0, 7); ctx.fill();
  // 전조등 (앞쪽)
  const fy = y - h/2 + 5;
  ctx.fillStyle = 'rgba(255,246,210,' + (0.22 * strength) + ')';
  ctx.beginPath(); ctx.arc(x - w*0.32, fy - 6, 26 * strength, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w*0.32, fy - 6, 26 * strength, 0, 7); ctx.fill();
  ctx.restore();
}

function drawVeil(ctx, sim){
  const k = sim.theme.night;
  if (k <= 0) return;
  const px = playerX(sim), py = playerY(sim) - 30;
  const g = ctx.createRadialGradient(px, py, 80, px, py, 780);
  g.addColorStop(0, 'rgba(3,6,14,0)');
  g.addColorStop(0.42, 'rgba(3,6,14,' + (0.26 * k) + ')');
  g.addColorStop(0.74, 'rgba(3,6,14,' + (0.70 * k) + ')');
  g.addColorStop(1, 'rgba(3,6,14,' + (0.92 * k) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, WORLD_W, sim.worldH);
}

function drawBeam(ctx, sim){
  if (sim.theme.night <= 0) return;
  const x = playerX(sim), y = playerY(sim) - PLAYER.h/2 + 2;
  const len = 640;
  const g = ctx.createLinearGradient(0, y, 0, y - len);
  g.addColorStop(0, 'rgba(255,246,205,0.34)');
  g.addColorStop(0.45, 'rgba(255,246,205,0.16)');
  g.addColorStop(1, 'rgba(255,246,205,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 24, y);
  ctx.lineTo(x + 24, y);
  ctx.lineTo(x + 240, y - len);
  ctx.lineTo(x - 240, y - len);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer(ctx, sim, now){
  const x = playerX(sim), y = playerY(sim);
  const tilt = clamp(-(sim.laneVel || 0) * 0.16, -0.34, 0.34);

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  const w = PLAYER.w, h = PLAYER.h;

  const gl = ctx.createRadialGradient(0, 12, 4, 0, 12, w * 1.05);
  gl.addColorStop(0, 'rgba(120,200,255,0.20)');
  gl.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 12, w * 1.05, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  rr(ctx, -w/2 + 3, -h/2 + 8, w, h, w*0.22); ctx.fill();

  const hg = ctx.createLinearGradient(0, -h/2, 0, -h/2 - 150);
  hg.addColorStop(0, 'rgba(255,248,220,0.16)');
  hg.addColorStop(1, 'rgba(255,248,220,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(-w*0.42, -h/2 + 2);
  ctx.lineTo(w*0.42, -h/2 + 2);
  ctx.lineTo(w*1.15, -h/2 - 150);
  ctx.lineTo(-w*1.15, -h/2 - 150);
  ctx.closePath();
  ctx.fill();

  const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, '#a3121f');
  g.addColorStop(0.45, '#ff3b47');
  g.addColorStop(1, '#a3121f');
  ctx.fillStyle = g;
  rr(ctx, -w/2, -h/2, w, h, w*0.2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.6;
  rr(ctx, -w/2 + 1, -h/2 + 1, w - 2, h - 2, w*0.2); ctx.stroke();

  ctx.fillStyle = 'rgba(12,22,38,0.92)';
  rr(ctx, -w/2 + 7, -h/2 + 12, w - 14, h*0.19, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillRect(-7, -h*0.30, 5, h*0.50);
  ctx.fillRect(2, -h*0.30, 5, h*0.50);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  rr(ctx, -w/2 + 9, -h*0.02, w - 18, h*0.22, 4); ctx.fill();
  ctx.fillStyle = 'rgba(12,22,38,0.9)';
  rr(ctx, -w/2 + 8, h*0.2, w - 16, h*0.15, 4); ctx.fill();
  ctx.fillStyle = '#ff2b2b';
  ctx.fillRect(-w/2 + 4, h/2 - 10, 12, 6);
  ctx.fillRect(w/2 - 16, h/2 - 10, 12, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(-w/2 + 5, h/2 - 9, 4, 4);
  ctx.fillRect(w/2 - 9, h/2 - 9, 4, 4);
  ctx.fillStyle = 'rgba(255,250,220,0.95)';
  ctx.fillRect(-w/2 + 5, -h/2 + 4, 11, 5);
  ctx.fillRect(w/2 - 16, -h/2 + 4, 11, 5);
  ctx.restore();

  if (sim.state === 'playing' && sim.speed > 150){
    const life = (now * 3) % 1;
    ctx.fillStyle = 'rgba(220,235,255,' + (0.22 * (1 - life)) + ')';
    ctx.beginPath();
    ctx.arc(x - 12 - (sim.laneVel||0)*4, y + h/2 + 8 + life * 30, 5 + life * 5, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 12 - (sim.laneVel||0)*4, y + h/2 + 14 + life * 34, 4 + life * 4, 0, 7);
    ctx.fill();
  }

  if (sim.horn > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, sim.horn * 2);
    ctx.fillStyle = '#ffe066';
    ctx.font = '900 26px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('빵빵!', x, y - h/2 - 16 - (1 - sim.horn) * 18);
    ctx.restore();
  }
}

function drawGantry(ctx, sim){
  const g = sim.gantry;
  if (!g) return;
  const y = g.y;
  if (y < -260 || y > sim.worldH + 260) return;
  ctx.save();
  ctx.fillStyle = 'rgba(120,128,140,0.9)';
  ctx.fillRect(ROAD_L - 12, y, 7, 150);
  ctx.fillRect(ROAD_R + 5, y, 7, 150);
  ctx.fillStyle = 'rgba(160,168,180,0.9)';
  ctx.fillRect(ROAD_L - 12, y, ROAD_W + 24, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(ROAD_L - 12, y, ROAD_W + 24, 2);
  const w = 360, hgt = 108;
  const cx = WORLD_W / 2;
  ctx.fillStyle = '#0f7a3d';
  rr(ctx, cx - w/2, y + 10, w, hgt, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 4;
  rr(ctx, cx - w/2 + 6, y + 16, w - 12, hgt - 12, 8); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 46px system-ui,sans-serif';
  ctx.fillText(g.name, cx, y + 46);
  ctx.font = '700 20px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fillText(g.sub + ' · ' + g.km + 'km', cx, y + 84);
  ctx.restore();
}

function drawParticles(ctx, sim){
  for (let i=0;i<sim.particles.length;i++){
    const p = sim.particles[i];
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size * 0.7);
  }
  ctx.globalAlpha = 1;
}

function drawPops(ctx, sim){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i=0;i<sim.pops.length;i++){
    const p = sim.pops[i];
    const a = clamp(p.life / 0.9, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '900 ' + (p.size || 26) + 'px system-ui,sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color || '#fff';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawStreaks(ctx, sim){
  const sp = sim.speed;
  if (sp < 165) return;
  const a = Math.min(0.16, (sp - 165) / 900);
  const H = sim.worldH;
  ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
  ctx.lineWidth = 1.5;
  for (let i=0;i<12;i++){
    const seed = (i * 97) % 100;
    const x = ROAD_L + 10 + (seed / 100) * (ROAD_W - 20);
    const len = 150 + ((i * 53) % 190);
    const y = ((sim.scroll * 1.5 + i * 231) % (H + 400)) - 200;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + len);
    ctx.stroke();
  }
}

function drawCrashOverlay(ctx, sim){
  if (sim.state !== 'crash' && sim.state !== 'late') return;
  const t = Math.min(1, sim.crashT / 0.55);
  ctx.save();
  ctx.globalAlpha = (1 - t) * 0.9;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, WORLD_W, sim.worldH);
  ctx.globalAlpha = (1 - sim.crashT / 1.2) * 0.9;
  ctx.fillStyle = '#ffcf5c';
  ctx.beginPath();
  ctx.arc(playerX(sim), playerY(sim), 40 + t * 220, 0, 7);
  ctx.fill();
  ctx.restore();
}

function drawTitleTraffic(ctx, sim, now){
  const H = sim.worldH;
  const cars = [
    { lane:1, sp: 0.6, off: 0.0, c:'#e6e8ef' },
    { lane:3, sp: 0.9, off: 0.35, c:'#2f3d59' },
    { lane:5, sp: 0.75, off: 0.6, c:'#8c2434' },
    { lane:6, sp: 1.1, off: 0.85, c:'#4a6fa5' },
    { lane:2, sp: 0.7, off: 0.15, c:'#c8c1b2' },
    { lane:4, sp: 0.95, off: 0.45, c:'#1f6f4a' }
  ];
  const band = H * 0.5 + 260;
  for (let i=0;i<cars.length;i++){
    const cs = cars[i];
    const y = ((cs.off * band + sim.scroll * cs.sp) % band) - 240;
    drawCar(ctx, { type:'car', x: laneCenter(cs.lane), y: y, w: 50, h: 104, color: cs.c, cutter:false });
  }
}

function drawSim(ctx, sim, now){
  ctx.save();
  if (sim.shake > 0.01){
    const s = sim.shake * 16;
    ctx.translate((Math.sin(now * 71.3) * 0.5 + Math.sin(now * 133.7) * 0.5) * s,
                  (Math.cos(now * 61.1) * 0.5 + Math.cos(now * 97.3) * 0.5) * s);
  }
  drawGround(ctx, sim);
  drawRoad(ctx, sim);
  drawScenery(ctx, sim);
  drawHaze(ctx, sim);

  if (sim.state === 'title') drawTitleTraffic(ctx, sim, now);

  const list = sim.obstacles.slice().sort(function(a,b){ return a.y - b.y; });
  for (let i=0;i<list.length;i++) drawCar(ctx, list[i]);

  drawVeil(ctx, sim);

  const lightStrength = sim.theme.night > 0 ? 1 : 0.42;
  for (let i=0;i<list.length;i++) drawCarLights(ctx, list[i], lightStrength);
  drawBeam(ctx, sim);

  drawGantry(ctx, sim);
  if (sim.state !== 'crash' || sim.crashT < 0.75) drawPlayer(ctx, sim, now);
  drawParticles(ctx, sim);
  drawPops(ctx, sim);
  drawStreaks(ctx, sim);
  drawCrashOverlay(ctx, sim);
  ctx.restore();
}

/* =========================================================
   audio
   ========================================================= */
const Sfx = (function(){
  let actx = null, muted = false, engine = null, engineGain = null, master = null;

  function ensure(){
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.9;
      master.connect(actx.destination);
    } catch(e){ actx = null; }
    return actx;
  }

  function tone(freq, dur, type, vol, slideTo, delay){
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  let noiseBuf = null;
  function noise(dur, vol, f0, f1, type){
    if (muted) return;
    const c = ensure(); if (!c) return;
    if (!noiseBuf){
      const len = Math.floor(c.sampleRate * 1.2);
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = type || 'bandpass';
    flt.Q.value = 1.1;
    flt.frequency.setValueAtTime(f0, t0);
    flt.frequency.exponentialRampToValueAtTime(Math.max(80, f1), t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  return {
    unlock: function(){ ensure(); },
    isMuted: function(){ return muted; },
    setMuted: function(m){
      muted = !!m;
      if (engineGain && actx) engineGain.gain.setTargetAtTime(muted ? 0 : 0.05, actx.currentTime, 0.05);
    },
    horn: function(){
      tone(392, 0.14, 'square', 0.07, null, 0);
      tone(523, 0.14, 'square', 0.06, null, 0);
      tone(392, 0.16, 'square', 0.07, null, 0.19);
      tone(523, 0.16, 'square', 0.06, null, 0.19);
    },
    tick: function(){ tone(880, 0.05, 'triangle', 0.035, 1050, 0); },
    whoosh: function(){ noise(0.34, 0.09, 2600, 500, 'bandpass'); },
    cut: function(){
      tone(300, 0.1, 'sawtooth', 0.05, 180, 0);
      noise(0.18, 0.06, 1400, 600, 'bandpass');
    },
    crash: function(){
      noise(0.55, 0.32, 2200, 160, 'lowpass');
      tone(120, 0.5, 'sawtooth', 0.16, 40, 0);
      noise(0.25, 0.16, 900, 300, 'bandpass');
    },
    chime: function(){
      tone(660, 0.16, 'sine', 0.07, null, 0);
      tone(880, 0.16, 'sine', 0.07, null, 0.1);
      tone(1320, 0.3, 'sine', 0.06, null, 0.2);
    },
    fanfare: function(){
      [523, 659, 784, 1046].forEach(function(f, i){ tone(f, 0.24, 'triangle', 0.08, null, i * 0.12); });
      tone(1568, 0.5, 'sine', 0.05, null, 0.5);
    },
    alarm: function(){
      tone(740, 0.12, 'square', 0.07, 520, 0);
      tone(740, 0.12, 'square', 0.07, 520, 0.16);
    },
    engineStart: function(){
      const c = ensure(); if (!c || engine) return;
      engine = c.createOscillator();
      engineGain = c.createGain();
      const flt = c.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.value = 420;
      engine.type = 'sawtooth';
      engine.frequency.value = 62;
      engineGain.gain.value = muted ? 0 : 0.045;
      engine.connect(flt); flt.connect(engineGain); engineGain.connect(master);
      engine.start();
      engine._filter = flt;
    },
    engineSet: function(speed){
      if (!engine || !actx) return;
      engine.frequency.setTargetAtTime(50 + speed * 0.12, actx.currentTime, 0.12);
      if (engine._filter) engine._filter.frequency.setTargetAtTime(300 + speed * 1.6, actx.currentTime, 0.12);
    },
    engineStop: function(){
      if (engine){ try { engine.stop(); } catch(e){} engine = null; }
      if (engineGain){ try { engineGain.disconnect(); } catch(e){} engineGain = null; }
    }
  };
})();

  (function boot(){

    const startBtn = document.getElementById('startBtn');

    const retryBtn = document.getElementById('retryBtn');

    const banner1 = bannerEl.querySelector('.b1');

    const hintEl = document.getElementById('hint');
    const flashEl = document.getElementById('flash');
    const toastEl = document.getElementById('toast');

    const oTag = document.getElementById('oTag');
    const oBig = document.getElementById('oBig');
    const oTitle = document.getElementById('oTitle');

    const oScore = document.getElementById('oScore');

    let view = { sx: 1, sy: 1 };
    let sim = newGame({ worldH: 1422 });
    let overTimer = null;
    let lastMode = { kind:'stage', stage:0 };

    function fmtTime(t){
      const m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function layout(){
      const w = frame.clientWidth, h = frame.clientHeight;
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(w * dpr));
      cv.height = Math.max(1, Math.round(h * dpr));
      cv.style.width = w + 'px';
      cv.style.height = h + 'px';
      const worldH = clamp(Math.round(WORLD_W * (h / w)), 1320, 2000);
      sim.worldH = worldH;
      view.sx = cv.width / WORLD_W;
      view.sy = cv.height / worldH;
      frame.style.setProperty('--u', (w / 100) + 'px');
    }

    let toastTimer = null;
    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('on');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1900);
    }

    function updateHUD(){
      const cfg = sim.cfg;
      if (sim.mode === 'infinite'){
        remainKm.textContent = Math.floor(sim.dist);
        secName.textContent = '∞ 무한 귀경';
        nextName.textContent = '부산 → 서울 · ' + sim.waveCount + '웨이브 돌파';
        bestVal.textContent = '⏱ ' + fmtTime(sim.time);
        bestVal.classList.remove('warn');
        lateWrapShow(0);
        barFill.style.width = '100%';
        barDot.style.left = '100%';
      } else {
        const remain = Math.max(0, cfg.km - sim.dist);
        remainKm.textContent = remain >= 10 ? Math.ceil(remain) : remain.toFixed(1);
        secName.textContent = 'STAGE ' + (sim.stage+1) + ' · ' + cfg.focus;
        const nl = cfg.land[sim.landIdx];
        if (nl){
          const d = Math.max(0, nl.p * cfg.km - sim.dist);
          nextName.textContent = '다음 ' + nl.name + ' · ' + Math.ceil(d) + 'km';
        } else {
          nextName.textContent = cfg.to + ' 도착 임박!';
        }
        const left = Math.max(0, sim.lateLeft);
        const pct = sim.lateTotal > 0 ? clamp(left / sim.lateTotal * 100, 0, 100) : 0;
        lateWrapShow(1);
        lateFill.style.width = pct + '%';
        bestVal.textContent = '⏱ ' + left.toFixed(1) + 's';
        bestVal.classList.toggle('warn', pct < 25);
        const prog = clamp(sim.dist / cfg.km * 100, 0, 100);
        barFill.style.width = prog + '%';
        barDot.style.left = prog + '%';
      }
      spdVal.textContent = Math.round(sim.speed);
    }

    function lateWrapShow(v){
      const el = lateFill.parentNode.parentNode;
      el.style.opacity = v ? '1' : '0';
    }

    function banner(t1, t2){
      banner1.textContent = t1;
      banner2.textContent = t2 || '';
      bannerEl.classList.remove('show');
      void bannerEl.offsetWidth;
      bannerEl.classList.add('show');
    }

    function pop(text, x, y, color, size){
      sim.pops.push({ text: text, x: x, y: y, color: color || '#fff', size: size || 26, life: 0.9 });
      if (sim.pops.length > 10) sim.pops.shift();
    }

    /* ---------- stage select ---------- */
    function renderStages(){
      const p = loadProgress();
      stageList.innerHTML = '';
      STAGES.forEach(function(s, i){
        const n = i + 1;
        const unlocked = stageUnlocked(p, n);
        const cleared = p.cleared[n];
        const el = document.createElement('button');
        el.className = 'stageCard' + (unlocked ? '' : ' locked') + (cleared ? ' done' : '');
        const sn = unlocked ? String(n) : '🔒';
        const sb = cleared ? '✅ ' + fmtTime(cleared) : (unlocked ? '▶' : '—');
        el.innerHTML = '<div class="sn">' + sn + '</div>' +
          '<div class="sm"><div class="st">STAGE ' + n + ' · ' + s.focus + '</div>' +
          '<div class="sr">' + s.route + ' · ' + s.km + 'km</div></div>' +
          '<div class="sb">' + sb + '</div>';
        el.addEventListener('click', function(){
          if (unlocked) beginStage(i);
          else toast('STAGE ' + (n-1) + ' 완주하면 열려!');
        });
        stageList.appendChild(el);
      });
      if (p.infinite){
        const el = document.createElement('button');
        el.className = 'stageCard inf';
        el.innerHTML = '<div class="sn">∞</div>' +
          '<div class="sm"><div class="st">무한 귀경 질주 · 보너스</div>' +
          '<div class="sr">부산 → 서울 역주행 · 끝없는 챌린지</div></div>' +
          '<div class="sb">▶</div>';
        el.addEventListener('click', beginInfinite);
        stageList.appendChild(el);
      }
      const nextStage = clamp(p.unlocked, 1, STAGES.length);
      startBtn.textContent = 'STAGE ' + nextStage + ' 출발 🏁';
      const clearedCount = Object.keys(p.cleared || {}).length;
      if (p.infinite) tBest.innerHTML = '🏆 5단계 전부 완주! <span>' + SIMPLE_RECORD(p) + '</span>';
      else if (clearedCount > 0) tBest.innerHTML = '진행 ' + clearedCount + '/5 <span>' + SIMPLE_RECORD(p) + '</span>';
      else tBest.innerHTML = '스치면 데이고 데이면 끝 <span>· 400km 5단계</span>';
    }

    function SIMPLE_RECORD(p){
      let sum = 0, n = 0;
      for (let i=1;i<=STAGES.length;i++){ if (p.cleared[i]){ sum += p.cleared[i]; n++; } }
      if (!n) return '';
      return '· 클리어 기록 합 ' + fmtTime(sum);
    }

    function buildTicks(){
      barTicks.innerHTML = '';
      const cfg = sim.cfg;
      if (!cfg.land) return;
      cfg.land.forEach(function(L){
        if (L.p >= 1) return;
        const d = document.createElement('div');
        d.className = 'tick';
        d.style.left = (L.p * 100) + '%';
        barTicks.appendChild(d);
      });
    }

    /* ---------- game flow ---------- */
    function beginStage(n){
      if (overTimer){ clearTimeout(overTimer); overTimer = null; }
      lastMode = { kind:'stage', stage:n };
      sim = newGame({ stage:n, worldH: sim.worldH });
      const p = loadProgress();
      sim.bestTime = p.cleared[n+1] || 0;
      start(sim);
      buildTicks();
      titleEl.classList.add('hidden');
      overEl.classList.add('hidden');
      hud.classList.add('on');
      backBtn.classList.add('on');
      retryBtn.textContent = '다시';
      nextBtn.style.display = '';
      Sfx.unlock();
      Sfx.engineStart();
      hintEl.innerHTML = '<b>←</b> 왼쪽 탭 · <b>→</b> 오른쪽 탭 · 내 차 탭 = <b>빵빵</b>';
      hintEl.classList.add('on');
      setTimeout(function(){ hintEl.classList.remove('on'); }, 3800);
      banner('STAGE ' + (n+1) + ' · ' + sim.cfg.focus, sim.cfg.route + ' · ' + sim.cfg.km + 'km · 제한 ' + sim.cfg.lateSec + '초');
      updateHUD();
    }

    function beginInfinite(){
      if (overTimer){ clearTimeout(overTimer); overTimer = null; }
      lastMode = { kind:'infinite', stage:0 };
      sim = newGame({ mode:'infinite', worldH: sim.worldH });
      start(sim);
      buildTicks();
      titleEl.classList.add('hidden');
      overEl.classList.add('hidden');
      hud.classList.add('on');
      backBtn.classList.add('on');
      Sfx.unlock();
      Sfx.engineStart();
      hintEl.innerHTML = '끝없는 <b>귀경길</b>. 갈수록 빨라진다!';
      hintEl.classList.add('on');
      setTimeout(function(){ hintEl.classList.remove('on'); }, 3800);
      banner('∞ 무한 귀경 질주', '부산 → 서울 · 끝없는 챌린지');
      updateHUD();
    }

    function goMenu(){
      if (overTimer){ clearTimeout(overTimer); overTimer = null; }
      Sfx.engineStop();
      hud.classList.remove('on');
      backBtn.classList.remove('on');
      overEl.classList.add('hidden');
      titleEl.classList.remove('hidden');
      sim = newGame({ worldH: sim.worldH });
      renderStages();
    }

    function showOver(delay){
      if (overTimer) clearTimeout(overTimer);
      overTimer = setTimeout(function(){
        overEl.classList.remove('hidden');
      }, delay);
    }

    function handleEvents(ev){
      for (let i=0;i<ev.length;i++){
        const e = ev[i];
        if (e.type === 'kalchi'){
          Sfx.whoosh();
          pop('칼치기 +50', playerX(sim) + (sim.laneVel || 0) * 10, playerY(sim) - 70, '#ffe066', 27);
        } else if (e.type === 'cut'){
          Sfx.cut();
          pop('끼어들기!', e.obs.x, e.obs.y - 40, '#ff9f43', 23);
        } else if (e.type === 'block'){
          pop('길막!', e.obs.x, e.obs.y - 60, '#ff6b6b', 24);
        } else if (e.type === 'milestone'){
          Sfx.chime();
          const nx = sim.cfg.land[sim.landIdx];
          banner(e.m.emoji + ' ' + e.m.name + ' 통과!', '+120점 · 다음 ' + (nx ? nx.name : sim.cfg.to));
        } else if (e.type === 'crash'){
          Sfx.crash();
          Sfx.engineStop();
          flashEl.classList.remove('go');
          void flashEl.offsetWidth;
          flashEl.classList.add('go');
          onCrash(e);
        } else if (e.type === 'late'){
          Sfx.alarm();
          Sfx.engineStop();
          flashEl.classList.remove('go');
          void flashEl.offsetWidth;
          flashEl.classList.add('go');
          onLate();
        } else if (e.type === 'finish'){
          Sfx.fanfare();
          Sfx.engineStop();
          onFinish(e);
        }
      }
    }

    function stats(){
      oKm.textContent = Math.floor(sim.dist);
      oScore.textContent = sim.score.toLocaleString();
      oKalchi.textContent = sim.kalchi;
      oTime.textContent = fmtTime(sim.time);
    }

    function onCrash(e){
      hud.classList.remove('on');
      backBtn.classList.remove('on');
      overEl.classList.remove('win');
      oTag.textContent = e.info.tag;
      oBig.textContent = '💥';
      oTitle.textContent = e.info.text;
      oSub.textContent = e.info.sub;
      stats();
      const cfg = sim.cfg;
      oBest.textContent = 'STAGE ' + (sim.stage+1) + ' · ' + Math.floor(sim.dist) + '/' + cfg.km + 'km';
      nextBtn.style.display = 'none';
      retryBtn.textContent = '다시 출발 🔁';
      showOver(1000);
    }

    function onLate(){
      hud.classList.remove('on');
      backBtn.classList.remove('on');
      overEl.classList.remove('win');
      oTag.textContent = sim.endInfo.tag;
      oBig.textContent = '⏰';
      oTitle.textContent = sim.endInfo.text;
      oSub.textContent = sim.endInfo.sub;
      stats();
      oBest.textContent = 'STAGE ' + (sim.stage+1) + ' · 제한 ' + sim.cfg.lateSec + '초 초과';
      nextBtn.style.display = 'none';
      retryBtn.textContent = '다시 출발 🔁';
      showOver(900);
    }

    function onFinish(e){
      hud.classList.remove('on');
      backBtn.classList.remove('on');
      overEl.classList.add('win');
      const p = loadProgress();
      const res = recordClear(p, e.stage, e.time, e.score);
      saveProgress(p);
      const clearedAll = Object.keys(p.cleared).length;
      oTag.textContent = 'STAGE ' + e.stage + ' 클리어!';
      oBig.textContent = e.stage === STAGES.length ? '🌊' : '🏁';
      if (e.stage === STAGES.length){
        oTitle.textContent = '부산 도착! 400km 완주 🍲';
        oSub.textContent = '돼지국밥 한 그릇 뚝딱 · 5단계 전부 클리어! 무한 귀경 해금';
        oBig.textContent = '🌊';
      } else {
        const nx = STAGES[e.stage];
        oTitle.textContent = sim.cfg.to + ' 도착! ' + sim.cfg.to + '에서 한 숨 🍜';
        oSub.textContent = '다음 STAGE ' + (e.stage+1) + ' · ' + nx.route + ' 해금!';
      }
      stats();
      oBest.textContent = '기록 ' + fmtTime(e.time) + ' · 시간 보너스 +' + e.timeBonus + ' · 클리어 ' + clearedAll + '/5';
      if (e.stage < STAGES.length){
        nextBtn.style.display = '';
        nextBtn.textContent = 'STAGE ' + (e.stage+1) + ' 이어서 ▶';
        retryBtn.textContent = '다시';
      } else {
        nextBtn.style.display = '';
        nextBtn.textContent = '∞ 무한 귀경 ▶';
        retryBtn.textContent = '다시';
      }
      showOver(750);
    }

    /* ---------- input ---------- */
    let ptr = null;

    function worldXFromClient(clientX){
      const r = frame.getBoundingClientRect();
      return (clientX - r.left) / r.width * WORLD_W;
    }

    function onDown(clientX, clientY){
      if (sim.state !== 'playing') return;
      ptr = { x: clientX, y: clientY, startX: clientX, moved: false, t: performance.now() };
      Sfx.unlock();
    }

    function onMove(clientX, clientY){
      if (!ptr || sim.state !== 'playing') return;
      const dx = clientX - ptr.startX;
      const step = Math.max(22, frame.clientWidth * 0.075);
      if (Math.abs(dx) >= step){
        const dir = dx > 0 ? 1 : -1;
        if (steer(sim, dir)) Sfx.tick();
        ptr.startX = clientX;
        ptr.moved = true;
      }
      if (Math.abs(clientY - ptr.y) > 18) ptr.moved = true;
    }

    function onUp(clientX, clientY){
      if (!ptr) return;
      const dt = performance.now() - ptr.t;
      const dx = clientX - ptr.startX;
      if (!ptr.moved && dt < 400 && Math.abs(dx) < 22 && sim.state === 'playing'){
        const wx = worldXFromClient(clientX);
        const cx = playerX(sim);
        const half = PLAYER.w * 0.75;
        if (wx < cx - half){
          if (steer(sim, -1)) Sfx.tick();
        } else if (wx > cx + half){
          if (steer(sim, 1)) Sfx.tick();
        } else {
          sim.horn = 1;
          Sfx.horn();
        }
      }
      ptr = null;
    }

    cv.addEventListener('pointerdown', function(e){
      e.preventDefault();
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
      onDown(e.clientX, e.clientY);
    });
    cv.addEventListener('pointermove', function(e){ onMove(e.clientX, e.clientY); });
    cv.addEventListener('pointerup', function(e){ onUp(e.clientX, e.clientY); });
    cv.addEventListener('pointercancel', function(){ ptr = null; });
    cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

    window.addEventListener('keydown', function(e){
      if (e.repeat) return;
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A'){
        if (sim.state === 'playing' && steer(sim, -1)) Sfx.tick();
        e.preventDefault();
      } else if (k === 'ArrowRight' || k === 'd' || k === 'D'){
        if (sim.state === 'playing' && steer(sim, 1)) Sfx.tick();
        e.preventDefault();
      } else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){
        if (sim.state === 'playing'){ sim.horn = 1; Sfx.horn(); }
        e.preventDefault();
      } else if (k === 'r' || k === 'R'){
        if (lastMode.kind === 'infinite') beginInfinite(); else beginStage(lastMode.stage);
      } else if (k === 'm' || k === 'M'){
        toggleMute();
      } else if (k === 'Escape'){
        goMenu();
      } else if (k === 'Enter'){
        if (sim.state === 'title') beginStage(loadProgress().unlocked - 1);
        else if (sim.state === 'finish'){
          if (sim.stage + 1 < STAGES.length) beginStage(sim.stage + 1); else beginInfinite();
        } else if (sim.state === 'crash' || sim.state === 'late'){
          beginStage(sim.stage);
        }
      }
    });

    function toggleMute(){
      Sfx.setMuted(!Sfx.isMuted());
      muteBtn.textContent = Sfx.isMuted() ? '🔇' : '🔊';
    }
    muteBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleMute(); });
    backBtn.addEventListener('click', function(e){ e.stopPropagation(); goMenu(); });

    startBtn.addEventListener('click', function(){
      beginStage(clamp(loadProgress().unlocked - 1, 0, STAGES.length-1));
    });
    nextBtn.addEventListener('click', function(){
      if (sim.state === 'finish'){
        if (sim.stage + 1 < STAGES.length) beginStage(sim.stage + 1);
        else beginInfinite();
      }
    });
    retryBtn.addEventListener('click', function(){
      if (lastMode.kind === 'infinite') beginInfinite();
      else beginStage(lastMode.stage);
    });
    menuBtn2.addEventListener('click', goMenu);
    shareBtn.addEventListener('click', async function(){
      let text;
      if (sim.state === 'finish') text = '서울→부산 400km · STAGE ' + (sim.stage+1) + ' 클리어 (' + fmtTime(sim.time) + ') 🏁';
      else text = '서울→부산 STAGE ' + (sim.stage+1) + ' · ' + Math.floor(sim.dist) + 'km에서 폐차 💥';
      const url = location.href;
      try {
        if (navigator.share) await navigator.share({ title: '🚗 서울→부산 8차로 질주', text: text, url: url });
        else await navigator.clipboard.writeText(text + ' ' + url);
        shareBtn.textContent = '복사됨!';
        setTimeout(function(){ shareBtn.textContent = '공유'; }, 1600);
      } catch(err){
        shareBtn.textContent = '공유';
      }
    });

    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });

    /* ---------- loop ---------- */
    let lastT = 0;
    let lastHudT = 0;

    function loop(t){
      if (!lastT) lastT = t;
      let dt = (t - lastT) / 1000;
      lastT = t;
      if (dt > 0.1) dt = 0.1;
      if (dt < 0) dt = 0;

      if (sim.state === 'title') sim.scroll = (sim.scroll || 0) + 210 * dt;
      if (sim.horn > 0) sim.horn = Math.max(0, sim.horn - dt * 1.6);

      const ev = update(sim, dt);
      if (ev.length) handleEvents(ev);

      ctx.setTransform(view.sx, 0, 0, view.sy, 0, 0);
      drawSim(ctx, sim, t / 1000);

      lastHudT += dt;
      if (lastHudT > 0.06){
        lastHudT = 0;
        if (sim.state === 'playing') updateHUD();
      }
      if (sim.state === 'playing') Sfx.engineSet(sim.speed);

      requestAnimationFrame(loop);
    }

    layout();
    renderStages();
    requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', function(){ lastT = 0; });
  })();
}

})();
</script>
</body>
</html>
