<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>busan 390x680 verify</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f18;overflow:hidden}
  #f{display:block;width:390px;height:680px;border:0;background:#000}
</style>
</head>
<body>
<iframe id="f" src="./index.html" title="서울→부산 390x680 검증"></iframe>
<script>
  /* 검증용: ?cb=캐시버스터 로 게임 문서를 새로 받는다 (Pages 캐시 회피) */
  (function(){
    var q = new URLSearchParams(location.search);
    var cb = q.get('cb');
    if (cb) document.getElementById('f').src = './index.html?cb=' + encodeURIComponent(cb);
  })();
</script>
</body>
</html>
