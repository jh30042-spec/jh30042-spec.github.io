<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>busan 390×680 capture (POST 차단)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #f{width:390px;height:680px;border:0;display:block;background:#0b1220}
</style>
</head>
<body>
<iframe id="f" src="./index.html?shot=122"></iframe>
<script>
/* 검증용: 게임오버 화면을 보면서 Firebase에 기록을 남기지 않도록 POST만 막는다. GET은 그대로 둔다. */
document.getElementById('f').addEventListener('load', function(){
  var w = this.contentWindow;
  try {
    Object.defineProperty(w.navigator, 'userAgent', {
      value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 10.0',
      configurable: true
    });
    var origFetch = w.fetch.bind(w);
    w.fetch = function(url, init){
      if (init && String(init.method || '').toUpperCase() === 'POST'){
        document.title = 'busan 390×680 capture · POST 차단됨';
        return Promise.resolve({ ok: true, status: 200, json: function(){ return Promise.resolve({}); } });
      }
      return origFetch(url, init);
    };
    w.dispatchEvent(new w.Event('resize'));
  } catch (e){ document.title = 'stub failed: ' + e; }
});
</script>
</body>
</html>
