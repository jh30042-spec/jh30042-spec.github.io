<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>cap 390x680</title>
<style>html,body{margin:0;padding:0;background:#05070d;overflow:hidden;height:100%}
iframe{display:block;width:390px;height:680px;border:0;overflow:hidden}</style>
</head><body><iframe id="f" src="./index.html" width="390" height="680" scrolling="no"></iframe>
<script>
/* 캡처 전용: 게임 문서의 오버레이 스크롤바를 숨긴다 (게임 동작에는 영향 없음) */
document.getElementById('f').addEventListener('load', function(){
  try {
    var d = this.contentDocument; if (!d) return;
    var s = d.createElement('style');
    s.textContent = 'html,body{scrollbar-width:none!important;overflow:hidden!important}' +
      'html::-webkit-scrollbar,body::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}' +
      '*::-webkit-scrollbar{width:0!important;height:0!important}';
    d.head.appendChild(s);
  } catch(e){}
});
</script>
</body></html>
