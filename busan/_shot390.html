<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>busan 390×680 capture</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #f{width:390px;height:680px;border:0;display:block;background:#0b1220}
</style>
</head>
<body>
<iframe id="f" src="./index.html?shot=1"></iframe>
<script>
/* 검증용 캐처: 390×680 프레임 안에서 카카오톡 인앱 UA로 게임을 띄운다 */
document.getElementById('f').addEventListener('load', function(){
  var w = this.contentWindow;
  try {
    Object.defineProperty(w.navigator, 'userAgent', {
      value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 10.0',
      configurable: true
    });
    w.dispatchEvent(new w.Event('resize'));
    setTimeout(function(){ w.dispatchEvent(new w.Event('resize')); }, 400);
  } catch (e){ document.title = 'ua override failed: ' + e; }
});
</script>
</body>
</html>
