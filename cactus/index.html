   ============================================================ */
function processFx(st) {
  if (App.lastFx === 0) { App.lastFx = st.fxSeq; return; }
  var list = st.fx.filter(function (f) { return f.i > App.lastFx; });
  if (!list.length) { App.lastFx = st.fxSeq; return; }
  App.lastFx = st.fxSeq;
  list.forEach(playFx);
}

function center(el) {
  if (!el) return null;
  var r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r };
}
function bubble(seat, text, icon, ms) {
  var el = seatEl(seat); if (!el) return;
  var c = center(el); if (!c) return;
  var b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = (icon ? icon + ' ' : '') + text;
  $('#bubbles').appendChild(b);
  var w = Math.min(200, Math.max(90, text.length * 12 + 30));
  var x = Math.min(Math.max(c.x, w / 2 + 6), window.innerWidth - w / 2 - 6);
  var y = Math.max(c.y - c.r.height / 2 - 4, 46);
  b.style.left = x + 'px'; b.style.top = y + 'px';
  setTimeout(function () {
    b.style.transition = 'opacity .3s, transform .3s';
    b.style.opacity = '0'; b.style.transform = 'translate(-50%,-135%)';
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 330);
  }, ms || 1900);
}
function floatTxt(seat, txt, color) {
  var c = center(seatEl(seat)); if (!c) return;
  var d = document.createElement('div');
  d.className = 'floatTxt';
  d.textContent = txt;
  d.style.color = color || '#fff';
  d.style.left = c.x + 'px'; d.style.top = c.y + 'px';
  $('#fxLayer').appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1100);
}
function puff(seat, emoji) {
  var c = center(seatEl(seat)); if (!c) return;
  var d = document.createElement('div');
  d.className = 'puff'; d.textContent = emoji;
  d.style.left = (c.x - 13) + 'px'; d.style.top = (c.y - 20) + 'px';
  $('#fxLayer').appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 750);
}
function flyCard(fromSeat, toSeat, icon, color) {
  var a = center(seatEl(fromSeat)), b = center(seatEl(toSeat));
  if (!a || !b) return;
  var d = document.createElement('div');
  d.className = 'flyCard';
  d.textContent = icon || '🌵';
  if (color) d.style.background = color;
  d.style.left = (a.x - 22) + 'px'; d.style.top = (a.y - 31) + 'px';
  $('#fxLayer').appendChild(d);
  try {
    var anim = d.animate([
      { transform: 'translate(0,0) scale(.7) rotate(-8deg)', opacity: .2 },
      { transform: 'translate(' + ((b.x - a.x) * 0.45) + 'px,' + ((b.y - a.y) * 0.45 - 34) + 'px) scale(1.15)', opacity: 1, offset: .5 },
      { transform: 'translate(' + (b.x - a.x) + 'px,' + (b.y - a.y) + 'px) scale(.72) rotate(6deg)', opacity: .9 }
    ], { duration: 440, easing: 'cubic-bezier(.3,-0.15,.55,1)' });
    anim.onfinish = function () {
      d.style.transition = 'opacity .16s'; d.style.opacity = '0';
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 180);
    };
  } catch (e) { setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 380); }
}
function shakeSeat(seat) {
  var el = seat === App.seat ? $('#meAvatar') : $('.opp[data-seat="' + seat + '"]');
  if (!el) return;
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  setTimeout(function () { el.classList.remove('hit'); }, 500);
}

/* ============================================================
   화면 중앙 대형 도발/액션 임팩트
   ============================================================ */
var Impact = { token: 0, hideT: null };
var IMPACT_EXPR = { taunt: 'taunt', block: 'hit', stealFail: 'sad', demandFail: 'taunt', frozen: 'sad', freeze: 'hit',
  skip: 'taunt', reverse: 'win', wall: 'win', wallBlock: 'hit' };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shakeBig() {
  var app = document.getElementById('app');
  if (!app) return;
  app.classList.remove('shakeBig');
  void app.offsetWidth;
  app.classList.add('shakeBig');
  clearTimeout(shakeBig._t);
  shakeBig._t = setTimeout(function () { app.classList.remove('shakeBig'); }, 440);
}
function impact(o) {
  var st = App.st;
  if (!st) return;
  var seat = o.seat == null ? App.seat : o.seat;
  var p = st.players[seat] || { name: '?', avatar: 0 };
  var el = $('#impact');
  if (!el) return;
  var tok = ++Impact.token;
  var expr = IMPACT_EXPR[o.kind] || 'taunt';
  var sparks = '';
  for (var i = 0; i < 12; i++) {
    sparks += '<i style="--a:' + ((i * 30) + 12) + 'deg;--d:' + (66 + (i % 4) * 36) + 'px;animation-delay:' + ((i % 3) * 0.02).toFixed(2) + 's"></i>';
  }
  el.className = 'show k-' + (o.kind || 'taunt');
  el.innerHTML = '<div class="impFlash"></div>' +
    '<div class="impWrap">' +
    '<div class="impRing"></div><div class="impRing r2"></div>' +
    '<div class="impSpark">' + sparks + '</div>' +
    '<div class="impChar">' + cactusSVG(p.avatar, expr) + '</div>' +
    '<div class="impIcon">' + esc(o.icon || '😝') + '</div>' +
    '<div class="impText"></div>' +
    '<div class="impWho"></div>' +
    '</div>';
  $('.impText', el).textContent = o.text || '메롱~';
  $('.impWho', el).textContent = p.name + (o.kind === 'block' ? ' · 방패로 팅!' : (o.kind === 'wallBlock' ? ' · 방어막으로 팅!' : ''));
  Sound.impact(o.kind);
  vibrate(o.kind === 'freeze' ? [10, 30, 10] : [16, 40, 26]);
  shakeBig();
  if (Impact.hideT) clearTimeout(Impact.hideT);
  Impact.hideT = setTimeout(function () {
    if (Impact.token !== tok) return;
    el.className = 'hidden';
    el.innerHTML = '';
  }, 1350);
}

function playFx(f) {
  var st = App.st;
  switch (f.t) {
    case 'draw':
      Sound.card(); vibrate(8);
      flyCard(App.seat, f.seat, '🌵', 'linear-gradient(180deg,#7a58a3,#3a1f56)');
      break;
    case 'steal':
      Sound.steal(); vibrate(18);
      flyCard(f.defender, f.attacker, (E.cardInfo(f.card) || {}).icon || '🌵', cardColor(f.card));
      bubble(f.defender, '😱', '', 1100);
      shakeSeat(f.defender);
      floatTxt(f.defender, '뺏김!', '#ff9b8a');
      break;
    case 'demand':
      Sound.steal(); vibrate(22);
      for (var k = 0; k < Math.min(f.n, 3); k++) {
        setTimeout(function () { flyCard(f.defender, f.attacker, '🌵', '#63cdff'); }, k * 110);
      }
      bubble(f.defender, '다 가져가?!', '😭', 1400);
      floatTxt(f.defender, '−' + f.n, '#ff9b8a');
      break;
    case 'demandFail':
      Sound.bad();
      bubble(f.defender, '없지롱~', '😝', 1500);
      break;
    case 'stealFail':
      Sound.bad();
      bubble(f.defender, '손 비었는데?', '😶', 1400);
      break;
    case 'block':
      Sound.shield(); vibrate(30);
      puff(f.defender, '🛡️'); puff(f.attacker, '💥');
      bubble(f.defender, '팅! 튕겼다!', '🛡️', 1600);
      shakeSeat(f.attacker);
      break;
    case 'bomb':
      Sound.bomb(); vibrate([20, 40, 30]);
      flyCard(f.attacker, f.defender, '💣', 'linear-gradient(180deg,#7a3a2a,#3b1712)');
      bubble(f.defender, '이거 왜 나한테!', '💣', 1600);
      break;
    case 'flip':
      Sound.blip(300, 1500, 0.3, 'sine', 0.16); vibrate(12);
      puff(f.seat, '🌀'); puff(f.withSeat != null ? f.withSeat : f.seat, '🌀');
      break;
    case 'score':
      Sound.fanfare(); vibrate([15, 40, 15, 40, 30]);
      floatTxt(f.seat, '+' + f.pts, '#ffd34d');
      bubble(f.seat, '+' + f.pts + '점!', '🎉', 1800);
      var el = f.seat === App.seat ? $('#meAvatar') : $('.opp[data-seat="' + f.seat + '"] .avWrap');
      if (el) { el.innerHTML = cactusSVG(st.players[f.seat].avatar, 'win'); el.parentNode.setAttribute('data-expr', 'win'); }
      setTimeout(function () { puff(f.seat, '✨'); }, 160); setTimeout(function () { puff(f.seat, '🌟'); }, 320);
      break;
    case 'taunt':
      Sound.taunt(); vibrate(10);
      impact({ seat: f.seat, icon: f.icon, text: f.text, kind: 'taunt' });
      break;
    case 'impact':
      // 내가 방금 보낸 도발이 서버에서 돌아온 메아리는 두 번 보여주지 않는다
      if (f.by && Net.cid && f.by === Net.cid) break;
      impact({ seat: f.seat, icon: f.icon, text: f.text, kind: f.kind });
      break;
    case 'draw3':
      Sound.card(); setTimeout(function () { Sound.card(); }, 100); setTimeout(function () { Sound.fanfare(); }, 210);
      vibrate([8, 20, 8]);
      bubble(f.seat, '한 번에 ' + f.n + '장!', '🎁', 1600);
      floatTxt(f.seat, '+' + f.n + '장', '#c8ff8a');
      for (var d3 = 0; d3 < Math.min(f.n, 3); d3++) setTimeout(function () { puff(f.seat, '🃏'); }, d3 * 90);
      break;
    case 'swapAll':
      Sound.swap(); vibrate([20, 40, 30]);
      puff(f.attacker, '🔄'); puff(f.defender, '🔄');
      bubble(f.defender, '내 패!!', '😱', 1700);
      floatTxt(f.defender, '−' + f.dN + ' / +' + f.aN, '#ff9b8a');
      break;
    case 'freeze':
      Sound.ice(); vibrate([10, 30, 10]);
      bubble(f.defender, '얼음! 다음 턴 없다', '🧊', 1900);
      puff(f.defender, '❄️');
      break;
    case 'frozenSkip':
      Sound.ice(); vibrate(20);
      bubble(f.seat, '꽁꽁… 이번 턴 건너뜀', '🧊', 1700);
      puff(f.seat, '❄️');
      break;
    case 'shieldOpen':
      if (!f.auto && f.defender !== App.seat) { toast('🛡️ ' + st.players[f.defender].name + ' 방패를 들었다! 5초!', 1900); }
      else { bubble(f.defender, '?', '🛡️', 900); }
      var oe = $('.opp[data-seat="' + f.defender + '"]');
      if (oe) { oe.classList.add('shield'); setTimeout(function () { oe.classList.remove('shield'); }, 1600); }
      break;
    case 'wall':
      Sound.shield(); vibrate([10, 20, 10]);
      puff(f.seat, '🛡️');
      if (f.seat !== App.seat) bubble(f.seat, '가시 갑옷!', '🛡️', 1500);
      break;
    case 'wallBlock':
      Sound.shield(); vibrate(30);
      puff(f.defender, '🛡️'); puff(f.attacker, '💥');
      bubble(f.defender, '팅! 방어막!', '🛡️', 1700);
      shakeSeat(f.attacker);
      break;
    case 'reverse':
      vibrate([12, 30, 12]);
      break;
    case 'bombBounce':
      Sound.bad();
      bubble(f.attacker, '손이 꽉 찼네…', '💣', 1500);
      break;
    case 'win':
      Sound.win(); vibrate([30, 60, 30, 60, 60]);
      break;
  }
}

/* ============================================================
   방패 오버레이
   ============================================================ */
var shieldTimer = null;
function renderShield() {
  var st = App.st;
  var box = $('#shield');
  var pend = st && st.pending;
  var mine = pend && pend.defender === App.seat && !pend.auto;
  if (!mine) {
    box.classList.add('hidden');
    box.innerHTML = '';
    if (shieldTimer) { clearInterval(shieldTimer); shieldTimer = null; }
    return;
  }
  if (box.getAttribute('data-p') === String(pend.openedAt)) return;
  box.setAttribute('data-p', String(pend.openedAt));
  box.classList.remove('hidden');
  var atk = st.players[pend.attacker].name;
  var whatMap = { steal: '🤏 슬쩍!', demand: '👀 이거 있냐?', bomb: '💣 썩은 선인장!', swapAll: '🔄 손패 바꾸기!', freeze: '🧊 정지!' };
  var what = whatMap[pend.action] || '공격!';
  box.innerHTML = '<div class="shWrap">' +
    '<div class="shHead"><div class="who">' + atk + '의 ' + what + '</div>' +
    '<div class="warn">뺏긴다!!</div></div>' +
    '<button class="shBtn" id="shieldBtn"><span class="ic">🛡️</span><span class="tx">방패 치기!</span><span class="num" id="shieldNum">5</span></button>' +
    '<div class="shBar"><i id="shieldBar" style="width:100%"></i></div>' +
    '<div class="shHint">5초 안에 눌러야 막을 수 있어! 안 누르면 그대로 뺏긴다</div>' +
    '</div>';
  $('#shieldBtn').addEventListener('click', function () {
    Sound.shield(); vibrate(40);
    doShield(true);
  });
  if (shieldTimer) clearInterval(shieldTimer);
  shieldTimer = setInterval(function () {
    var p2 = App.st && App.st.pending;
    if (!p2) { clearInterval(shieldTimer); shieldTimer = null; $('#shield').classList.add('hidden'); return; }
    var left = Math.max(0, p2.deadline - Date.now());
    var pct = Math.max(0, Math.min(100, left / (E.SHIELD_MS) * 100));
    var num = $('#shieldNum'), bar = $('#shieldBar');
    if (num) num.textContent = (left / 1000).toFixed(1);
    if (bar) bar.style.width = pct + '%';
  }, 80);
}

/* ============================================================
   액션
   ============================================================ */
function sendIntent(obj) {
  if (!App.net || !App.net.code) return;
  if (Date.now() < App.busyUntil) return;
  App.busyUntil = Date.now() + 380;
  obj.cid = App.net.cid;
  obj.seat = App.seat;
  obj.at = Date.now();
  dbFetch(App.net.code, '/intents/' + App.seat, 'PUT', obj).catch(function () {});
}

function afterLocal() {
  publish();
  render();
}

function doDraw() {
  if (!myTurn()) return toast('아직 네 차례가 아니야!');
  if (!iCanAct()) { sendIntent({ type: 'draw' }); return; }
  var r = E.draw(App.st, App.seat);
  if (!r.ok) return toast(r.err);
  afterLocal();
}

function doPass() {
  if (!myTurn()) return;
  if (!iCanAct()) { sendIntent({ type: 'pass' }); return; }
  E.endTurn(App.st);
  afterLocal();
}

function doScore(type) {
  if (!myTurn()) return toast('네 차례에만 점수를 낼 수 있어!');
  if (!iCanAct()) { sendIntent({ type: 'score', ctype: type }); return; }
  var r = E.scoreSet(App.st, App.seat, type);
  if (!r.ok) return toast(r.err);
  afterLocal();
}

function doDiscard(cardId) {
  if (!iCanAct()) { sendIntent({ type: 'discard', card: cardId }); return; }
  var r = E.discardCard(App.st, App.seat, cardId);
  if (!r.ok) return toast(r.err);
  App.trashMode = false;
  afterLocal();
}

function doShield(use) {
  if (!iCanAct()) { sendIntent({ type: 'shield', use: !!use }); $('#shield').classList.add('hidden'); return; }
  E.resolveShield(App.st, App.seat, use);
  $('#shield').classList.add('hidden');
  afterLocal();
}

function doPlay(cardId, payload) {
  if (!myTurn()) return toast('네 차례에만 낼 수 있어!');
  if (App.st.acted) return toast('이번 턴엔 이미 행동했어!');
  if (!iCanAct()) { sendIntent({ type: 'play', card: cardId, payload: payload }); return; }
  var r = E.playCard(App.st, App.seat, cardId, payload || {});
  if (!r.ok) return toast(r.err);
  App.targetMode = null;
  afterLocal();
}

/* --- v3: ⚡ 즉시 카드 (내 턴이 아니어도 바로 사용) --- */
function doInstant(cardId, payload) {
  var st = App.st;
  if (!st || st.phase !== 'playing') return;
  if (st.pending) return toast('🛡️ 방패 판정 중엔 즉시 카드를 못 써! 방어부터!', 1900);
  if (Date.now() < App.instantUntil) return toast('너무 빨라! 잠깐만~', 900);
  Sound.blip(1400, 900, 0.08, 'square', 0.14); vibrate(14);
  if (!iCanAct()) {
    App.instantUntil = Date.now() + 500;
    sendIntent({ type: 'instant', card: cardId, payload: payload || {} });
    return;
  }
  var r = E.playInstant(st, App.seat, cardId, payload || {});
  if (!r.ok) return toast(r.err);
  App.instantUntil = Date.now() + 500;
  App.targetMode = null;
  afterLocal();
}

function tapInstant(act, p) {
  var ids = p.hand.filter(function (id) { return (E.cardInfo(id) || {}).act === act; });
  if (!ids.length) return;
  var cardId = ids[0];
  var st = App.st;
  if (st.phase !== 'playing') return;
  if (st.pending) { toast('🛡️ 방패 판정 중! 방어 버튼을 먼저 눌러!', 1700); return; }
  if (act === 'freeze') {           // 지목이 필요한 유일한 즉시 카드
    if (Date.now() < App.instantUntil) { toast('너무 빨라! 잠깐만~', 800); return; }
    App.targetMode = { card: cardId, act: 'freeze', needTarget: true, target: null, instant: true };
    toast('🧊 얼릴 상대를 톡!', 1400);
    render();
    return;
  }
  doInstant(cardId, {});
}

/* --- 손패 탭 --- */
function onHandTap(e) {
  var btn = e.target.closest('.hcard');
  if (!btn) return;
  var st = App.st;
  if (!st) return;
  var p = st.players[App.seat];
  if (!p) return;
  var kind = btn.getAttribute('data-kind');
  var actAttr = kind === 'action' ? btn.getAttribute('data-act') : null;
  var actDef = actAttr ? E.ACTIONS[actAttr] : null;
  // ⚡ 즉시 카드는 남의 턴에도 활성
  if (actDef && actDef.instant) { tapInstant(actAttr, p); return; }
  if (!myTurn()) { toast('지금은 네 차례가 아니야! (⚡ 즉시 카드는 아무 때나 써)', 1800); return; }
  if (App.trashMode) {
    var groups = handGroups(st, App.seat);
    var g = groups.filter(function (x) {
      return kind === 'cactus' ? (x.kind === 'cactus' && x.type === btn.getAttribute('data-type')) : (x.kind === 'action' && x.act === actAttr);
    })[0];
    if (g) doDiscard(g.ids[0]);
    return;
  }
  if (kind === 'cactus') {
    var type = btn.getAttribute('data-type');
    var n = E.countType(p, type);
    var c = E.CACTUS.filter(function (x) { return x.key === type; })[0];
    if (n >= 3) { doScore(type); return; }
    Sound.blip(520, 760, 0.08, 'triangle', 0.1);
    bubble(App.seat, c.name + ' ' + n + '/3 · +' + c.pts + '점', '🌵', 1400);
    return;
  }
  var act = actAttr;
  var ids = p.hand.filter(function (id) { return (E.cardInfo(id) || {}).act === act; });
  if (!ids.length) return;
  var cardId = ids[0];
  Sound.blip(600, 900, 0.07, 'sine', 0.1);
  if (act === 'flip') { openFlipModal(cardId); return; }
  var def = E.ACTIONS[act];
  if (def && def.needTarget === false) { doPlay(cardId, {}); return; }
  App.targetMode = { card: cardId, act: act, needsType: act === 'demand', target: null };
  render();
}

function onOppTap(e) {
  var el = e.target.closest('.opp');
  if (!el) return;
  if (!App.targetMode) return;
  var seat = +el.getAttribute('data-seat');
  var act = App.targetMode.act;
  var instant = !!App.targetMode.instant;
  var card = App.targetMode.card;
  if (act === 'demand') {
    App.targetMode.target = seat;
    openTypeModal(App.targetMode.card, seat);
    return;
  }
  App.targetMode = null;
  if (instant) doInstant(card, { target: seat });
  else doPlay(card, { target: seat });
}

/* --- 타입 선택 모달 --- */
function openTypeModal(cardId, targetSeat) {
  var st = App.st;
  var p = st.players[App.seat];
  var counts = E.handCounts(p);
  var html = '<div class="mCard">' +
    '<h2>👀 이거 있냐?</h2>' +
    '<p>' + st.players[targetSeat].name + '에게 어떤 선인장을 요구할까?<br>있으면 <b>전부</b> 뺏어온다!</p>' +
    '<div class="typeGrid">' +
    E.CACTUS.map(function (c, i) {
      return '<button class="typeBtn" data-type="' + c.key + '">' + cactusSVG(i, 'idle') +
        '<b>' + c.name + '</b><span>' + c.pts + '점 · 내 ' + (counts[c.key] || 0) + '장</span></button>';
    }).join('') + '</div>' +
    '<button class="mClose" id="mCancel">취소</button></div>';
  modal(html);
  $('#mCancel').addEventListener('click', function () { closeModal(); App.targetMode = null; render(); });
  $$('.typeBtn').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-type');
      closeModal();
      App.targetMode = null;

  });
}

/* --- 판 뒤집기 모달 --- */
function openFlipModal(cardId) {
  var st = App.st;
  var lead = E.leaderSeat(st, App.seat);
  var leadName = lead >= 0 ? st.players[lead].name : '아무도';
  modal('<div class="mCard">' +
    '<h2>🌀 판 뒤집기</h2>' +
    '<p>어떻게 뒤집을까?</p>' +
    '<button class="btn primary" id="flipSwap" style="height:56px">🥇 ' + leadName + '와 1장 맞바꾸기</button>' +
    '<button class="btn ghost" id="flipRot" style="height:56px">🌀 전원 1장씩 옆으로 돌리기</button>' +
    '<button class="mClose" id="mCancel">취소</button></div>');
  $('#mCancel').addEventListener('click', function () { closeModal(); });
  $('#flipSwap').addEventListener('click', function () { closeModal(); doPlay(cardId, { mode: 'swap' }); });
  $('#flipRot').addEventListener('click', function () { closeModal(); doPlay(cardId, { mode: 'rotate' }); });
}

/* --- 도발 --- */
function doTaunt(icon, text) {
  var now = Date.now();
  if (now < App.tauntUntil) { toast('연타 금지! 1초만 쉬어 ㅋㅋ', 900); return; }
  App.tauntUntil = now + 900;
  vibrate(12); Sound.taunt();
  var st = App.st;
  if (!st) return;
  if (App.mode === 'room' && !iCanAct()) {
    // 클라이언트: 내 화면엔 바로 쾅, 서버로 보내 모두에게
    impact({ seat: App.seat, icon: icon, text: text, kind: 'taunt' });
    sendIntent({ type: 'taunt', icon: icon, text: text });
    return;
  }
  st.fxSeq++;
  st.fx.push({ i: st.fxSeq, t: 'impact', kind: 'taunt', seat: App.seat, icon: icon, text: text });
  if (st.fx.length > 16) st.fx.shift();
  st.logSeq++;
  st.log.push({ i: st.logSeq, text: '😝 ' + st.players[App.seat].name + ' "' + text + '"' });
  if (st.log.length > 40) st.log.shift();
  afterLocal();
}

/* ============================================================
   봇 진행
   ============================================================ */
function scheduleBot() {
  if (App.botTimer) return;
  var st = App.st;
  if (!st || st.phase !== 'playing') return;
  if (!iCanAct()) return;
  if (st.pending) {
    App.botTimer = setTimeout(function () {
      App.botTimer = null;
      var changed = E.tick(App.st, Date.now());
      if (changed) { publish(); }
      render();
    }, 120);
    return;
  }
  var p = st.players[st.turn];
  if (!p) return;
  if (!p.bot) {
    // 사람 턴인데 방장이 아니면 아무것도 안 함
    return;
  }
  App.botTimer = setTimeout(function () {
    App.botTimer = null;
    var s2 = App.st;
    if (!s2 || s2.phase !== 'playing') return;
    if (s2.pending) { render(); return; }
    if (!s2.players[s2.turn] || !s2.players[s2.turn].bot) { render(); return; }
    var acted = E.botStep(s2);
    if (acted && Math.random() < 0.2) {
      var bp = s2.players[s2.turn] || s2.players[(s2.turn + s2.players.length - 1) % s2.players.length];
      var bt = BOT_TAUNTS[Math.floor(Math.random() * BOT_TAUNTS.length)];
      s2.fxSeq++; s2.fx.push({ i: s2.fxSeq, t: 'impact', kind: 'taunt', seat: bp.seat, text: bt.text, icon: bt.icon });
      if (s2.fx.length > 16) s2.fx.shift();
    }
    publish();
    render();
  }, 720 + Math.random() * 520);
}

/* ============================================================
   결과 화면
   ============================================================ */
function showOver() {
  var st = App.st;
  if (!st) return;
  if (App.overShown) return;
  App.overShown = true;

/* ============================================================
   네트워크 (Firebase RTDB REST)
   ============================================================ */
function dbURL(code, path) { return FB_ROOT + '/' + code + (path || '') + '.json'; }
function dbFetch(code, path, method, body) {
  var opt = { method: method || 'GET', cache: 'no-store' };
  if (body !== undefined) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  var ctrl = null, to = null;
  try { ctrl = new AbortController(); opt.signal = ctrl.signal; to = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 7000); } catch (e) {}
  return fetch(dbURL(code, path), opt).then(function (r) {
    if (to) clearTimeout(to);
    return r.text().then(function (t) {
      var data = null;
      if (t) { try { data = JSON.parse(t); } catch (e) { data = null; } }
      return { ok: r.ok, status: r.status, data: data };
    });
  }).catch(function (e) {
    if (to) clearTimeout(to);
    return { ok: false, status: 0, data: null, err: e };
  });
}

var Net = {
  code: '', cid: null, isHost: false, seat: 0, timer: null,
  lastStateStr: '', meta: null, seats: null, applying: false,
  claiming: false, lastBeat: 0, lastCheck: 0
};

function netError() {
  toast('방 서버에 연결이 안 돼… 잠시 후 다시 시도해줘 (봇 대전은 바로 돼!)', 2600);
}

function createRoom() {
  var p = profile();
  Net.cid = 'p' + Math.random().toString(36).slice(2, 10);
  Net.isHost = true; Net.seat = 0;
  toast('방 만드는 중…', 1200);
  var tries = 0;
  function attempt() {
    var code = E.makeRoomCode();
    dbFetch(code, '/meta').then(function (r) {
      if (!r.ok) { netError(); return; }
      if (r.data) { if (++tries < 8) return attempt(); netError(); return; }
      Net.code = code;
      dbFetch(code, '/meta', 'PUT', { v: 1, code: code, host: Net.cid, phase: 'lobby', at: Date.now(), createdAt: Date.now() })
        .then(function () {
          return dbFetch(code, '/seats/' + Net.seat, 'PUT', { seat: Net.seat, name: p.name, avatar: p.avatar, cid: Net.cid, bot: false, at: Date.now() });
        })
        .then(function () {
          App.mode = 'room';
          cleanupOldRooms();
          openLobby(true);
          startNetPoll();
        });
    });
  }
  attempt();
}

// 6시간 지난 방은 조용히 정리 (활성 방은 건드리지 않음)
function cleanupOldRooms() {
  fetch(FB_ROOT + '.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (all) {
    var now = Date.now();
    Object.keys(all || {}).forEach(function (k) {
      var m = all[k] && all[k].meta;
      if (m && m.createdAt && now - m.createdAt > 6 * 3600 * 1000) {
        fetch(FB_ROOT + '/' + k + '.json', { method: 'DELETE' }).catch(function () {});
      }
    });
  }).catch(function () {});
}

function joinRoom(codeInput) {
  var code = (codeInput || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (code.length !== 4) return toast('방 코드 4자리를 입력해줘!');
  var p = profile();
  Net.cid = 'p' + Math.random().toString(36).slice(2, 10);
  Net.isHost = false;
  dbFetch(code, '/meta').then(function (r) {
    if (!r.ok) return netError();
    if (!r.data) return toast('그런 방이 없어! 코드를 다시 확인해줘');
    if (r.data.phase !== 'lobby') return toast('이미 시작한 방이야…');
    return dbFetch(code, '/seats').then(function (s) {
      var seats = s.data || {};
      var used = Object.keys(seats).filter(function (k) { return seats[k]; });
      if (used.length >= 5) return toast('방이 꽉 찼어! (5명)');
      var idx = -1;
      for (var i = 0; i < 5; i++) { if (!seats[i] || !seats[i].cid) { idx = i; break; } }
      if (idx < 0) return toast('빈자리가 없어!');
      Net.code = code; Net.seat = idx;
      return dbFetch(code, '/seats/' + idx, 'PUT', { seat: idx, name: p.name, avatar: p.avatar, cid: Net.cid, bot: false, at: Date.now() })
        .then(function () {
          App.mode = 'room';
          openLobby(false);
          startNetPoll();
        });
    });
  });
}

function inviteURL(code) {
  var base = location.href.split('?')[0].split('#')[0];
  return base + '?room=' + code;
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(function () { return true; }).catch(function () { return fallbackCopy(t); });
  }
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t) {
  try {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function renderLobby() {

function hostStart() {
  if (!Net.isHost) return;
  dbFetch(Net.code, '/seats').then(function (r) {
    Net.seats = (r.ok && r.data) ? r.data : (Net.seats || {});
    hostStartNow();
  });
}

function hostStartNow() {
  var seats = Net.seats || {};
  var players = [];
  var takenNames = [];
  var usedAv = [];
  for (var i = 0; i < 5; i++) {
    var s = seats[i];
    if (s && s.cid) {
      players.push({ name: s.name, avatar: s.avatar % 5, bot: false, cid: s.cid });
      takenNames.push(s.name); usedAv.push(s.avatar % 5);
    } else {
      var av = i;
      for (var k = 0; k < 5; k++) { if (usedAv.indexOf((i + k) % 5) < 0) { av = (i + k) % 5; break; } }
      usedAv.push(av);
      var nm = botNameFor(av, takenNames);
      takenNames.push(nm);
      players.push({ name: nm, avatar: av, bot: true });
    }
  }
  App.mode = 'room';
  App.st = E.newGame({ players: players, seed: (Date.now() >>> 0), mode: 'room', roomCode: Net.code });
  App.seat = Net.seat;
  App.lastFx = 0; App.overShown = false;
  closeModal();
  showScreen('game');
  dbFetch(Net.code, '/meta', 'PATCH', { phase: 'playing', at: Date.now() }).then(pushState);
  render(true);
  toast('🎉 시작! ' + App.st.targetScore + '점 먼저 모으면 승리', 2000);
}

var publish = function () { pushState(); };

function pushState() {
  if (!Net.isHost || !Net.code || !App.st) return;
  clearTimeout(Net.pushT);
  Net.pushT = setTimeout(function () {
    dbFetch(Net.code, '/state', 'PUT', App.st);
    dbFetch(Net.code, '/meta', 'PATCH', { at: Date.now(), phase: App.st.phase === 'over' ? 'over' : 'playing' });
  }, 60);
}

function startNetPoll() {
  if (Net.timer) clearInterval(Net.timer);
  Net.lastStateStr = '';
  Net.timer = setInterval(netTick, 550);
  netTick();
}

function netTick() {
  if (!Net.code) return;
  dbFetch(Net.code, '').then(function (r) {
    if (!r.ok || !r.data) return;
    var room = r.data;
    Net.meta = room.meta || {};
    Net.seats = room.seats || {};
    // 좌석 UI 갱신
    if (App.modalKind === 'lobby') renderLobby();
    // 게임 상태 반영
    if (room.state) {
      var s = JSON.stringify(room.state);
      if (s !== Net.lastStateStr) {
        Net.lastStateStr = s;
        if (!Net.isHost) {
          var seatChanged = App.seat !== Net.seat;
          App.st = room.state;
          App.mode = 'room';
          App.seat = Net.seat;
          if (App.st.phase === 'over') App.overShown = false;
          if ($('#game').classList.contains('hidden') && App.st.phase !== 'over') {
            closeModal();
            showScreen('game');
            App.lastFx = App.st.fxSeq;
          }
          render(seatChanged);
        }
      }
    }
    // 방장: 인텐트 처리 + 하트비트/이탈 점검
    if (Net.isHost) hostTick(room);
    // 참가자: 하트비트
    if (!Net.isHost && Date.now() - Net.lastBeat > 4000) {
      Net.lastBeat = Date.now();
      dbFetch(Net.code, '/seats/' + Net.seat, 'PATCH', { at: Date.now() });
    }
    // 방장 이탈 감지 → 이어받기
    if (!Net.isHost && room.meta && room.state && room.meta.phase === 'playing') {
      var stale = Date.now() - (room.meta.at || 0) > 16000;
      if (stale && !Net.claiming) claimHost(room);
    }
    // 로비에서 방장이 시작했는지
    if (Net.meta && Net.meta.phase === 'playing' && App.modalKind === 'lobby') {
      closeModal();
    }
  });
}

function hostTick(room) {
  // 인텐트 처리
  var intents = room.intents || {};
  Object.keys(intents).forEach(function (k) {
    var it = intents[k];
    if (!it) return;
    dbFetch(Net.code, '/intents/' + k, 'DELETE');
    if (it.cid === Net.cid && it.seat === Net.seat) {
      // 방장 자신의 인텐트는 무시 (이미 로컬 반영됨)
      return;
    }
    applyIntent(it);
  });
  // 하트비트
  if (Date.now() - Net.lastBeat > 4000) {
    Net.lastBeat = Date.now();
    dbFetch(Net.code, '/seats/' + Net.seat, 'PATCH', { at: Date.now() });
    if (App.st && App.st.phase === 'playing') dbFetch(Net.code, '/meta', 'PATCH', { at: Date.now() });
  }
  // 이탈자 → 봇
  if (App.st && App.st.phase === 'playing' && Date.now() - Net.lastCheck > 5000) {
    Net.lastCheck = Date.now();
    var changed = false;
    App.st.players.forEach(function (p) {
      var s = Net.seats[p.seat];
      if (!p.bot && p.seat !== Net.seat && (!s || Date.now() - (s.at || 0) > 15000)) {
        p.bot = true; p.connected = false; changed = true;
        E.log ? null : null;
        toast('😢 ' + p.name + ' 님이 나가서 봇이 대신해요', 2200);
      }
    });
    if (changed) { pushState(); render(); }
  }
}

function applyIntent(it) {
  var st = App.st;
  if (!st) return;
  var seat = it.seat;
  if (!st.players[seat]) return;
  if (it.type === 'taunt') {
    st.fxSeq++;
    st.fx.push({ i: st.fxSeq, t: 'impact', kind: 'taunt', seat: seat, icon: it.icon, text: it.text, by: it.cid });
    if (st.fx.length > 16) st.fx.shift();
    st.logSeq++;
    st.log.push({ i: st.logSeq, text: '😝 ' + st.players[seat].name + ' "' + it.text + '"' });
    if (st.log.length > 40) st.log.shift();
    pushState();
    render();
    return;
  }
  if (st.phase !== 'playing') {
    if (it.type === 'rematch') restartRoom();
    return;
  }
  var r = { ok: false };
  if (it.type === 'draw') r = E.draw(st, seat);
  else if (it.type === 'score') r = E.scoreSet(st, seat, it.ctype);
  else if (it.type === 'discard') r = E.discardCard(st, seat, it.card);
  else if (it.type === 'play') r = E.playCard(st, seat, it.card, it.payload || {});
  else if (it.type === 'instant') r = E.playInstant(st, seat, it.card, it.payload || {});
  else if (it.type === 'shield') r = E.resolveShield(st, seat, !!it.use);
  else if (it.type === 'pass') { if (st.turn === seat) { E.endTurn(st); r = { ok: true }; } }
  if (!r.ok) {
    // 조용히 무시 (중복/늦은 입력)
  }
  pushState();
  render();
}

function claimHost(room) {
  // 살아있는 사람 중 가장 앞 좌석만 시도
  var live = Object.keys(Net.seats || {}).filter(function (k) {
    var s = Net.seats[k];
    return s && s.cid && Date.now() - (s.at || 0) < 13000;
  }).map(Number).sort(function (a, b) { return a - b; });
  if (!live.length || live[0] !== Net.seat) return;
  Net.claiming = true;
  setTimeout(function () {
    dbFetch(Net.code, '/meta').then(function (r) {
      var m = r.data;
      if (m && Date.now() - (m.at || 0) > 16000) {
        return dbFetch(Net.code, '/meta', 'PATCH', { host: Net.cid, at: Date.now() }).then(function () {
          return dbFetch(Net.code, '/meta');
        }).then(function (r2) {
          if (r2.data && r2.data.host === Net.cid) {
            Net.isHost = true;
            toast('👑 방장이 나가서 내가 이어받았어!', 2400);
            if (App.st) { App.lastFx = App.st.fxSeq; render(); }
          }
          Net.claiming = false;
        });
      }
      Net.claiming = false;
    });
  }, 900 + Math.random() * 900);
}

function leaveRoom() {
  var code = Net.code, seat = Net.seat;
  closeModal();
  if (Net.timer) { clearInterval(Net.timer); Net.timer = null; }
  if (code) {
    dbFetch(code, '/seats/' + seat, 'DELETE');
    if (Net.isHost) {
      dbFetch(code, '/meta', 'PATCH', { phase: 'closed', at: Date.now() });
    }
  }
  Net.code = ''; Net.isHost = false; App.st = null; App.mode = 'solo';
  showScreen('title');
  toast('방에서 나왔어', 1400);
}

function restartRoom() {
  if (!Net.isHost) return;
  var st = App.st;
  if (!st) return;
  var players = st.players.map(function (p) { return { name: p.name, avatar: p.avatar, bot: p.bot, cid: p.cid }; });
  // 나간 사람은 봇으로
  players.forEach(function (p, i) {
    var s = Net.seats && Net.seats[i];
    if (!p.bot && (!s || Date.now() - (s.at || 0) > 16000)) p.bot = true;
  });
  App.st = E.newGame({ players: players, seed: (Date.now() >>> 0), mode: 'room', roomCode: Net.code });
  App.lastFx = 0; App.overShown = false;
  showScreen('game');
  pushState();
  dbFetch(Net.code, '/meta', 'PATCH', { phase: 'playing', at: Date.now() });
  render(true);
  toast('🔁 한 판 더!', 1600);
}

/* ============================================================
   초대 / 메뉴
   ============================================================ */
function openInvite() {
  if (!Net.code) return;
  modal('<div class="mCard"><h2>🔗 친구 초대</h2>' +
    '<div class="codeBox"><b>' + Net.code + '</b></div>' +
    '<p>이 링크를 친구에게 보내면 바로 들어와요!</p>' +
    '<button class="btn primary" id="invCopy" style="height:50px">초대 링크 복사</button>' +
    '<button class="mClose" id="mCancel">닫기</button></div>');
  $('#invCopy').addEventListener('click', function () {
    copyText(inviteURL(Net.code)).then(function (ok) { toast(ok ? '복사 완료! 🔗' : inviteURL(Net.code), 2400); });
  });
  $('#mCancel').addEventListener('click', closeModal);
}

function openMenu() {
  var inRoom = !!(Net.code);
  modal('<div class="mCard"><h2>☰ 메뉴</h2>' +
    (inRoom ? '<button class="btn ghost" id="mInvite" style="height:46px">🔗 초대 링크 (' + Net.code + ')</button>' : '') +
    '<button class="btn ghost" id="mSound" style="height:46px">' + (Sound.on ? '🔇 소리 끄기' : '🔊 소리 켜기') + '</button>' +
    '<button class="btn ghost" id="mGuide" style="height:46px">❓ 규칙 보기</button>' +
    '<button class="btn ghost" id="mLeave" style="height:46px">🏠 나가기</button>' +
    '<button class="mClose" id="mCancel">닫기</button></div>');
  if (inRoom) $('#mInvite').addEventListener('click', function () { closeModal(); openInvite(); });
  $('#mSound').addEventListener('click', function () { toggleSound(); closeModal(); });
  $('#mGuide').addEventListener('click', function () { openGuide(); });
  $('#mLeave').addEventListener('click', function () {
    closeModal();
    if (Net.code) leaveRoom(); else { App.st = null; showScreen('title'); }
  });
  $('#mCancel').addEventListener('click', closeModal);
}

/* ============================================================
   이벤트 연결
   ============================================================ */
function bind() {
  $('#soundBtnT').addEventListener('click', toggleSound);
  $('#soundBtn').addEventListener('click', toggleSound);
  $('#soloBtn').addEventListener('click', function () {
    Sound.init(); Sound.blip(880, 1320, 0.12, 'triangle', 0.16); vibrate(12);
    startSolo();
  });
  $('#createBtn').addEventListener('click', function () { Sound.init(); createRoom(); });
  $('#joinBtn').addEventListener('click', function () { openJoinModal(); });
  $('#howBtn').addEventListener('click', openGuide);

  $('#hand').addEventListener('click', onHandTap);
  $('#opps').addEventListener('click', onOppTap);
  $('#meAvatar').addEventListener('click', function () { if (App.targetMode) toast('상대를 골라야 해!'); });
  $('#drawBtn').addEventListener('click', doDraw);
  $('#passBtn').addEventListener('click', doPass);
  $('#setBtn').addEventListener('click', function () {
    var t = $('#setBtn').getAttribute('data-type');
    if (t) doScore(t);
  });
  $('#cancelBtn').addEventListener('click', function () { App.targetMode = null; render(); });
  $('#trashBtn').addEventListener('click', function () { App.trashMode = !App.trashMode; render(); toast(App.trashMode ? '🗑️ 버릴 카드를 톡!' : '취소', 1200); });
  $('#taunts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-x]'); if (!b) return;
    doTaunt(b.getAttribute('data-t'), b.getAttribute('data-x'));
  });
  $('#menuBtn').addEventListener('click', openMenu);
  $('#roomChip').addEventListener('click', openInvite);
  $('#againBtn').addEventListener('click', again);
  $('#homeBtn').addEventListener('click', function () {
    if (Net.code) leaveRoom(); else { App.st = null; showScreen('title'); }
  });
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

  window.addEventListener('resize', fit);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
  }
  window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });
}

function openJoinModal() {
  modal('<div class="mCard"><h2>🔑 코드 입장</h2>' +
    '<p>4자리 코드와 내 이름을 넣어줘</p>' +
    '<input id="joinName" maxlength="8" placeholder="내 이름 (예: 종혁)" style="height:44px;border-radius:12px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:16px;font-weight:800;padding:0 12px;font-family:inherit">' +
    '<div class="joinRow"><input id="codeInput" maxlength="4" placeholder="ABCD" inputmode="text" autocapitalize="characters"><button class="btn primary" id="codeGo">입장</button></div>' +
    '<button class="mClose" id="mCancel">취소</button></div>');
  var inp = $('#codeInput');
  var nm = $('#joinName');
  nm.value = LS.get('cp.name', '') || '';
  if (App.pendingRoom) inp.value = App.pendingRoom;
  setTimeout(function () { try { (App.pendingRoom ? inp : nm).focus(); } catch (e) {} }, 60);
  function go() {
    var v = inp.value;
    if (nm.value.trim()) { $('#nameInput').value = nm.value.trim(); App.me.name = nm.value.trim(); LS.set('cp.name', App.me.name); }
    closeModal(); joinRoom(v);
  }
  $('#codeGo').addEventListener('click', go);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  $('#mCancel').addEventListener('click', closeModal);
}

function fit() {
  var vv = window.visualViewport;
  var h = vv ? vv.height : window.innerHeight;
  var app = document.getElementById('app');
  if (app) { app.style.height = h + 'px'; app.style.top = ((vv ? vv.offsetTop : 0)) + 'px'; }
}

/* ============================================================
   부트
   ============================================================ */
function boot() {
  App.net = Net;
  window.__cactus = { App: App, E: E, render: render, Net: Net, publish: function () { pushState(); } };
  initTitle();
  bind();
  fit();
  var q = new URLSearchParams(location.search);
  var room = (q.get('room') || '').toUpperCase().slice(0, 4);
  if (room) {
    App.pendingRoom = room;
    $('#nameInput').value = LS.get('cp.name', '');
    setTimeout(function () { openJoinModal(); }, 250);
  }
  // 방 코드 자동 포커스
  var ni = $('#nameInput');
  ni.addEventListener('keydown', function (e) { if (e.key === 'Enter') { ni.blur(); startSolo(); } });
  updateSoundBtns();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
