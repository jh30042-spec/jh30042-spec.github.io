<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;background:#120a18;overscroll-behavior:none}
body{margin:0;padding:0;height:100%;overflow:hidden;background:#120a18;color:#fff;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  position:fixed;left:0;top:0;width:100%;overscroll-behavior:none;touch-action:none}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}

/* ================= 공통 버튼 ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:15px;font-weight:900;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.18);
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.3)}
.btn.primary{background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a2100;border-color:#ffdf8a;
  box-shadow:0 4px 0 #a86400,0 0 22px rgba(255,190,60,.35)}
.btn.lime{background:linear-gradient(180deg,#b6f36a,#63c227);color:#173300;border-color:#c8ff8a;box-shadow:0 4px 0 #3d7d12}
.btn.pink{background:linear-gradient(180deg,#ffa8d0,#ef5a9b);color:#4a0325;border-color:#ffc4de;box-shadow:0 4px 0 #a02e60}
.btn.ghost{background:rgba(255,255,255,.10)}
.btn:disabled{opacity:.45;filter:saturate(.5)}
.iconBtn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:rgba(255,255,255,.10)}
.iconBtn:active{transform:scale(.94)}
.screen{position:absolute;inset:0;overflow:hidden}

/* ================= 타이틀 ================= */
#title{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(120% 60% at 50% 0%,#4a2a5e 0%,#2a1636 45%,#150a1d 100%),
    #150a1d}
#title::before{content:"";position:absolute;left:0;right:0;top:0;height:100%;
  background:radial-gradient(circle at 12% 8%,rgba(255,207,92,.20),transparent 38%),
             radial-gradient(circle at 88% 12%,rgba(255,143,192,.18),transparent 40%),
             radial-gradient(circle at 50% 62%,rgba(140,230,63,.10),transparent 55%);
  pointer-events:none}
.tWrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;flex-direction:column;gap:8px}
.tTop{display:flex;align-items:center;justify-content:space-between}
.tBadge{font-size:12px;font-weight:900;letter-spacing:.06em;padding:5px 10px;border-radius:999px;
  background:rgba(140,230,63,.16);color:#c8ff8a;border:1px solid rgba(140,230,63,.35)}
.tTitle{text-align:center;margin:2px 0 0;line-height:.98}
.tTitle .kick{display:block;font-size:15px;font-weight:900;letter-spacing:.42em;color:#ffcf5c;opacity:.95;margin-bottom:4px}
.tTitle .name{display:block;font-size:clamp(38px,12.2vw,52px);font-weight:900;letter-spacing:-.045em;
  background:linear-gradient(180deg,#fff6c9 10%,#ffd05c 55%,#ff9f2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,30,0,.55)) drop-shadow(0 0 22px rgba(255,170,40,.28))}
.tSub{text-align:center;margin:0;font-size:13.5px;font-weight:700;color:#e7d8ff;opacity:.92}
.tSub b{color:#ffd479}
.tCharRow{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:84px;margin:-2px 0 0}
.tCharRow svg{width:19.2%;max-width:74px;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.tCharRow svg:nth-child(2){animation-delay:.28s}
.tCharRow svg:nth-child(3){animation-delay:.56s}
.tCharRow svg:nth-child(4){animation-delay:.84s}
.tCharRow svg:nth-child(5){animation-delay:1.12s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.tRule{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tRule div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:13px;
  padding:6px 2px;text-align:center;font-size:10.5px;font-weight:800;color:#e9e0f5;line-height:1.2}
.tRule div b{display:block;font-size:18px;margin-bottom:2px}
.tRule div span{opacity:.9}
.tPicker{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:8px 10px}
.tPicker label{font-size:11px;font-weight:800;color:#c9b8e0;letter-spacing:.03em}
#nameInput{width:100%;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.28);color:#fff;font-size:16px;font-weight:800;padding:0 12px;font-family:inherit}
#nameInput::placeholder{color:#8d7ba3}
.avatarPick{display:flex;gap:6px;justify-content:space-between}
.avatarPick button{flex:1;min-width:0;border-radius:12px;padding:4px 2px 3px;border:2px solid transparent;
  background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:1px}
.avatarPick button svg{width:100%;max-width:38px;height:36px}
.avatarPick button i{font-style:normal;font-size:9.5px;font-weight:800;opacity:.85;white-space:nowrap}
.avatarPick button.on{border-color:#ffd34d;background:rgba(255,211,77,.16);box-shadow:0 0 14px rgba(255,211,77,.3)}
.avatarPick button:active{transform:scale(.96)}
.tBtns{display:flex;flex-direction:column;gap:7px;margin-top:0}
.soloBtn{height:56px;font-size:18.5px;letter-spacing:-.02em}
.tRow2{display:flex;gap:8px}
.tRow2 .btn{flex:1;height:46px;font-size:13.5px}
.linkBtn{align-self:center;font-size:12.5px;font-weight:800;color:#bda9d6;text-decoration:underline;text-underline-offset:3px;padding:4px}
.tFoot{text-align:center;font-size:10px;color:#7f6b96;font-weight:700;line-height:1.45;margin-top:0}

/* ================= 게임 ================= */
#game{display:flex;flex-direction:column;background:radial-gradient(130% 70% at 50% 32%,#3b2140 0%,#241226 55%,#120a18 100%)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:calc(env(safe-area-inset-top) + 5px) 7px 4px}
.chip{height:26px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:9px;font-size:11.5px;font-weight:900;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
#roomChip{background:rgba(140,230,63,.16);border-color:rgba(140,230,63,.4);color:#d3ff9a;max-width:110px;overflow:hidden}
#hud .sp{flex:1}

/* 상대 4명 */
#opps{flex:1 1 auto;min-height:0;max-height:42vh;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:2px 6px 0;align-content:stretch;position:relative}
#opps::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-2px;height:76%;
  background:radial-gradient(ellipse at 50% 116%,#6d4023 0%,#552f18 38%,#3a1e0f 58%,rgba(58,30,15,0) 74%);
  opacity:.55;pointer-events:none}
.opp{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;
  padding:5px 2px 6px;border-radius:14px;border:2px solid transparent;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  transition:transform .14s,border-color .14s,box-shadow .14s;min-height:0}
.opp .nm{order:-2;margin-top:1px}
.opp .fan{order:-1;margin-top:0;margin-bottom:2px}
.opp .avWrap{order:0}
#lights{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 4px);height:64px;pointer-events:none;z-index:0;opacity:.9}
#lights i{position:absolute;width:7px;height:9px;border-radius:50%;background:#ffdf8a;
  box-shadow:0 0 10px 3px rgba(255,200,90,.5);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
#lights:before{content:"";position:absolute;left:-4%;right:-4%;top:6px;height:26px;
  border-bottom:2px solid rgba(255,220,150,.22);border-radius:0 0 50% 50%}
.opp .avWrap{position:relative;width:100%;display:flex;justify-content:center;align-items:center;flex:1 1 auto;min-height:0}
.opp .avWrap svg{width:112%;max-width:112%;max-height:170px;height:auto;flex:0 0 auto;transform-origin:50% 100%;transition:transform .2s}
.opp .nm{font-size:11px;font-weight:900;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .sc{position:absolute;top:-2px;right:1px;min-width:24px;height:20px;padding:0 5px;border-radius:10px;
  background:linear-gradient(180deg,#ffd76a,#ff9f1c);color:#3a1c00;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0006}
.opp .fan{height:20px;display:flex;align-items:flex-end;justify-content:center;margin-top:1px}
.opp .fan i{display:block;width:11px;height:15px;border-radius:3px;margin-left:-4.5px;
  background:linear-gradient(180deg,#4b2c6b,#2b1640);border:1px solid #12081c;box-shadow:0 1px 0 #0008}
.opp .fan i:first-child{margin-left:0}
.opp .fan i.b{background:linear-gradient(180deg,#7a3a2a,#3b1712);border-color:#180a06}
.opp .fan .cnt{font-size:10px;font-weight:900;opacity:.75;margin-left:2px}
.opp .prog{display:flex;gap:1.5px;margin:3px 0 4px;padding:0 2px}
.opp .prog i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.13);display:block;transition:background .2s,box-shadow .2s}
.opp .prog i.on{background:#ffd34d;box-shadow:0 0 5px rgba(255,211,77,.7)}
.opp .ice{display:none;position:absolute;top:19px;left:50%;margin-left:-25px;z-index:3;
  font-size:10px;font-weight:900;letter-spacing:-.02em;color:#e6f9ff;white-space:nowrap;
  background:linear-gradient(180deg,rgba(56,150,215,.92),rgba(20,80,130,.92));
  border:1px solid rgba(150,235,255,.9);border-radius:9px;padding:2px 5px;
  box-shadow:0 0 12px rgba(120,220,255,.75),0 2px 0 rgba(0,0,0,.35);animation:iceBob 1.1s ease-in-out infinite}
.opp.frozen .ice{display:block}
/* v3: 미리 켜둔 가시 갑옷 배지 (얼음 배지와 안 겹치게 왼쪽 구석에 작게) */
.opp .wall{display:none;position:absolute;top:16px;left:1px;z-index:3;
  font-size:11px;font-weight:900;color:#2a1c00;white-space:nowrap;
  background:linear-gradient(180deg,#ffe27a,#ffb020);border:1px solid #fff3c4;border-radius:8px;padding:0 2px;line-height:16px;
  box-shadow:0 0 10px rgba(255,200,80,.85),0 2px 0 rgba(0,0,0,.35);animation:wallBob 1.15s ease-in-out infinite}
.opp.walled .wall{display:block}
.opp.walled .avWrap svg{filter:drop-shadow(0 0 8px rgba(255,205,90,.85))}
@keyframes wallBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#meAvBox{position:relative;width:50px;height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center}
.wallBadge{position:absolute;left:50%;top:-10px;margin-left:-13px;z-index:5;font-size:11px;font-weight:900;white-space:nowrap;
  color:#2a1c00;background:linear-gradient(180deg,#ffe27a,#ffb020);border:1px solid #fff3c4;border-radius:9px;padding:0 4px;line-height:17px;
  box-shadow:0 0 12px rgba(255,200,80,.85),0 2px 0 rgba(0,0,0,.35);animation:wallBob 1.15s ease-in-out infinite}
/* v3: 진행 방향 칩 */
#dirChip{background:rgba(120,200,255,.16);border-color:rgba(120,200,255,.42);color:#cbf0ff;transition:transform .2s}
#dirChip.flip{animation:dirFlip .55s ease-out}
@keyframes dirFlip{0%{transform:rotateY(0) scale(1)}45%{transform:rotateY(180deg) scale(1.25)}100%{transform:rotateY(360deg) scale(1)}}
.opp.frozen{box-shadow:0 0 0 2px rgba(120,220,255,.7),0 0 20px rgba(90,200,255,.4)}
.opp.frozen .avWrap svg{filter:drop-shadow(0 0 9px rgba(120,220,255,.85)) saturate(.75)}
@keyframes iceBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-3px) rotate(8deg)}}
#meIce{font-size:10.5px;font-weight:800;color:#8fe6ff}
.opp.turn{border-color:rgba(140,230,63,.85);background:linear-gradient(180deg,rgba(140,230,63,.18),rgba(140,230,63,.03));
  box-shadow:0 0 0 2px rgba(140,230,63,.25),0 0 22px rgba(140,230,63,.22)}
.opp.turn .avWrap svg{transform:scale(1.06)}
.opp.target{border-color:#ffd34d;background:linear-gradient(180deg,rgba(255,211,77,.26),rgba(255,140,30,.06));
  animation:pulseTarget .75s infinite;cursor:pointer}
.opp.target::after{content:"콕!";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:900;color:#3a1c00;background:#ffd34d;padding:1px 7px;border-radius:8px}
.opp.hit{animation:shake .42s}
.opp.shield{box-shadow:0 0 0 3px #6ad0ff,0 0 24px rgba(106,208,255,.5)}
@keyframes pulseTarget{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* 테이블 */
#table{flex:1 1 auto;min-height:82px;display:flex;align-items:center;gap:9px;padding:0 9px;position:relative}
#table:before{content:"";position:absolute;left:-8%;right:-8%;top:0;bottom:0;
  background:
    radial-gradient(ellipse at 50% 46%,rgba(160,96,48,.55),rgba(110,62,28,.32) 48%,rgba(70,38,16,.12) 66%,rgba(0,0,0,0) 78%),
    repeating-linear-gradient(94deg,rgba(255,220,170,.05) 0 2px,rgba(0,0,0,.04) 2px 7px);
  pointer-events:none;mask-image:radial-gradient(ellipse at 50% 50%,#000 60%,transparent 80%)}
.deckWrap{position:relative;width:58px;height:72px;flex:0 0 auto}
.deckPile{position:absolute;inset:0 2px 0 2px;border-radius:8px;background:linear-gradient(150deg,#6d3fb0,#341c58);
  border:2px solid #a97be0;box-shadow:3px 3px 0 #241033,0 0 18px rgba(170,120,255,.28)}
.deckPile::after{content:"🌵";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.deckPile::before{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(255,255,255,.35);border-radius:5px}
.deckCount{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:21px;padding:0 5px;border-radius:9px;
  background:linear-gradient(180deg,#ffe27a,#ffb020);color:#3a2100;font-size:11.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #2a1636}
.deckCount.low{background:linear-gradient(180deg,#ff9a8a,#e03131);color:#fff;border-color:#5a0b0b;animation:pulse .9s infinite}
.midInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#turnBanner{font-size:13px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turnBanner.me{color:#c8ff8a;text-shadow:0 0 14px rgba(140,230,63,.6)}
#ticker{font-size:11px;font-weight:700;color:#c9b8e0;line-height:1.3;height:44px;overflow:hidden}
#ticker b{color:#ffd479}

/* 하단 엄지존 */
#thumb{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;
  padding:0 7px calc(env(safe-area-inset-bottom) + 6px);
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.32) 22%,rgba(0,0,0,.5));}
#meRow{height:40px;display:flex;align-items:center;gap:7px}
#meAvatar{width:46px;height:40px;display:flex;align-items:flex-end;justify-content:center}
#meAvatar svg{width:100%;height:100%}
#meMeta{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
#meName{font-size:13px;font-weight:900;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meScore{font-size:15px;font-weight:900;color:#ffd479}
#meSets{font-size:10.5px;font-weight:800;color:#b8a5d0}
#meBombs{font-size:10.5px;font-weight:800;color:#ff9b8a}
.setBtn{height:40px;padding:0 10px;border-radius:13px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;
  background:linear-gradient(180deg,#ffe27a,#ffab1f);color:#3a2100;box-shadow:0 3px 0 #a86400,0 0 20px rgba(255,190,60,.55);
  animation:pulseSet .9s infinite}
.setBtn small{font-size:10px;opacity:.8}
@keyframes pulseSet{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

#hand{height:104px;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;
  padding:6px 4px 6px;scrollbar-width:none;touch-action:pan-x}
#hand::-webkit-scrollbar{display:none}
.hcard{position:relative;flex:0 0 auto;width:66px;height:94px;border-radius:12px;
  background:linear-gradient(180deg,#fffdf4,#efe1c6);border:2px solid #d8c39a;color:#2a1a12;
  box-shadow:0 3px 0 rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px 4px;
  transition:transform .1s,box-shadow .1s}
.hcard:active{transform:translateY(3px) scale(.97);box-shadow:0 0 0 rgba(0,0,0,.3)}
.hcard .hcArt{width:52px;height:46px;display:flex;align-items:center;justify-content:center}
.hcard .hcArt svg{width:100%;height:100%}
.hcard .hcName{font-size:10px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
.hcard .hcSub{font-size:8.5px;font-weight:800;opacity:.55;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.hcard .badge{position:absolute;bottom:-6px;right:-4px;min-width:21px;height:21px;padding:0 4px;border-radius:11px;
  background:#ff5a3c;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 2px 4px #0007;z-index:2}
.hcard .pts{position:absolute;top:-6px;left:-4px;height:19px;padding:0 5px;border-radius:9px;background:#5fbf24;color:#fff;
  font-size:10px;font-weight:900;display:flex;align-items:center;border:2px solid #fff;z-index:2}
.hcard.action{background:linear-gradient(180deg,#43285e,#251537);border-color:#7b58a3;color:#f4eaff}
.hcard.action .hcArt{font-size:30px;line-height:1}
.hcard.action .hcName{color:#ffe27a}
/* v3: ⚡ 즉시 카드 — 내 턴이 아니어도 항상 활성 */
.hcard.instant{background:linear-gradient(180deg,#1b4a63,#0d2433);border-color:#7fd7ff;color:#eafcff;
  box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 2px rgba(120,220,255,.5),0 0 16px rgba(90,200,255,.35)}
.hcard.instant .hcName{color:#bdf0ff}
.hcard.instant .hcSub{opacity:.7;color:#9fe3ff}
.hcard .instBadge{position:absolute;top:-7px;right:-3px;height:17px;padding:0 4px;border-radius:8px;
  font-size:9px;font-weight:900;background:linear-gradient(180deg,#a8efff,#2aa7e0);color:#032432;
  border:1.5px solid #e8fbff;display:flex;align-items:center;z-index:4;
  animation:instPulse 1.5s ease-in-out infinite}
@keyframes instPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(120,220,255,0)}50%{transform:scale(1.08);box-shadow:0 0 10px rgba(120,220,255,.85)}}
.hcard.off{opacity:.42;filter:saturate(.35)}
.hcard.off:active{transform:none}
.hcard.ready{box-shadow:0 0 0 3px #ffd34d,0 0 22px rgba(255,211,77,.65);animation:pulseSet 1s infinite}
.hcard.sel{transform:translateY(-9px);box-shadow:0 0 0 3px #8ce63f,0 0 22px rgba(140,230,63,.7)}
.hcard.dots{justify-content:flex-end}
.hdots{display:flex;gap:3px;margin-top:2px}
.hdots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.16);display:block}
.hdots i.on{background:#52b41c;box-shadow:0 0 6px rgba(82,180,28,.8)}

#actbar{height:54px;display:flex;gap:6px}
#drawBtn{flex:1;font-size:15px;letter-spacing:-.02em}
#drawBtn .sub{font-size:10.5px;font-weight:800;opacity:.8;margin-left:2px}
#cancelBtn,#passBtn{flex:0 0 auto;padding:0 14px;font-size:14px}
#trashBtn{flex:0 0 auto;padding:0 11px;font-size:12px}
#taunts{height:44px;display:flex;gap:3px}
#taunts button{flex:1;min-width:0;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#taunts button:active{transform:scale(.92);background:rgba(255,90,60,.32)}
#taunts button span{font-size:16px;line-height:1}
#taunts button i{font-style:normal;font-size:8px;font-weight:800;opacity:.72;white-space:nowrap}

/* 말풍선 / 떠다니는 효과 */
#bubbles,#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:70}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fffdf5;color:#241226;padding:6px 10px;border-radius:13px;font-weight:900;font-size:13px;
  box-shadow:0 5px 16px rgba(0,0,0,.45);white-space:nowrap;animation:popIn .18s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fffdf5}
@keyframes popIn{from{transform:translate(-50%,-100%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.floatTxt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:20px;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.5);animation:floatUp 1.05s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-155%) scale(1)}}
.flyCard{position:fixed;width:44px;height:62px;border-radius:8px;z-index:80;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.5);border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:22px}
.puff{position:fixed;font-size:26px;pointer-events:none;z-index:80;animation:puffOut .7s ease-out forwards}
@keyframes puffOut{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.6) translateY(-16px)}}

/* 안내 토스트 */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 44px);transform:translate(-50%,0);
  z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(20,8,28,.92);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px #0009;
  animation:toastIn .18s ease-out;max-width:86vw;text-align:center;line-height:1.35}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= 방패 오버레이 ================= */
#shield{position:fixed;inset:0;z-index:88;background:rgba(8,2,14,.74)}
.shWrap{position:absolute;left:0;right:0;bottom:0;height:72%;display:flex;flex-direction:column;gap:8px;
  padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.shHead{text-align:center}
.shHead .who{font-size:14px;font-weight:900;color:#ffd479}
.shHead .warn{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:2px;
  color:#ff6b5a;text-shadow:0 0 18px rgba(255,80,60,.55)}
.shBtn{flex:1;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#9be9ff,#38b6ff 55%,#1684d6);color:#03243a;
  border:3px solid #d6f6ff;box-shadow:0 8px 0 #0b4f80,0 0 38px rgba(60,180,255,.5)}
.shBtn:active{transform:translateY(6px);box-shadow:0 2px 0 #0b4f80}
.shBtn .ic{font-size:54px;line-height:1}
.shBtn .tx{font-size:26px;font-weight:900;letter-spacing:-.02em}
.shBtn .num{font-size:15px;font-weight:900;opacity:.85}
.shBar{height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.shBar i{display:block;height:100%;background:linear-gradient(90deg,#8ce63f,#ffd34d,#ff5a3c);transition:width .1s linear}
.shHint{text-align:center;font-size:11.5px;font-weight:800;color:#c9b8e0}

/* ================= 대형 도발/액션 임팩트 ================= */
#impact{position:fixed;inset:0;z-index:92;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-bottom:72px}
#impact.hidden{display:none!important}
.impFlash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.72),rgba(255,80,60,.34) 34%,rgba(0,0,0,0) 66%);animation:impFlash .34s ease-out both}
@keyframes impFlash{0%{opacity:0}10%{opacity:1}45%{opacity:.45}100%{opacity:0}}
.impWrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.impRing{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
  border:7px solid rgba(255,214,90,.9);box-shadow:0 0 30px rgba(255,180,60,.55);animation:impRing .78s cubic-bezier(.2,.7,.3,1) both}
.impRing.r2{border-color:rgba(255,90,60,.75);animation-delay:.08s}
@keyframes impRing{0%{transform:scale(.2);opacity:.9}100%{transform:scale(5.4);opacity:0}}
.impSpark{position:absolute;left:50%;top:44%;width:0;height:0;z-index:3}
.impSpark i{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:2px;background:#ffd34d;
  box-shadow:0 0 10px rgba(255,200,80,.9);animation:impSpark .68s ease-out both}
@keyframes impSpark{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(.2);opacity:0}}
.impChar{position:relative;z-index:2;width:min(44vw,164px);filter:drop-shadow(0 12px 30px rgba(0,0,0,.65));animation:impPop .5s cubic-bezier(.18,1.7,.4,1) both}
.impChar svg{width:100%;height:auto}
@keyframes impPop{0%{transform:scale(2.7) rotate(-15deg);opacity:0}42%{transform:scale(.88) rotate(5deg);opacity:1}66%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.impIcon{position:absolute;top:0;right:14%;font-size:54px;z-index:4;animation:impIcon .55s cubic-bezier(.2,1.6,.4,1) both .06s}
@keyframes impIcon{0%{transform:scale(0) rotate(-60deg);opacity:0}60%{transform:scale(1.25) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.impText{position:relative;z-index:4;max-width:90%;margin-top:2px;text-align:center;font-size:clamp(18px,6vw,26px);font-weight:900;letter-spacing:-.03em;line-height:1.15;
  color:#fff;padding:4px 12px;border-radius:14px;background:rgba(12,4,18,.62);
  text-shadow:0 2px 0 #1a0a22,0 0 18px rgba(255,90,60,.85);animation:impText .42s cubic-bezier(.2,1.6,.4,1) both .1s}
@keyframes impText{0%{transform:scale(.3) translateY(14px);opacity:0}60%{transform:scale(1.12) translateY(0);opacity:1}100%{transform:scale(1)}}
.impWho{position:relative;z-index:4;margin-top:4px;font-size:12px;font-weight:900;color:#ffd479;letter-spacing:.02em;
  background:rgba(12,4,18,.7);padding:2px 10px;border-radius:999px;animation:impText .4s ease-out both .16s}
#impact.k-freeze .impFlash{background:radial-gradient(circle at 50% 42%,rgba(200,245,255,.75),rgba(60,180,255,.32) 42%,rgba(0,0,0,0) 70%)}
#impact.k-swapAll .impFlash{background:radial-gradient(circle at 50% 42%,rgba(200,255,160,.6),rgba(140,230,63,.28) 42%,rgba(0,0,0,0) 70%)}
.shakeBig{animation:shakeBig .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shakeBig{0%,100%{transform:translate(0,0) rotate(0)}12%{transform:translate(-7px,4px) rotate(-.7deg)}28%{transform:translate(8px,-5px) rotate(.8deg)}44%{transform:translate(-6px,-3px) rotate(-.5deg)}60%{transform:translate(5px,4px) rotate(.4deg)}78%{transform:translate(-3px,2px) rotate(-.2deg)}}

/* ================= 모달 ================= */
#modal{position:fixed;inset:0;z-index:90;background:rgba(8,2,14,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.mCard{width:100%;max-width:360px;max-height:86vh;overflow-y:auto;touch-action:pan-y;border-radius:20px;
  background:linear-gradient(180deg,#2e1a3e,#1b0f26);border:1.5px solid rgba(255,255,255,.16);
  box-shadow:0 18px 50px rgba(0,0,0,.65);padding:16px;display:flex;flex-direction:column;gap:10px}
.mCard h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em;text-align:center}
.mCard p{margin:0;font-size:12.5px;line-height:1.5;color:#d9c9ea;text-align:center;font-weight:700}
.mRow{display:flex;gap:8px}
.mRow .btn{flex:1;height:48px;font-size:14px}
.mClose{align-self:center;font-size:12px;font-weight:800;color:#bda9d6;padding:4px 10px}
.guideRow{display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.05);border-radius:12px;padding:9px 10px}
.guideRow .gi{font-size:26px;width:36px;text-align:center;flex:0 0 auto}
.guideRow b{font-size:13px;display:block}
.guideRow span{font-size:11.5px;color:#c9b8e0;font-weight:700;line-height:1.35}
.typeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.typeBtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14)}
.typeBtn svg{width:56px;height:50px}
.typeBtn b{font-size:12.5px}
.typeBtn span{font-size:10.5px;color:#ffd479;font-weight:900}
.typeBtn:active{transform:scale(.97);border-color:#ffd34d}
.codeBox{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.3);
  border:1.5px dashed rgba(255,255,255,.3);border-radius:14px;padding:10px}
.codeBox b{font-size:30px;letter-spacing:.22em;font-weight:900;color:#ffd479}
.seatList{display:flex;flex-direction:column;gap:5px}
.seatRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:11px;background:rgba(255,255,255,.05)}
.seatRow svg{width:30px;height:30px}
.seatRow b{font-size:12.5px;flex:1}
.seatRow span{font-size:10.5px;font-weight:800;color:#9d8ab5}
.seatRow.me{border:1px solid rgba(255,211,77,.55)}
.joinRow{display:flex;gap:6px}
.joinRow input{flex:1;height:52px;border-radius:14px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.2);
  color:#fff;font-size:24px;font-weight:900;text-align:center;letter-spacing:.3em;font-family:inherit;text-transform:uppercase}
.joinRow .btn{flex:0 0 92px}

/* ================= 결과 ================= */
#over{overflow-y:auto;touch-action:pan-y;background:radial-gradient(120% 70% at 50% 0%,#4a2a5e 0%,#241226 55%,#120a18 100%)}
.ovWrap{position:relative;max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;gap:10px;min-height:100%}
.ovTitle{text-align:center;font-size:30px;font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff6c9,#ffc93c);-webkit-background-clip:text;background-clip:text;color:transparent}
.ovWin{text-align:center;font-size:13px;font-weight:800;color:#e7d8ff}
.ovHero{display:flex;justify-content:center;align-items:flex-end;height:150px;margin:-4px 0 0}
.ovHero svg{height:100%;width:auto;animation:bob 2s ease-in-out infinite}
.rankCard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 10px;
  display:flex;flex-direction:column;gap:5px}
.rankRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:11px}
.rankRow.first{background:linear-gradient(90deg,rgba(255,211,77,.22),rgba(255,211,77,.03));border:1px solid rgba(255,211,77,.4)}
.rankRow .rk{width:20px;text-align:center;font-size:13px;font-weight:900;color:#ffd479}
.rankRow svg{width:28px;height:28px;flex:0 0 auto}
.rankRow .nm{flex:1;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankRow .st{font-size:10px;color:#b8a5d0;font-weight:800}
.rankRow .pt{font-size:16px;font-weight:900;color:#ffd479;min-width:40px;text-align:right}
.ovBtns{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.ovBtns .btn{height:52px;font-size:16px}
.ovNote{text-align:center;font-size:11px;font-weight:700;color:#9d8ab5;line-height:1.45}

/* 아주 작은 화면 보정 */
@media (max-height:640px){
  #hand{height:94px}
  .hcard{width:60px;height:86px}
  .hcard .hcArt{height:40px;width:46px}
  #table{height:66px}
  #taunts{height:40px}
  .opp .avWrap svg{max-width:60px}
  .tCharRow{height:78px}
}
@media (min-height:820px){
  #hand{height:112px}
  .hcard{width:72px;height:102px}
  .opp .avWrap svg{max-width:84px}
}

<body>
<div id="app">

  <!-- ================= 타이틀 ================= -->
  <section id="title" class="screen">
    <div class="tWrap">

        <div><b>🤏</b><span>뺏거나</span></div>

          <button id="createBtn" class="btn ghost">🏠 친구 방 만들기</button>
          <button id="joinBtn" class="btn ghost">🔑 코드 입장</button>

    </div>

  <!-- ================= 게임 ================= -->

</div>
<script>
/* ============================================================
   🌵 가시밭길 선인장 대첩 (Cactus Party) — 게임 엔진 v2
   브라우저에서는 window.CactusEngine, Node 테스트에서는 module.exports
   상태는 전부 JSON 직렬화 가능 (Firebase 동기화용)
   ============================================================ */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CactusEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var VERSION = '3.0.0';
  var TARGET_SCORE = 15;     // 목표 점수 (v2: 9 → 15, 점수가 천천히)
  var HAND_LIMIT = 12;       // 손패 상한 (v2: 8 → 12, 3장 뽑기 대응)
  var SHIELD_MS = 5000;      // 방패 반응 제한
  var BOT_SHIELD_MS = 1150;  // 봇 방패 판단 연출 시간
  var INSTANT_CD_MS = 500;   // v3: 즉시 카드 연타/동시입력 쿨다운
  var MAX_TURNS = 500;       // 안전장치

  var CACTUS = [
    { key: 'green', name: '민둥이', pts: 2, body: '#5cbb45', dark: '#3d8a2c', flower: null, flowerCore: null, pot: '#cf5a33', potDark: '#a8431f' },
    { key: 'pink', name: '핑크꽃', pts: 3, body: '#63c44b', dark: '#43a032', flower: '#ff8ec6', flowerCore: '#ffd23f', pot: '#e8609b', potDark: '#bd3f78' },
    { key: 'yellow', name: '노랑꽃', pts: 3, body: '#7ccb51', dark: '#55a534', flower: '#ffd23f', flowerCore: '#ff9f43', pot: '#e2b53c', potDark: '#b8901f' },
    { key: 'red', name: '빨간가시', pts: 3, body: '#57ad3f', dark: '#3c8629', flower: '#ff5a3c', flowerCore: '#ffd23f', pot: '#cc3f2f', potDark: '#9e2a1e' }
  ];

  var ACTIONS = {
    steal:   { key: 'steal',   name: '슬쩍!',       icon: '🤏', short: '1장 뺏기',       needTarget: true },
    demand:  { key: 'demand',  name: '이거 있냐?',  icon: '👀', short: '종류 전부 뺏기', needTarget: true, needType: true },
    draw3:   { key: 'draw3',   name: '3장 뽑기',    icon: '🎁', short: '한 번에 3장',    needTarget: false },
    swapAll: { key: 'swapAll', name: '손패 바꾸기', icon: '🔄', short: '손패 통째 교환', needTarget: true },
    freeze:  { key: 'freeze',  name: '정지!',       icon: '🧊', short: '언제든 얼림',    needTarget: true, instant: true },
    flip:    { key: 'flip',    name: '판 뒤집기',   icon: '🌀', short: '교환 / 돌리기',  needTarget: false },
    shield:  { key: 'shield',  name: '가시 방패',   icon: '🛡️', short: '언제든 방어',    needTarget: false, instant: true },
    skip:    { key: 'skip',    name: '턴 넘기기',   icon: '⏭️', short: '턴 즉시 넘김',   needTarget: false, instant: true },
    reverse: { key: 'reverse', name: '턴 반대로',   icon: '🔁', short: '방향 유턴!',     needTarget: false, instant: true },
    bomb:    { key: 'bomb',    name: '썩은 선인장', icon: '💣', short: '떠넘기기 -1점',   needTarget: true }
  };
  // v3: 아무 때나(내 턴이 아니어도) 손패에서 톡 쓸 수 있는 즉시 카드 4종
  var INSTANTS = ['shield', 'freeze', 'skip', 'reverse'];

  var CHARS = [
    { name: '메롱이', emoji: '😎', tag: '일단 메롱' },
    { name: '반창고', emoji: '😭', tag: '맞을 때마다 울음' },
    { name: '뾰족이', emoji: '😡', tag: '가시가 제일 많음' },
    { name: '후드', emoji: '🥷', tag: '조용한 손버릇' },
    { name: '깐족이', emoji: '🤪', tag: '약올리기 장인' }
  ];

  // v2 덱(122장): 선인장 60장 + 액션/견제 62장 → 액션이 덱의 절반 이상
  var DECK_COUNTS = {
    g: 15, p: 15, y: 15, r: 15,     // 선인장 60 (종류별 5세트씩 = 총 55점어치: 2·3·3·3점)
    t: 10,                           // 🎁 3장 뽑기
    w: 9,                            // 🔄 손패 바꾸기
    z: 9,                            // 🧊 정지!
    s: 8,                            // 🤏 슬쩍
    d: 7,                            // 👀 이거 있냐?
    h: 9,                            // 🛡️ 가시 방패
    b: 6,                            // 💣 썩은 선인장
    f: 4,                            // 🌀 판 뒤집기
    k: 8,                            // ⏭️ 턴 넘기기 (v3)
    v: 8                             // 🔁 턴 반대로 (v3)
  };
  var PREFIX = { g: 'g', p: 'p', y: 'y', r: 'r', s: 'steal', d: 'demand', t: 'draw3', w: 'swapAll', z: 'freeze', f: 'flip', h: 'shield', b: 'bomb', k: 'skip', v: 'reverse' };

  // 도발/견제 멘트 (화면 중앙 대형 임팩트에 그대로 뜬다)
  var TAUNT_LINES = {
    steal: ['슬쩍~ 이거 내 거야 ㅋㅋ', '어? 카드 하나 없어졌네?', '고마워~ 잘 쓸게'],
    demand: ['있으면 다 내놔~', '다 내 거! 메롱~', '숨겨봐야 다 내 거 ㅋㅋ'],
    swapAll: ['손패 잘 쓸게~ ㅋㅋ', '바꿔치기 성공! 통째로 내 거~', '이게 내 패다!'],
    freeze: ['얼음 땡 ㅋㅋ', '꽁꽁 얼었지? 한 턴 없다~', '꽝! 다음 턴 없음 ㅋㅋ'],
    bomb: ['이거 너 줄게~', '썩은 선인장 선물!', '받아라! 냄새나 ㅋㅋ'],
    block: ['팅! 안 뚫려 ㅋㅋ', '방패 만세~ 못 뺏지?', '가시가 더 아프지?'],
    stealFail: ['손이 비었네? ㅋㅋㅋ', '헛손질 ㅋㅋ', '뭘 뺏어 ㅋㅋ'],
    demandFail: ['메롱~ 없지롱!', '그거 없는데? ㅋㅋ', '없다니까~ ㅋㅋ'],
    frozen: ['얼음 안에 잘 있지? ㅋㅋ', '꽁꽁~ 다음에 봐 ㅋㅋ'],
    spin: ['술래 돌려버렸다 ㅋㅋ', '다 뒤섞여라~ ㅋㅋ'],
    skip: ['네 턴은 없던 걸로~ ㅋㅋ', '쉿! 이번 턴은 내 거 ㅋㅋ', '한 칸 쉬어~ ⏭️'],
    reverse: ['🔁 방향 유턴! 거꾸로 간다~', '거꾸로 가자~ ㅋㅋ', '뒤로 돌아! 유턴!'],
    wall: ['🛡️ 가시 갑옷 장착!', '미리 준비했지 ㅋㅋ', '한 대는 버틴다!'],
    wallBlock: ['🛡️ 사전 방어! 튕겼다!', '팅! 미리 켜뒀지 ㅋㅋ', '가시 갑옷이 대신 맞음 ㅋㅋ']
  };
  var IMPACT_ICON = { steal: '🤏', demand: '👀', bomb: '💣', swapAll: '🔄', freeze: '🧊', block: '🛡️', stealFail: '😶', demandFail: '😝', frozen: '🧊', spin: '🌀', skip: '⏭️', reverse: '🔁', wall: '🛡️', wallBlock: '🛡️' };

  /* ---------------- 유틸 ---------------- */

  function mulberry(state) {
    state.rng = (state.rng + 0x6D2B79F5) | 0;
    var t = state.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rnd(st) { return mulberry(st); }
  function randInt(st, n) { return Math.floor(rnd(st) * n) % n; }
  function pick(st, arr) { return arr[randInt(st, arr.length)]; }
  function removeOne(arr, val) { var i = arr.indexOf(val); if (i >= 0) { arr.splice(i, 1); return true; } return false; }
  // 받침 유무에 맞는 조사 (로그 가독성)
  function josa(word, withBatchim, withoutBatchim) {
    var w = String(word || '');
    var ch = w.charCodeAt(w.length - 1);
    var has = (ch >= 0xAC00 && ch <= 0xD7A3) ? ((ch - 0xAC00) % 28) !== 0 : true;
    return has ? withBatchim : withoutBatchim;
  }
  function iGa(name) { return name + josa(name, '이', '가'); }
  function eulReul(name) { return name + josa(name, '을', '를'); }
  function eunNeun(name) { return name + josa(name, '은', '는'); }
  function shuffle(st, arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(st, i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function cardInfo(id) {
    if (!id) return null;
    var k = id.charAt(0);
    var actKey = PREFIX[k];
    if (actKey && ACTIONS[actKey]) {
      var a = ACTIONS[actKey];
      return { id: id, kind: 'action', act: a.key, name: a.name, icon: a.icon, short: a.short };
    }
    var ci = k === 'g' ? 0 : k === 'p' ? 1 : k === 'y' ? 2 : 3;
    var c = CACTUS[ci];
    return { id: id, kind: 'cactus', ci: ci, type: c.key, name: c.name, icon: '🌵', pts: c.pts, color: c.body };
  }

  function buildDeck(st) {
    var deck = [];
    Object.keys(DECK_COUNTS).forEach(function (k) {
      for (var i = 0; i < DECK_COUNTS[k]; i++) deck.push(k + i);
    });
    return shuffle(st, deck);
  }

  /* ---------------- 게임 생성 ---------------- */

  function newGame(opt) {
    opt = opt || {};
    var seats = opt.players || [{ name: '나', avatar: 0 }];
    var seed = (opt.seed != null ? opt.seed : (Date.now() >>> 0)) >>> 0;
    var st = {
      v: VERSION,
      id: opt.id || ('g' + Date.now().toString(36)),
      mode: opt.mode || 'solo',
      roomCode: opt.roomCode || null,
      targetScore: opt.targetScore || TARGET_SCORE,
      startHand: opt.startHand || 6,
      phase: 'playing',
      turn: 0,
      dir: 1,               // v3: 턴 진행 방향 (+1 시계 / -1 반시계)
      turnNo: 0,
      acted: false,
      waitingScore: false,
      rng: seed || 1,
      seed: seed,
      deck: [],
      discard: [],
      setPile: [],          // {seat, type, pts}
      players: [],
      log: [],
      fx: [],
      fxSeq: 0,
      logSeq: 0,
      instCd: {},           // v3: 좌석별 즉시 카드 쿨다운
      pending: null,
      reason: null,
      winners: [],
      createdAt: opt.now || Date.now(),
      endsAt: null
    };
    st.players = seats.map(function (p, i) {
      return {
        seat: i,
        name: p.name || ('플레이어' + (i + 1)),
        avatar: (p.avatar != null ? p.avatar : i) % 5,
        bot: !!p.bot,
        cid: p.cid || null,
        connected: true,
        frozen: 0,
        wall: 0,            // v3: 미리 켜둔 가시 갑옷 (다음 공격 1회 자동 방어)
        hand: [],
        score: 0,
        sets: 0,
        instTurn: -1        // v3: 봇이 이 턴에 즉시 카드를 쓴 turnNo
      };
    });
    st.deck = buildDeck(st);
    // 손패 나눠주기
    var startHand = opt.startHand || 6;
    for (var r = 0; r < startHand; r++) {
      for (var i = 0; i < st.players.length; i++) {
        var c = st.deck.pop();
        if (c) st.players[i].hand.push(c);
      }
    }
    st.deck = shuffle(st, st.deck);
    log(st, '🌵 ' + st.players.length + '명 입장! ' + st.targetScore + '점 먼저 모으면 승리!');
    log(st, '😝 오늘도 서로 놀리면서 가시밭길을 걸어보자');
    log(st, '👉 ' + st.players[0].name + '부터 시작!');
    fx(st, { t: 'start' });
    return st;
  }

  /* ---------------- 로그 / 효과 ---------------- */

  function log(st, text) {
    st.logSeq++;
    st.log.push({ i: st.logSeq, text: text });
    if (st.log.length > 40) st.log.shift();
  }
  function fx(st, obj) {
    st.fxSeq++;
    obj.i = st.fxSeq;
    st.fx.push(obj);
    if (st.fx.length > 16) st.fx.shift();
  }

  // 화면 중앙 대형 도발/견제 임팩트 (모든 화면에 동기화되는 fx)
  function impactFx(st, kind, seat, text) {
    var arr = TAUNT_LINES[kind] || ['메롱~'];
    var line = text || arr[st.fxSeq % arr.length];
    fx(st, { t: 'impact', kind: kind, seat: seat, icon: IMPACT_ICON[kind] || '😝', text: line });
    if (st.players[seat]) log(st, '😝 ' + st.players[seat].name + ' "' + line + '"');
    return line;
  }

  /* ---------------- 조회 ---------------- */

  function availSets(st, seat) {
    var p = st.players[seat];
    if (!p) return [];
    var counts = {};
    p.hand.forEach(function (id) {
      var info = cardInfo(id);
      if (info.kind === 'cactus') counts[info.type] = (counts[info.type] || 0) + 1;
    });
    return CACTUS.filter(function (c) { return (counts[c.key] || 0) >= 3; })
      .map(function (c) { return { key: c.key, name: c.name, pts: c.pts }; });
  }

  function countType(p, type) {
    return p.hand.filter(function (id) { var i = cardInfo(id); return i.kind === 'cactus' && i.type === type; }).length;
  }

  function hasAction(p, act) {
    return p.hand.some(function (id) { return cardInfo(id).act === act; });
  }

  function handCounts(p) {
    var c = { green: 0, pink: 0, yellow: 0, red: 0 };
    p.hand.forEach(function (id) { var i = cardInfo(id); if (i.kind === 'cactus') c[i.type]++; });
    return c;
  }

  function isMyTurn(st, seat) {
    return st.phase === 'playing' && st.turn === seat && !st.pending;
  }

  function leaderSeat(st, exclude) {
    var best = -1, bestScore = -1e9, bestCards = -1;
    st.players.forEach(function (p) {
      if (p.seat === exclude) return;
      if (p.score > bestScore || (p.score === bestScore && p.hand.length > bestCards)) {
        best = p.seat; bestScore = p.score; bestCards = p.hand.length;
      }
    });
    return best;
  }

  function totalCards(st) {
    var n = st.deck.length + st.discard.length + st.setPile.length * 3;
    st.players.forEach(function (p) { n += p.hand.length; });
    return n;
  }

  /* ---------------- 턴 진행 ---------------- */

  function finishAct(st) {
    st.acted = true;
    var sets = availSets(st, st.turn);
    if (sets.length && st.phase === 'playing') {
      st.waitingScore = true;
      log(st, '🎉 ' + st.players[st.turn].name + ' 손에 三장 완성! 점수를 찍어라!');
    } else {
      endTurn(st);
    }
  }

  function endTurn(st) {
    if (st.phase !== 'playing') return;
    st.pending = null;
    st.acted = false;
    st.waitingScore = false;
    if (st.deck.length === 0) { finishGame(st, 'deck'); return; }
    if (st.turnNo >= MAX_TURNS) { finishGame(st, 'long'); return; }
    advanceTurn(st);
  }

  // 🧊 얼음에 갇힌 사람은 차례를 통째로 건너뛴다 (v3: 진행 방향 반영)
  function advanceTurn(st) {
    var n = st.players.length, dir = st.dir === -1 ? -1 : 1, guard = 0;
    while (guard++ < n * 2 + 2) {
      st.turn = ((st.turn + dir) % n + n) % n;
      st.turnNo++;
      var p = st.players[st.turn];
      if (p.frozen > 0) {
        p.frozen--;
        fx(st, { t: 'frozenSkip', seat: st.turn, left: p.frozen });
        log(st, '🧊 ' + iGa(p.name) + ' 얼음에 갇혀 이번 턴 통째로 건너뜀!' + (p.frozen ? ' (한 번 더!)' : ''));
        continue;
      }
      break;
    }
    fx(st, { t: 'turn', seat: st.turn });
    log(st, '— ' + st.players[st.turn].name + ' 차례 —');
  }

  // ⏭️ 지금 진행 중인 턴을 즉시 끝내고 다음 순서로 (스킵·즉시 정지 공용)
  function passTurnNow(st) {
    st.pending = null;
    st.acted = false;
    st.waitingScore = false;
    if (st.phase !== 'playing') return;
    if (st.deck.length === 0) { finishGame(st, 'deck'); return; }
    if (st.turnNo >= MAX_TURNS) { finishGame(st, 'long'); return; }
    advanceTurn(st);
  }

  function finishGame(st, reason) {
    if (st.phase === 'over') return;
    st.phase = 'over';
    st.reason = reason || 'score';
    st.endsAt = Date.now();
    st.pending = null;
    // 썩은 선인장 정산
    st.players.forEach(function (p) {
      var bombs = p.hand.filter(function (id) { return cardInfo(id).act === 'bomb'; }).length;
      if (bombs) {
        p.score -= bombs;
        log(st, '💣 ' + p.name + ' 손에 썩은 선인장 ' + bombs + '개… ' + bombs + '점 깎임!');
      }
    });
    var max = -1e9;
    st.players.forEach(function (p) { if (p.score > max) max = p.score; });
    st.winners = st.players.filter(function (p) { return p.score === max; }).map(function (p) { return p.seat; });
    if (st.winners.length > 1) log(st, '🤝 공동 우승! ' + st.winners.map(function (s) { return st.players[s].name; }).join(' · '));
    st.finalScores = st.players.map(function (p) { return { seat: p.seat, score: p.score, sets: p.sets }; });
    fx(st, { t: 'win', winners: st.winners, reason: st.reason });
    log(st, reason === 'deck' ? '🃏 덱 바닥! 최고 점수 승리!' : '🏁 게임 끝!');
  }

  /* ---------------- 행동 ---------------- */

  function draw(st, seat) {
    if (!isMyTurn(st, seat)) return { ok: false, err: '네 차례가 아니야' };
    if (st.acted) return { ok: false, err: '이번 턴엔 이미 행동했어' };
    var p = st.players[seat];
    if (p.hand.length >= HAND_LIMIT) return { ok: false, err: '손이 꽉 찼어! 카드를 쓰거나 버려' };
    if (!st.deck.length) return { ok: false, err: '덱이 비었어!' };
    var c = st.deck.pop();
    p.hand.push(c);
    var info = cardInfo(c);
    fx(st, { t: 'draw', seat: seat, card: c });
    log(st, '🃏 ' + p.name + ' 덱에서 1장 뽑음' + ' (' + info.name + ')');
    finishAct(st);
    return { ok: true, card: c };
  }

  function discardCard(st, seat, cardId) {
    if (!isMyTurn(st, seat)) return { ok: false, err: '네 차례가 아니야' };
    var p = st.players[seat];
    if (!removeOne(p.hand, cardId)) return { ok: false, err: '그 카드 없어' };
    st.discard.push(cardId);
    fx(st, { t: 'discard', seat: seat, card: cardId });
    log(st, '🗑️ ' + p.name + ' 카드 1장 버림');
    return { ok: true };
  }

  function scoreSet(st, seat, type) {
    if (st.phase !== 'playing') return { ok: false, err: '게임 끝' };
    if (st.turn !== seat) return { ok: false, err: '네 차례에만 점수를 낼 수 있어' };
    if (st.pending) return { ok: false, err: '방패 상황 처리 중' };
    var p = st.players[seat];
    var ci = -1;
    CACTUS.forEach(function (c, i) { if (c.key === type) ci = i; });
    if (ci < 0) return { ok: false, err: '그 선인장 없어' };
    var ids = p.hand.filter(function (id) { var i = cardInfo(id); return i.kind === 'cactus' && i.type === type; });
    if (ids.length < 3) return { ok: false, err: '3장이 안 모였어' };
    for (var k = 0; k < 3; k++) removeOne(p.hand, ids[k]);
    var c = CACTUS[ci];
    p.score += c.pts;
    p.sets++;
    st.setPile.push({ seat: seat, type: type, pts: c.pts });
    fx(st, { t: 'score', seat: seat, type: type, pts: c.pts, n: p.sets });
    log(st, '🎉 ' + p.name + ' ' + c.name + ' 3장 완성! +' + c.pts + '점 (총 ' + p.score + '점)');
    // 손에 남은 같은 종류가 3장 이상이면 계속 가능
    if (p.score >= st.targetScore) {
      st.phase = 'over';
      st.reason = 'score';
      st.endsAt = Date.now();
      st.winners = [seat];
      st.finalScores = st.players.map(function (q) { return { seat: q.seat, score: q.score, sets: q.sets }; });
      st.pending = null;
      fx(st, { t: 'win', winners: [seat], reason: 'score' });
      log(st, '🏆 ' + p.name + ' 님' + josa(p.name, '이', '이') + ' ' + st.targetScore + '점 달성! 우승!!');
      return { ok: true, win: true };
    }
    if (st.acted && availSets(st, seat).length === 0) endTurn(st);
    return { ok: true };
  }

  function playDraw3(st, seat, cardId) {
    var p = st.players[seat];
    if (p.hand.length >= HAND_LIMIT) return { ok: false, err: '손이 꽉 찼어! 한 장 버리고 써' };
    if (!st.deck.length) return { ok: false, err: '덱이 비었어!' };
    removeOne(p.hand, cardId); st.discard.push(cardId);
    var got = [];
    for (var i = 0; i < 3; i++) {
      if (!st.deck.length) break;
      if (p.hand.length >= HAND_LIMIT) break;
      var c = st.deck.pop(); p.hand.push(c); got.push(c);
    }
    fx(st, { t: 'draw3', seat: seat, n: got.length, cards: got });
    log(st, '🎁 ' + p.name + ' 3장 뽑기! ' + got.length + '장 획득' +
      (got.length < 3 ? ' (덱/손패 한계)' : '') + ' → 손 ' + p.hand.length + '장');
    finishAct(st);
    return { ok: true, n: got.length, cards: got };
  }

  function playCard(st, seat, cardId, payload) {
    if (!isMyTurn(st, seat)) return { ok: false, err: '네 차례가 아니야' };
    if (st.acted) return { ok: false, err: '이번 턴엔 이미 행동했어' };
    var p = st.players[seat];
    if (p.hand.indexOf(cardId) < 0) return { ok: false, err: '그 카드 없어' };
    var info = cardInfo(cardId);
    if (info.kind !== 'action') return { ok: false, err: '선인장 카드는 점수로만 써' };
    payload = payload || {};

    if (info.act === 'shield') return { ok: false, err: '🛡️ 방패는 아무 때나 손패에서 바로 켜! (⚡ 즉시 카드)' };
    if (info.act === 'skip' || info.act === 'reverse') return playInstant(st, seat, cardId, payload);

    if (info.act === 'draw3') return playDraw3(st, seat, cardId);

    if (info.act === 'freeze') {
      var ft = payload.target;
      if (ft == null || ft === seat || !st.players[ft]) return { ok: false, err: '얼릴 상대를 골라' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      beginAttack(st, seat, ft, 'freeze', {}, cardId);
      return { ok: true, pending: true };
    }

    if (info.act === 'swapAll') {
      var wt = payload.target;
      if (wt == null || wt === seat || !st.players[wt]) return { ok: false, err: '바꿀 상대를 골라' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      beginAttack(st, seat, wt, 'swapAll', {}, cardId);
      return { ok: true, pending: true };
    }

    if (info.act === 'steal') {
      var target = payload.target;
      if (target == null || target === seat || !st.players[target]) return { ok: false, err: '뺏을 상대를 골라' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      beginAttack(st, seat, target, 'steal', { }, cardId);
      return { ok: true, pending: true };
    }

    if (info.act === 'demand') {
      var target2 = payload.target;
      if (target2 == null || target2 === seat || !st.players[target2]) return { ok: false, err: '물어볼 상대를 골라' };
      if (!payload.type) return { ok: false, err: '어떤 선인장인지 골라' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      beginAttack(st, seat, target2, 'demand', { type: payload.type }, cardId);
      return { ok: true, pending: true };
    }

    if (info.act === 'bomb') {
      var target3 = payload.target;
      if (target3 == null || target3 === seat || !st.players[target3]) return { ok: false, err: '떠넘길 상대를 골라' };
      removeOne(p.hand, cardId);
      beginAttack(st, seat, target3, 'bomb', {}, cardId);
      return { ok: true, pending: true };
    }

    if (info.act === 'flip') {
      removeOne(p.hand, cardId); st.discard.push(cardId);
      var mode = payload.mode === 'rotate' ? 'rotate' : 'swap';
      if (mode === 'rotate') {
        var give = st.players.map(function (q) { return q.hand.length ? q.hand[randInt(st, q.hand.length)] : null; });
        // 동시에: 먼저 전부 빼고 나서 다음 사람에게
        give.forEach(function (cid, i) { if (cid) removeOne(st.players[i].hand, cid); });
        var moved = 0;
        give.forEach(function (cid, i) {
          if (!cid) return;
          var to = (i + 1) % st.players.length;
          st.players[to].hand.push(cid);
          moved++;
        });
        impactFx(st, 'spin', seat);
        fx(st, { t: 'flip', seat: seat, mode: 'rotate', moved: moved });
        log(st, '🌀 ' + p.name + ' 판 뒤집기! 전원 카드 1장씩 옆으로 싹 돌았다 (' + moved + '장)');
      } else {
        var lead = leaderSeat(st, seat);
        if (lead < 0) { st.discard.push(cardId); log(st, '🌀 뒤집을 상대가 없다…'); }
        else if (!p.hand.length || !st.players[lead].hand.length) {
          log(st, '🌀 ' + st.players[lead].name + '와 바꿀 카드가 없다! 헛수고!');
        } else {
          var mine = p.hand[randInt(st, p.hand.length)];
          var theirs = st.players[lead].hand[randInt(st, st.players[lead].hand.length)];
          removeOne(p.hand, mine); removeOne(st.players[lead].hand, theirs);
          p.hand.push(theirs); st.players[lead].hand.push(mine);
          fx(st, { t: 'flip', seat: seat, mode: 'swap', withSeat: lead, give: mine, take: theirs });
          log(st, '🌀 ' + p.name + ' ↔ ' + st.players[lead].name + ' 1장 맞바꿈!');
        }
      }
      finishAct(st);
      return { ok: true };
    }
    return { ok: false, err: '몰?루' };
  }

  /* ---------------- v3: ⚡ 즉시 카드 (아무 때나 사용) ---------------- */

  function isInstantAct(act) { return INSTANTS.indexOf(act) >= 0; }

  // 내 턴이 아니어도(방패 응답 중·게임 종료 상태 제외) 손패에서 바로 쓴다
  function playInstant(st, seat, cardId, payload, now) {
    if (!st || st.phase !== 'playing') return { ok: false, err: '게임은 이미 끝났어' };
    var p = st.players[seat];
    if (!p) return { ok: false, err: '그 자리 없어' };
    var info = cardInfo(cardId);
    if (!info || info.kind !== 'action' || !isInstantAct(info.act)) return { ok: false, err: '즉시 카드가 아니야' };
    if (p.hand.indexOf(cardId) < 0) return { ok: false, err: '그 카드 없어' };
    if (st.pending) return { ok: false, err: '방패 응답 중엔 즉시 카드 못 써!' };
    payload = payload || {};
    now = now || Date.now();
    st.instCd = st.instCd || {};
    if (st.instCd[seat] && now - st.instCd[seat] < INSTANT_CD_MS) return { ok: false, err: '너무 빨라! 잠깐만' };

    // 🛡️ 미리 장착: 다음 공격 1회 자동 방어
    if (info.act === 'shield') {
      if ((p.wall || 0) > 0) return { ok: false, err: '이미 방어막이 켜져 있어!  (중복 낭비 금지)' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      st.instCd[seat] = now;
      p.wall = 1;
      impactFx(st, 'wall', seat, '🛡️ 가시 갑옷 장착!');
      fx(st, { t: 'wall', seat: seat, on: true });
      log(st, '🛡️ ' + p.name + ' 가시 갑옷 장착! 다음 공격 1회 자동 방어');
      return { ok: true, wall: true };
    }

    // 🔁 턴 반대로: 진행 방향 즉시 유턴 (+1 ↔ -1)
    if (info.act === 'reverse') {
      removeOne(p.hand, cardId); st.discard.push(cardId);
      st.instCd[seat] = now;
      var from = st.dir === -1 ? -1 : 1;
      st.dir = -from;
      impactFx(st, 'reverse', seat, '🔁 방향 유턴! 거꾸로 간다~');
      fx(st, { t: 'reverse', seat: seat, dir: st.dir, from: from });
      log(st, '🔁 ' + p.name + ' 턴 반대로! 진행 방향 ' + (st.dir === 1 ? '➡️ 시계' : '⬅️ 반시계') + '로 유턴!');
      return { ok: true, dir: st.dir };
    }

    // ⏭️ 턴 넘기기: 내 턴이면 패스, 남의 턴이면 기습으로 그 턴을 즉시 종료
    if (info.act === 'skip') {
      removeOne(p.hand, cardId); st.discard.push(cardId);
      st.instCd[seat] = now;
      var cur = st.turn;
      if (cur === seat) {
        impactFx(st, 'skip', seat, '⏭️ 내 턴 넘기기!');
        log(st, '⏭️ ' + p.name + ' 턴을 넘겼다 (뽑기 없이 패스)');
      } else {
        impactFx(st, 'skip', seat, '⏭️ ' + st.players[cur].name + ' 턴 강제 종료!');
        log(st, '⏭️ ' + p.name + '의 기습! ' + st.players[cur].name + ' 턴을 즉시 건너뛴다!');
      }
      passTurnNow(st);
      return { ok: true, skipped: cur };
    }

    // 🧊 정지!: 내 턴이 아니어도 지목한 상대를 즉시 얼린다
    if (info.act === 'freeze') {
      var target = payload.target;
      if (target == null || target === seat || !st.players[target]) return { ok: false, err: '얼릴 상대를 골라' };
      removeOne(p.hand, cardId); st.discard.push(cardId);
      st.instCd[seat] = now;
      var def = st.players[target];
      if ((def.wall || 0) > 0) {          // 미리 켜둔 갑옷이 얼음을 대신 맞는다
        def.wall--;
        impactFx(st, 'wallBlock', target, '🛡️ 사전 방어! 튕겼다!');
        fx(st, { t: 'wallBlock', attack: 'freeze', attacker: seat, defender: target, left: def.wall });
        log(st, '🛡️ ' + def.name + '의 가시 갑옷이 얼음을 튕겨냈다! (남은 갑옷 ' + def.wall + ')');
        return { ok: true, blocked: true };
      }
      impactFx(st, 'freeze', seat);
      def.frozen = (def.frozen || 0) + 1;
      var nowTurn = st.phase === 'playing' && st.turn === target;
      fx(st, { t: 'freeze', attacker: seat, defender: target, turns: def.frozen, instant: true, nowTurn: nowTurn });
      log(st, '🧊 ' + iGa(p.name) + ' ' + eulReul(def.name) + ' 즉시 얼렸다!' +
        (nowTurn ? ' 이번 턴 통째로 건너뛰는 중!' : ' 다음 턴 통째로 건너뜀'));
      if (nowTurn) {
        def.frozen = Math.max(0, def.frozen - 1);   // 이번 턴 스킵으로 소모
        fx(st, { t: 'frozenSkip', seat: target, left: def.frozen });
        log(st, '🧊 ' + iGa(def.name) + ' 얼음에 갇혀 이번 턴 통째로 건너뜀!');
        passTurnNow(st);
      }
      return { ok: true, frozen: def.frozen };
    }
    return { ok: false, err: '몰?루' };
  }

  /* ---------------- 공격 / 방패 ---------------- */

  function beginAttack(st, attacker, defender, kind, data, cardId) {
    var def = st.players[defender];
    // 🛡️ v3: 미리 켜둔 가시 갑옷이 있으면 5초 카운터 없이 자동 방어
    if ((def.wall || 0) > 0) {
      def.wall--;
      if (kind === 'bomb') st.discard.push(cardId);   // 떠넘기기 실패 → 카드 폐기
      impactFx(st, 'wallBlock', defender, '🛡️ 사전 방어! 튕겼다!');
      fx(st, { t: 'wallBlock', attack: kind, attacker: attacker, defender: defender, left: def.wall });
      log(st, '🛡️ ' + def.name + '의 가시 갑옷이 ' + st.players[attacker].name + '의 공격을 자동으로 막았다! (남은 갑옷 ' + def.wall + ')');
      finishAct(st);
      return;
    }
    impactFx(st, kind, attacker);   // 공격 선언 = 화면 중앙 대형 도발
    var canShield = hasAction(def, 'shield');
    if (canShield) {
      var auto = !!def.bot;
      st.pending = {
        kind: 'shield',
        attacker: attacker,
        defender: defender,
        action: kind,
        data: data || {},
        card: cardId,
        auto: auto,
        use: auto ? (rnd(st) < 0.62) : false,
        openedAt: Date.now(),
        deadline: Date.now() + (auto ? BOT_SHIELD_MS : SHIELD_MS)
      };
      fx(st, { t: 'shieldOpen', attacker: attacker, defender: defender, action: kind, auto: auto, ms: auto ? BOT_SHIELD_MS : SHIELD_MS });
      log(st, '🛡️ ' + def.name + ' 방패를 들었다! ' + (auto ? '…?' : '5초 안에 눌러야 막는다!'));
    } else {
      applyAttack(st, { attacker: attacker, defender: defender, action: kind, data: data || {}, card: cardId }, false);
    }
  }

  function resolveShield(st, seat, use) {
    var pend = st.pending;
    if (!pend || pend.defender !== seat) return { ok: false, err: '방패 상황 아님' };
    applyAttack(st, pend, !!use);
    return { ok: true };
  }

  function applyAttack(st, pend, blocked) {
    st.pending = null;
    var atk = st.players[pend.attacker];
    var def = st.players[pend.defender];
    if (blocked) {
      var hid = def.hand.filter(function (id) { return cardInfo(id).act === 'shield'; })[0];
      if (hid) { removeOne(def.hand, hid); st.discard.push(hid); }
      if (pend.action === 'bomb') st.discard.push(pend.card);
      impactFx(st, 'block', pend.defender);
      fx(st, { t: 'block', attacker: pend.attacker, defender: pend.defender, action: pend.action });
      log(st, '🛡️ 팅! ' + def.name + '의 가시 방패가 ' + atk.name + '의 공격을 튕겨냈다! ' + iGa(atk.name) + ' 손해 1장');
    } else if (pend.action === 'steal') {
      if (!def.hand.length) {
        impactFx(st, 'stealFail', pend.defender);
        fx(st, { t: 'stealFail', attacker: pend.attacker, defender: pend.defender });
        log(st, '😶 ' + def.name + ' 손이 텅 비었다… ' + iGa(atk.name) + ' 헛손질!');
      } else {
        var idx = randInt(st, def.hand.length);
        var cid = def.hand[idx];
        removeOne(def.hand, cid);
        atk.hand.push(cid);
        fx(st, { t: 'steal', attacker: pend.attacker, defender: pend.defender, card: cid });
        log(st, '🤏 ' + iGa(atk.name) + ' ' + def.name + '에게서 ' + cardInfo(cid).name + ' 1장 슬쩍!');
      }
    } else if (pend.action === 'demand') {
      var want = pend.data.type;
      var got = def.hand.filter(function (id) { var i = cardInfo(id); return i.kind === 'cactus' && i.type === want; });
      var ci = 0; CACTUS.forEach(function (c, i) { if (c.key === want) ci = i; });
      var cname = CACTUS[ci].name;
      if (got.length) {
        var room = Math.max(0, HAND_LIMIT - atk.hand.length);
        var take = got.slice(0, room);
        take.forEach(function (id) { removeOne(def.hand, id); atk.hand.push(id); });
        fx(st, { t: 'demand', attacker: pend.attacker, defender: pend.defender, type: want, n: take.length });
        log(st, '👀 "' + cname + ' 있냐?" → ' + def.name + ' ' + take.length + '장 전부 털렸다!' +
          (take.length < got.length ? ' (내 손이 꽉 차 ' + (got.length - take.length) + '장은 못 챙김)' : ''));
      } else {
        fx(st, { t: 'demandFail', attacker: pend.attacker, defender: pend.defender, type: want });
        impactFx(st, 'demandFail', pend.defender);
        log(st, '👀 "' + cname + ' 있냐?" → ' + def.name + ' "없는데? 메롱~"');
      }
    } else if (pend.action === 'bomb') {
      if (def.hand.length >= HAND_LIMIT) {
        // 손이 꽉 찬 상대에겐 못 떠넘긴다 → 폭탄이 주인에게 되돌아온다
        atk.hand.push(pend.card);
        fx(st, { t: 'bombBounce', attacker: pend.attacker, defender: pend.defender, card: pend.card });
        log(st, '💣 ' + def.name + ' 손이 꽉 차서 썩은 선인장이 ' + atk.name + '에게 되돌아왔다!');
      } else {
        def.hand.push(pend.card);
        fx(st, { t: 'bomb', attacker: pend.attacker, defender: pend.defender, card: pend.card });
        log(st, '💣 ' + iGa(atk.name) + ' ' + def.name + '에게 썩은 선인장을 떠넘겼다! (끝나고 -1점)');
      }
    } else if (pend.action === 'swapAll') {
      var aN = atk.hand.length, dN = def.hand.length;
      var tmp = atk.hand; atk.hand = def.hand; def.hand = tmp;
      fx(st, { t: 'swapAll', attacker: pend.attacker, defender: pend.defender, aN: aN, dN: dN });
      log(st, '🔄 ' + iGa(atk.name) + ' ' + def.name + ' 손패를 통째로 바꿔치기! (' + aN + '장 ↔ ' + dN + '장)');
    } else if (pend.action === 'freeze') {
      def.frozen = (def.frozen || 0) + 1;
      fx(st, { t: 'freeze', attacker: pend.attacker, defender: pend.defender, turns: def.frozen });
      log(st, '🧊 ' + iGa(atk.name) + ' ' + eulReul(def.name) + ' 얼렸다! 다음 턴 통째로 건너뜀');
    }
    finishAct(st);
  }

  /* ---------------- 시간 처리 ---------------- */

  function tick(st, now) {
    now = now || Date.now();
    var pend = st.pending;
    if (!pend || st.phase !== 'playing') return false;
    if (now < pend.deadline) return false;
    applyAttack(st, pend, pend.auto ? !!pend.use : false);
    return true;
  }

  /* ---------------- 봇 ---------------- */

  function countsOfHand(p) {
    var c = { bomb: 0, steal: 0, demand: 0, draw3: 0, swapAll: 0, freeze: 0, flip: 0, shield: 0, skip: 0, reverse: 0 };
    p.hand.forEach(function (id) { var i = cardInfo(id); if (i.act) c[i.act]++; });
    return c;
  }

  // v3: 봇의 즉시 카드 판단 (턴을 잡아먹지 않는 프리 액션)
  function botInstant(st, seat, tnow) {
    var p = st.players[seat];
    var ac = countsOfHand(p);
    if (!ac.shield && !ac.freeze && !ac.skip && !ac.reverse) return false;
    var lead = leaderSeat(st, seat);
    var n = st.players.length, dir = st.dir === -1 ? -1 : 1;
    var nextSeat = ((seat + dir) % n + n) % n;
    var now = tnow || Date.now();
    // 1) 손이 꽉 찾으면 턴 넘기기로 한 장 비우고 바로 패스
    if (ac.skip && p.hand.length >= HAND_LIMIT && rnd(st) < 0.85) {

/* ============================================================
   게임 시작
   ============================================================ */
function botNameFor(avatar, taken) {
  var base = E.CHARS[avatar % 5].name;
  if (taken.indexOf(base) < 0) return base;
  return base + '2';
}

function startSolo() {
  var p = profile();
  var taken = [p.name];
  var players = [{ name: p.name, avatar: p.avatar, bot: false }];
  for (var i = 0; i < 4; i++) {
    var av = (p.avatar + 1 + i) % 5;
    var nm = botNameFor(av, taken);
    taken.push(nm);
    players.push({ name: nm, avatar: av, bot: true });
  }
  App.mode = 'solo';
  App.seat = 0;
  App.st = E.newGame({ players: players, seed: (Date.now() >>> 0), mode: 'solo' });
  App.lastFx = 0;
  App.overShown = false;
  showScreen('game');
  render(true);
  toast('🌵 ' + players.length + '인 테이블! ' + App.st.targetScore + '점 먼저 모으면 승리', 2200);
}

/* ============================================================
   렌더링
   ============================================================ */
function myTurn() {
  var st = App.st;
  return !!st && st.phase === 'playing' && st.turn === App.seat && !st.pending;
}
function iCanAct() {
  return App.mode === 'solo' || (App.net && App.net.isHost);
}
function oppSeats(st) {
  var out = [];
  for (var i = 1; i < st.players.length; i++) out.push((App.seat + i) % st.players.length);
  return out;
}
function seatInfo(st, seat) { return st.players[seat]; }
function seatEl(seat) {
  if (seat === App.seat) return $('#meAvatar');
  return $('.opp[data-seat="' + seat + '"] .avWrap');
}

function render(force) {
  var st = App.st;
  if (!st) return;
  if (st.phase === 'over') { renderSmall(st); showOver(); return; }
  renderHud(st);
  renderOpps(st, force);
  renderTable(st);
  renderMe(st);
  renderHand(st);
  renderActions(st);
  renderShield();
  processFx(st);
  scheduleBot();
}

function renderSmall(st) {
  // 게임오버 직전에도 최소 정보는 갱신
  renderHud(st);
}

function renderHud(st) {
  $('#targetChip').textContent = '🏆 ' + st.targetScore + '점';
  $('#deckChip').textContent = '🃏 ' + st.deck.length;
  var rc = $('#roomChip');
  if (App.net && App.net.code) { rc.classList.remove('hidden'); rc.textContent = '#' + App.net.code; }
  else rc.classList.add('hidden');
  // v3: 진행 방향 (반전되면 화살표가 휙 뒤집힘)
  var dc = $('#dirChip');
  if (dc) {
    var dir = st.dir === -1 ? -1 : 1;
    if (dc.getAttribute('data-d') !== String(dir)) {
      var first = dc.getAttribute('data-d') == null;
      dc.setAttribute('data-d', String(dir));
      dc.textContent = dir === 1 ? '➡️ 시계' : '⬅️ 반시계';
      if (!first) { dc.classList.remove('flip'); void dc.offsetWidth; dc.classList.add('flip'); }
    }
  }
}

function renderOpps(st, force) {
  var box = $('#opps');
  var seats = oppSeats(st);
  var needBuild = box.children.length !== seats.length || force;
  if (needBuild) {
    box.innerHTML = seats.map(function (s) {
      var dots = '';
      for (var di = 0; di < st.targetScore; di++) dots += '<i></i>';
      return '<div class="opp" data-seat="' + s + '">' +
        '<div class="sc">0</div>' +
        '<div class="ice">🧊 얼음</div>' +
        '<div class="wall">🛡️</div>' +
        '<div class="avWrap"></div>' +
        '<div class="nm"></div>' +
        '<div class="fan"></div>' +
        '<div class="prog">' + dots + '</div>' +
        '</div>';
    }).join('');
    box.style.gridTemplateColumns = 'repeat(' + seats.length + ',1fr)';
  }
  seats.forEach(function (s) {
    var p = st.players[s];
    var el = $('.opp[data-seat="' + s + '"]', box);
    if (!el) return;
    var isTurn = st.turn === s && st.phase === 'playing';
    var tm = App.targetMode;
    var tmDef = tm && E.ACTIONS[tm.act];
    var isTarget = !!(tmDef && tmDef.needTarget && !tm.target);
    el.classList.toggle('turn', isTurn);
    el.classList.toggle('target', isTarget);
    el.classList.toggle('frozen', (p.frozen || 0) > 0);
    el.classList.toggle('walled', (p.wall || 0) > 0);
    var prev = el.getAttribute('data-expr') || '';
    var expr = p.score >= 6 ? 'win' : 'idle';
    if (prev !== expr) {
      el.setAttribute('data-expr', expr);
      $('.avWrap', el).innerHTML = cactusSVG(p.avatar, expr);
    }
    $('.sc', el).textContent = p.score;
    $('.nm', el).textContent = p.name;
    var prog = $('.prog', el);
    if (prog && prog.getAttribute('data-sc') !== String(p.score)) {
      prog.setAttribute('data-sc', String(p.score));
      $$('i', prog).forEach(function (d, i) { d.classList.toggle('on', i < p.score); });
    }
    var fan = $('.fan', el);
    var bombs = p.hand.filter(function (id) { return (E.cardInfo(id) || {}).act === 'bomb'; }).length;
    var sig = p.hand.length + '/' + bombs;
    if (fan.getAttribute('data-sig') !== sig) {
      fan.setAttribute('data-sig', sig);
      var n = Math.min(p.hand.length, 7);
      var html = '';
      for (var i = 0; i < n; i++) html += '<i class="' + (i >= n - bombs ? 'b' : '') + '"></i>';
      if (p.hand.length > 7) html += '<span class="cnt">+' + (p.hand.length - 7) + '</span>';
      fan.innerHTML = html;
    }
  });
}

function renderTable(st) {
  var p = st.players[st.turn];
  var banner = $('#turnBanner');
  var txt, me = false;
  if (st.pending) txt = '🛡️ ' + st.players[st.pending.defender].name + ' 방패 판정!';
  else if (App.targetMode) {
    var ta = E.ACTIONS[App.targetMode.act];
    txt = ta ? (ta.icon + ' ' + ta.name + ' → 상대를 콕!') : '상대를 콕!';
    me = true;
  }
  else if (st.turn === App.seat) { txt = st.waitingScore ? '🎉 점수를 찍어!' : '👉 내 차례!'; me = true; }
  else txt = '😴 ' + p.name + ' 차례…';
  banner.textContent = txt;
  banner.classList.toggle('me', me);
  var dc = $('#deckCount');
  dc.textContent = st.deck.length;
  dc.classList.toggle('low', st.deck.length <= 5);
  var last = st.log.slice(-2).map(function (l) { return l.text; }).join(' ');
  $('#ticker').innerHTML = '';
  st.log.slice(-3).forEach(function (l) {
    var d = document.createElement('div');
    d.textContent = l.text;
    $('#ticker').appendChild(d);
  });
}

function renderMe(st) {
  var p = st.players[App.seat];
  if (!p) return;
  var av = $('#meAvatar');
  var expr = p.score >= 6 ? 'win' : (myTurn() ? 'idle' : 'idle');
  var key = p.avatar + ':' + expr;
  if (av.getAttribute('data-k') !== key) { av.setAttribute('data-k', key); av.innerHTML = cactusSVG(p.avatar, expr); }
  $('#meName').textContent = p.name + (p.bot ? ' (봇)' : '');
  $('#meScore').textContent = p.score + '점';
  $('#meSets').textContent = p.sets ? '🎉 세트 ' + p.sets : '';
  var bombs = p.hand.filter(function (id) { return (E.cardInfo(id) || {}).act === 'bomb'; }).length;
  $('#meBombs').textContent = bombs ? '💣' + bombs : '';
  var mi = $('#meIce');
  if (mi) mi.textContent = (p.frozen || 0) > 0 ? '🧊 얼음' : '';
  var mw = $('#meWall');
  if (mw) mw.classList.toggle('hidden', !(p.wall > 0));
}

function handGroups(st, seat) {
  var p = st.players[seat];
  var out = [], cmap = {}, amap = {};
  p.hand.forEach(function (id) {
    var i = E.cardInfo(id);
    if (i.kind === 'cactus') (cmap[i.type] = cmap[i.type] || []).push(id);
    else (amap[i.act] = amap[i.act] || []).push(id);
  });
  // v3: ⚡ 즉시 카드 4종을 항상 맨 앞(왼쪽 엄지)에 둔다 — 내 턴이 아니어도 바로 눌리게
  var ORDER = ['shield', 'freeze', 'skip', 'reverse'];
  ORDER.forEach(function (a) { if (amap[a]) out.push({ kind: 'action', act: a, n: amap[a].length, ids: amap[a] }); });
  E.CACTUS.forEach(function (c) { if (cmap[c.key]) out.push({ kind: 'cactus', type: c.key, n: cmap[c.key].length, ids: cmap[c.key] }); });
  Object.keys(amap).forEach(function (a) {
    if (ORDER.indexOf(a) >= 0) return;
    out.push({ kind: 'action', act: a, n: amap[a].length, ids: amap[a] });
  });
  return out;
}

function renderHand(st) {
  var p = st.players[App.seat];
  if (!p) return;
  var groups = handGroups(st, App.seat);
  var box = $('#hand');
  var sig = groups.map(function (g) { return g.kind + ':' + (g.type || g.act) + ':' + g.n; }).join('|') +
    '|' + (myTurn() ? '1' : '0') + '|' + (st.pending ? 'P' : '') + '|' + (App.trashMode ? 'T' : '');
  if (box.getAttribute('data-sig') === sig) return;
  box.setAttribute('data-sig', sig);
  if (!groups.length) {
    box.innerHTML = '<div style="color:#9d8ab5;font-size:12px;font-weight:800;padding:0 8px">손이 텅 비었어… 덱에서 뽑자!</div>';
    return;
  }
  box.innerHTML = groups.map(function (g) {
    if (g.kind === 'cactus') {
      var c = E.CACTUS.filter(function (x) { return x.key === g.type; })[0];
      var ready = g.n >= 3;
      var dots = '';
      for (var i = 0; i < 3; i++) dots += '<i class="' + (i < g.n ? 'on' : '') + '"></i>';
      return '<button class="hcard' + (ready ? ' ready' : '') + (!myTurn() ? ' off' : '') + '" data-kind="cactus" data-type="' + g.type + '">' +
        '<span class="pts">' + c.pts + '점</span>' +
        (g.n > 1 ? '<span class="badge">×' + g.n + '</span>' : '') +
        '<span class="hcArt">' + cactusSVG(E.CACTUS.indexOf(c), ready ? 'win' : 'idle') + '</span>' +
        '<span class="hcName">' + c.name + '</span>' +
        '<span class="hdots">' + dots + '</span>' +
        '</button>';
    }
    var a = E.ACTIONS[g.act];
    var sel = !!(App.targetMode && App.targetMode.act === g.act);
    var inst = !!a.instant;
    var off = !inst && !myTurn();
    return '<button class="hcard action' + (sel ? ' sel' : '') + (inst ? ' instant' : '') + (off ? ' off' : '') + '" data-kind="action" data-act="' + g.act + '">' +
      (inst ? '<span class="instBadge">⚡ 즉시</span>' : '') +
      (g.n > 1 ? '<span class="badge">×' + g.n + '</span>' : '') +
      '<span class="hcArt">' + a.icon + '</span>' +
      '<span class="hcName">' + a.name + '</span>' +
      '<span class="hcSub">' + a.short + '</span>' +
      '</button>';
  }).join('');
}

function renderActions(st) {
  var p = st.players[App.seat];
  var mine = myTurn();
  var drawBtn = $('#drawBtn');
  var canDraw = mine && !st.acted && st.deck.length > 0 && p.hand.length < E.HAND_LIMIT;
  drawBtn.disabled = !canDraw;
  var sub = '';
  if (!mine) sub = '<span class="sub">기다려…</span>';
  else if (st.acted) sub = '<span class="sub">행동 완료</span>';
  else if (p.hand.length >= E.HAND_LIMIT) sub = '<span class="sub">손 꽉 참</span>';
  else if (!st.deck.length) sub = '<span class="sub">덱 비었음</span>';
  drawBtn.innerHTML = '🃏 덱에서 뽑기 ' + sub;

  var sets = E.availSets(st, App.seat);
  var setBtn = $('#setBtn');
  if (mine && sets.length) {
    setBtn.classList.remove('hidden');
    var best = sets.slice().sort(function (a, b) { return b.pts - a.pts; })[0];
    setBtn.innerHTML = '🎉 3장 완성! <small>+' + best.pts + '점</small>';
    setBtn.setAttribute('data-type', best.key);
  } else setBtn.classList.add('hidden');

  $('#passBtn').classList.toggle('hidden', !(mine && st.acted));
  $('#cancelBtn').classList.toggle('hidden', !App.targetMode);
  $('#trashBtn').classList.toggle('hidden', !(mine && p.hand.length >= E.HAND_LIMIT));
  $('#trashBtn').classList.toggle('btn', true);
  $('#trashBtn').style.background = App.trashMode ? 'rgba(255,90,60,.35)' : '';
}
