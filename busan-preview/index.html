<title>🚗 서울→부산 무한 하드코어 질주</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#05070d;color:#fff;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:manipulation;
  }
  #frame{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#0b1220;
    touch-action:none;--u:4px;
  }
  @media (min-aspect-ratio: 10/16){
    #frame{width:calc(100vh * 0.5625);height:100vh}
  }
  @supports (height:100dvh){
    @media (min-aspect-ratio: 10/16){ #frame{width:calc(100dvh * 0.5625);height:100dvh} }
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;left:0;right:0;top:0;z-index:20;
    padding:calc(var(--u)*4.6) calc(var(--u)*3) calc(var(--u)*2);
    padding-top:max(calc(var(--u)*4.6), calc(env(safe-area-inset-top) + var(--u)*2.2));
    background:linear-gradient(to bottom,rgba(5,8,16,.84),rgba(5,8,16,.38) 52%,rgba(5,8,16,0));
    pointer-events:none;opacity:0;transition:opacity .25s;
  }
  #hud.on{opacity:1}
  #hud .row{display:flex;align-items:flex-start;gap:calc(var(--u)*1.4);padding-right:calc(var(--u)*12.5)}
  #hud .col{flex:1;min-width:0}
  #hud .col.mid{flex:0 0 auto;text-align:center;padding:0 calc(var(--u)*.4)}
  #hud .col.right{text-align:right;padding-right:calc(var(--u)*1)}
  .sec{font-size:calc(var(--u)*2.9);font-weight:900;letter-spacing:-.02em;line-height:1.15;
    text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffd479}
  .next{font-size:calc(var(--u)*2.5);font-weight:700;color:#9fd0ff;opacity:.92;margin-top:calc(var(--u)*.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .remain{display:flex;align-items:baseline;justify-content:center;gap:calc(var(--u)*.6);
    font-variant-numeric:tabular-nums;line-height:1}
  .remain span{font-size:calc(var(--u)*6.6);font-weight:900;letter-spacing:-.045em;
    background:linear-gradient(180deg,#fff,#a8d8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(80,170,255,.45))}
  .remain i{font-style:normal;font-size:calc(var(--u)*2.8);font-weight:700;color:#9fd0ff;opacity:.9}
  .wx{font-size:calc(var(--u)*2.2);font-weight:800;color:#bcd4f0;opacity:.9;margin-top:calc(var(--u)*.5);
    white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .spd{display:flex;align-items:baseline;justify-content:flex-end;gap:calc(var(--u)*.5);
    font-variant-numeric:tabular-nums;line-height:1.1}
  .spd span{font-size:calc(var(--u)*4.8);font-weight:900;letter-spacing:-.03em}
  .spd i{font-style:normal;font-size:calc(var(--u)*2.3);font-weight:700;color:#ffd479;opacity:.9}
  #bestVal{font-size:calc(var(--u)*2.5);font-weight:800;color:#ffd479;opacity:.95;margin-top:calc(var(--u)*.4);
    white-space:nowrap;font-variant-numeric:tabular-nums}

  /* danger gauge */
  .dangerWrap{margin-top:calc(var(--u)*2.0);display:flex;align-items:center;gap:calc(var(--u)*1.4);padding-right:calc(var(--u)*12.5)}
  .dangerWrap .dlab{font-size:calc(var(--u)*2.3);font-weight:900;color:#cfe4ff;white-space:nowrap;
    min-width:calc(var(--u)*7.6);letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .dangerWrap .dlab.hot{color:#ff8b7a}
  .dBg{position:relative;flex:1;height:calc(var(--u)*1.9);border-radius:99px;background:rgba(255,255,255,.14);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden}
  #dangerFill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#2ee08a,#ffd479);transition:width .1s linear}
  #dangerFill.mid{background:linear-gradient(90deg,#ffd479,#ff9f43)}
  #dangerFill.hot{background:linear-gradient(90deg,#ff8a3d,#ff3b47);animation:dangerPulse .42s infinite alternate}
  @keyframes dangerPulse{from{filter:brightness(1)}to{filter:brightness(1.55)}}

  .bar{margin-top:calc(var(--u)*1.3);position:relative;height:calc(var(--u)*2.1)}
  .barBg{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.13);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden}
  #barFill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#2f7bff,#63d2ff);transition:width .08s linear}
  .barBg .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
  #barDot{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);
    font-size:calc(var(--u)*3.2);filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));transition:left .08s linear}

  /* ---------- top right buttons ---------- */
  #mute,#back{
    position:absolute;z-index:40;border:none;color:#fff;cursor:pointer;
    top:max(calc(var(--u)*3.4), calc(env(safe-area-inset-top) + var(--u)*1.2));
    width:calc(var(--u)*8.4);height:calc(var(--u)*8.4);border-radius:50%;
    font-size:calc(var(--u)*4);line-height:1;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.13);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 2px 10px rgba(0,0,0,.35);touch-action:manipulation;
  }
  #mute{right:calc(var(--u)*2.6)}
  #back{right:calc(var(--u)*2.6);top:max(calc(var(--u)*13.2), calc(env(safe-area-inset-top) + var(--u)*11));
    font-size:calc(var(--u)*3.4);opacity:0;pointer-events:none;transition:opacity .2s}
  #back.on{opacity:1;pointer-events:auto}
  #mute:active,#back:active{transform:scale(.92)}

  /* ---------- combo ---------- */
  #combo{
    position:absolute;right:calc(var(--u)*3.2);top:calc(var(--u)*24.5);z-index:24;pointer-events:none;
    font-size:calc(var(--u)*3.2);font-weight:900;color:#ffd479;opacity:0;white-space:nowrap;
    transition:opacity .18s,transform .1s;transform-origin:100% 50%;

    font-variant-numeric:tabular-nums;
  }
  #combo.on{opacity:1}
  #combo.pop{transform:scale(1.22)}

  /* ---------- banner ---------- */
  #banner{
    position:absolute;left:0;right:0;top:31%;z-index:25;text-align:center;pointer-events:none;opacity:0;
  }
  #banner .b1{font-size:calc(var(--u)*6.2);font-weight:900;letter-spacing:-.03em;padding:0 calc(var(--u)*3);
    text-shadow:0 3px 18px rgba(0,0,0,.85),0 0 26px rgba(120,200,255,.5)}
  #banner .b2{font-size:calc(var(--u)*3);font-weight:700;color:#ffe08a;margin-top:calc(var(--u)*.8);
    text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #banner.show{animation:bannerPop 1.9s ease-out forwards}
  @keyframes bannerPop{
    0%{opacity:0;transform:translateY(calc(var(--u)*3)) scale(.92)}
    12%{opacity:1;transform:translateY(0) scale(1)}
    70%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(calc(var(--u)*-2.4)) scale(.98)}
  }

  /* ---------- new record ---------- */
  #record{position:absolute;left:0;right:0;top:21%;z-index:27;text-align:center;pointer-events:none;opacity:0}
  #record .r1{font-size:calc(var(--u)*5.6);font-weight:900;letter-spacing:-.03em;
    background:linear-gradient(180deg,#fff8d0,#ffb020 70%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(255,150,0,.7))}
  #record .r2{font-size:calc(var(--u)*2.6);font-weight:900;color:#ffe08a;margin-top:calc(var(--u)*.4);
    text-shadow:0 2px 10px rgba(0,0,0,.85)}
  #record.show{animation:recPop 1.9s ease-out forwards}
  @keyframes recPop{
    0%{opacity:0;transform:scale(.62)}
    13%{opacity:1;transform:scale(1.08)}
    26%{transform:scale(1)}
    76%{opacity:1}
    100%{opacity:0;transform:translateY(calc(var(--u)*-2.4)) scale(.98)}
  }

  /* ---------- hint ---------- */
  #hint{
    position:absolute;left:0;right:0;bottom:calc(var(--u)*17);z-index:22;text-align:center;pointer-events:none;
    font-size:calc(var(--u)*3.1);font-weight:700;color:#eaf4ff;opacity:0;transition:opacity .5s;
    text-shadow:0 2px 10px rgba(0,0,0,.9)
  }
  #hint.on{opacity:.95}
  #hint b{color:#ffe08a}

  /* ---------- toast ---------- */
  #toast{
    position:absolute;left:50%;bottom:calc(var(--u)*26);transform:translateX(-50%);z-index:60;
    background:rgba(10,16,28,.94);border:1px solid rgba(255,255,255,.16);border-radius:99px;
    padding:calc(var(--u)*2) calc(var(--u)*4);font-size:calc(var(--u)*3.1);font-weight:800;
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,.5)
  }
  #toast.on{opacity:1}

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;
    padding:calc(var(--u)*6) calc(var(--u)*5.4) calc(var(--u)*3.2);
    padding-bottom:max(calc(var(--u)*3.2), env(safe-area-inset-bottom));
    background:linear-gradient(to bottom,rgba(6,9,18,0) 0%,rgba(6,9,18,0) 24%,rgba(6,9,18,.45) 38%,rgba(7,10,19,.96) 48%,#070b14 58%,#070b14 100%);
    transition:opacity .28s;
  }
  .overlay.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .28s,visibility .28s}

  #title{justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain}
  #title > *{flex:0 0 auto}
  #title::before{content:'';display:block;flex:1 1 0;min-height:0}
  #title .tEmoji{font-size:calc(var(--u)*4.8);line-height:1;filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
  #title h1{
    margin:calc(var(--u)*1.0) 0 calc(var(--u)*.3);font-size:calc(var(--u)*7.2);font-weight:900;
    line-height:1.02;letter-spacing:-.055em;
    background:linear-gradient(180deg,#fff 30%,#8fc6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 20px rgba(60,140,255,.45))
  }
  #title h1 em{font-style:normal;display:block;font-size:calc(var(--u)*3.6);letter-spacing:.02em;
    margin-top:calc(var(--u)*1.1);-webkit-text-fill-color:#ffd479;color:#ffd479}
  .tBest{font-size:calc(var(--u)*2.8);font-weight:800;color:#ffd479;margin:calc(var(--u)*1.1) 0 calc(var(--u)*.4);
    line-height:1.35;font-variant-numeric:tabular-nums}
  .tBest b{font-weight:900;color:#fff}
  .tBest span{color:#9fb4d0;font-weight:700}
  .tSub{font-size:calc(var(--u)*2.4);font-weight:700;color:#8fa5c2;margin-bottom:calc(var(--u)*2.2);line-height:1.4}
  .tKeys{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*2.4);color:#8fa5c2;line-height:1.55;font-weight:600}
  .tKeys b{color:#d9ecff}

  .cta{
    width:100%;border:none;cursor:pointer;border-radius:calc(var(--u)*4);white-space:nowrap;
    padding:calc(var(--u)*3.4) calc(var(--u)*3);font-size:calc(var(--u)*4.5);font-weight:900;letter-spacing:-.02em;flex:0 0 auto;
    color:#04121f;background:linear-gradient(180deg,#7ce0ff,#39a9ff);
    box-shadow:0 calc(var(--u)*1.4) 0 rgba(0,60,110,.6),0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(60,170,255,.45);
    touch-action:manipulation;font-family:inherit;
  }
  .cta:active{transform:translateY(calc(var(--u)*.8));box-shadow:0 calc(var(--u)*.6) 0 rgba(0,60,110,.6)}
  .cta.alt{background:linear-gradient(180deg,#ffd479,#ffb020);box-shadow:0 calc(var(--u)*1.4) 0 rgba(120,70,0,.55),0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(255,180,50,.4)}
  .cta.ghost{
    background:rgba(255,255,255,.1);color:#e8f3ff;box-shadow:none;font-size:calc(var(--u)*3.2);
    padding:calc(var(--u)*2.8) calc(var(--u)*1.6);margin-top:calc(var(--u)*1.5);border-radius:calc(var(--u)*3)
  }

  /* ---------- end screen ---------- */
  #over .tag{
    align-self:center;font-size:calc(var(--u)*3);font-weight:800;letter-spacing:.12em;
    color:#ffb0a0;margin-bottom:calc(var(--u)*1.2)
  }
  #over .oBig{font-size:calc(var(--u)*9.4);line-height:1;text-align:center;margin-bottom:calc(var(--u)*1.2);
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.7))}
  #over h2{
    margin:0 0 calc(var(--u)*.8);font-size:calc(var(--u)*4.9);font-weight:900;line-height:1.28;letter-spacing:-.03em;text-align:center
  }
  #over .osub{text-align:center;font-size:calc(var(--u)*2.9);color:#9fb4d0;font-weight:700;margin-bottom:calc(var(--u)*2.4)}
  .oStats{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.0);margin-bottom:calc(var(--u)*1.8)}
  .oStats div{background:rgba(255,255,255,.07);border-radius:calc(var(--u)*2.2);padding:calc(var(--u)*1.7) calc(var(--u)*.3);text-align:center}
  .oStats b{display:block;font-size:calc(var(--u)*3.8);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.045em;white-space:nowrap}
  .oStats span{display:block;font-size:calc(var(--u)*2.1);color:#93a9c6;font-weight:700;margin-top:calc(var(--u)*.4);white-space:nowrap}
  .oBest{text-align:center;font-size:calc(var(--u)*2.9);font-weight:800;color:#ffd479;margin-bottom:calc(var(--u)*2.0);line-height:1.4}
  .oBest span{color:#9fb4d0;font-weight:700;font-size:calc(var(--u)*2.5)}
  .oBest em{font-style:normal;color:#7dffc0}
  .row2{display:flex;gap:calc(var(--u)*1.2);align-items:stretch}
  .row2 .cta.ghost{flex:1 1 0;margin-top:calc(var(--u)*1.5);font-size:calc(var(--u)*2.9);
    padding-left:calc(var(--u)*.6);padding-right:calc(var(--u)*.6)}

  /* ---------- flash ---------- */
  #flash{position:absolute;inset:0;z-index:45;pointer-events:none;background:#fff;opacity:0}
  #flash.go{animation:flashGo .42s ease-out}
  @keyframes flashGo{0%{opacity:.86}100%{opacity:0}}
  #vig{position:absolute;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
</style>

<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="vig"></div>

  <div id="hud">
    <div class="row">
      <div class="col left">
        <div class="sec" id="legName">경부선 1회차</div>
        <div class="next" id="nextName">다음 수원 · 40.0km</div>
      </div>
      <div class="col mid">
        <div class="remain"><span id="distVal">0.0</span><i>km</i></div>
        <div class="wx" id="wxVal">☀️ 낮</div>
      </div>
      <div class="col right">
        <div class="spd"><span id="spdVal">190</span><i>km/h</i></div>
        <div id="bestVal">🏆 0.0km</div>
      </div>
    </div>
    <div class="dangerWrap">
      <div class="dlab" id="dangerLab">위험</div>
      <div class="dBg"><div id="dangerFill"></div></div>
    </div>
    <div class="bar">
      <div class="barBg"><div id="barFill"></div><div id="barTicks"></div></div>
      <div id="barDot">🚗</div>
    </div>
  </div>

  <button id="back" aria-label="타이틀로">☰</button>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="combo"></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="record"><div class="r1">🔥 NEW RECORD!</div><div class="r2"></div></div>
  <div id="hint"></div>
  <div id="flash"></div>
  <div id="toast"></div>

  <div id="title" class="overlay">
    <div class="tEmoji">🚗💨</div>
    <h1>서울 → 부산<em>무한 하드코어 질주</em></h1>
    <div class="tBest" id="tBest">아직 기록 없음 <span>· 첫 주행이 곧 기록</span></div>
    <div class="tSub" id="tSub">갈수록 빨라진다 · 갈수록 막힌다 · 스치면 끝</div>
    <button id="startBtn" class="cta">무한 질주 출발 🏁</button>
    <div class="tKeys"><b>좌우 탭</b> · 스와이프 · <b>← →</b> · 내 차 탭 = <b>빵빵!</b> 📣</div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="tag" id="oTag">사고 발생</div>
    <div class="oBig" id="oBig">💥</div>
    <h2 id="oTitle">스치기만 해도 사고.</h2>
    <div class="osub" id="oSub">그게 한국 도로다</div>
    <div class="oStats">
      <div><b id="oKm">0.0</b><span>도달 km</span></div>
      <div><b id="oScore">0</b><span>점수</span></div>
      <div><b id="oSpd">0</b><span>최고 km/h</span></div>
      <div><b id="oCombo">x0</b><span>최대 콤보</span></div>
    </div>
    <div class="oBest" id="oBest"></div>
    <button id="retryBtn" class="cta alt">다시 달리기 🔁</button>
    <div class="row2">
      <button id="shareBtn" class="cta ghost">기록 공유하기</button>
      <button id="menuBtn2" class="cta ghost">타이틀</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   utils
   ========================================================= */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(arr, rng){
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* =========================================================
   config
   ========================================================= */

const ROAD_L = 28, ROAD_R = 772;

function mix3(a,b,t){ return [Math.round(lerp(a[0],b[0],t)), Math.round(lerp(a[1],b[1],t)), Math.round(lerp(a[2],b[2],t))]; }
function rgb(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

function blendTheme(a,b,t){
  return {
    ground: [mix3(a.ground[0],b.ground[0],t), mix3(a.ground[1],b.ground[1],t), mix3(a.ground[2],b.ground[2],t)],
    road:   [mix3(a.road[0],b.road[0],t), mix3(a.road[1],b.road[1],t), mix3(a.road[2],b.road[2],t)],
    haze:   mix3(a.haze,b.haze,t),
    hazeA:  lerp(a.hazeA,b.hazeA,t),
    night:  lerp(a.night,b.night,t),
    lamp:   mix3(a.lamp,b.lamp,t)
  };
}

/* 낮(0~28%) → 노을(40~48%) → 한밤중(60~80%) → 새벽(92%) → 낮 */
const SKY_KEYS = [[0,'day'],[0.28,'day'],[0.40,'dusk'],[0.48,'dusk'],[0.60,'night'],[0.80,'night'],[0.92,'dawn'],[1,'day']];
function themeAt(p){
  p = ((p % 1) + 1) % 1;
  let i = 0;
  while (i < SKY_KEYS.length - 2 && p >= SKY_KEYS[i+1][0]) i++;
  const ka = SKY_KEYS[i], kb = SKY_KEYS[i+1];
  const span = kb[0] - ka[0];
  const t = span <= 0 ? 0 : clamp((p - ka[0]) / span, 0, 1);
  return blendTheme(THEMES[ka[1]], THEMES[kb[1]], t);
}
function themeLabel(p){
  p = ((p % 1) + 1) % 1;
  if (p < 0.34) return '☀️ 낮';
  if (p < 0.50) return '🌇 노을';
  if (p < 0.78) return '🌙 한밤중';
  if (p < 0.95) return '🌅 새벽';
  return '☀️ 낮';
}
function toCss(th){
  return {
    ground: [rgb(th.ground[0]), rgb(th.ground[1]), rgb(th.ground[2])],
    road:   [rgb(th.road[0]), rgb(th.road[1]), rgb(th.road[2])],
    haze:   th.haze[0] + ',' + th.haze[1] + ',' + th.haze[2],
    hazeA:  th.hazeA,
    night:  th.night,
    lamp:   th.lamp[0] + ',' + th.lamp[1] + ',' + th.lamp[2]
  };
}

  return legRoute(leg).map(function(x){

  });
}

/* =========================================================
   records storage
   ========================================================= */
const REC_KEY = 'busan8_endless_v1';
const OLD_KEY = 'busan8_progress_v2';
const MemStore = (function(){
  const m = {};
  return {
    getItem: function(k){ return Object.prototype.hasOwnProperty.call(m,k) ? m[k] : null; },
    setItem: function(k,v){ m[k] = String(v); },
    removeItem: function(k){ delete m[k]; }
  };
})();
function defaultStore(){
  try {
    if (typeof localStorage !== 'undefined' && localStorage) return localStorage;
  } catch(e){}
  return MemStore;
}
function blankRecords(){
  return { bestKm:0, bestScore:0, bestSpeed:0, bestCombo:0, runs:0, totalKm:0, updated:0 };
}
function loadRecords(store){
  const st = store || defaultStore();
  const r = blankRecords();
  try {
    const raw = st.getItem(REC_KEY);
    if (raw){
      const o = JSON.parse(raw);
      r.bestKm = Math.max(0, Number(o.bestKm) || 0);
      r.bestScore = Math.max(0, Number(o.bestScore) || 0);
      r.bestSpeed = Math.max(0, Number(o.bestSpeed) || 0);
      r.bestCombo = Math.max(0, Number(o.bestCombo) || 0);
      r.runs = Math.max(0, Number(o.runs) || 0);
      r.totalKm = Math.max(0, Number(o.totalKm) || 0);
      r.updated = Number(o.updated) || 0;
      return r;
    }
    /* 예전 5단계 저장에서 최고 거리만 이어받기 */
    const oldRaw = st.getItem(OLD_KEY);
    if (oldRaw){
      const o = JSON.parse(oldRaw);
      r.bestKm = Math.max(0, Number(o.bestKm) || 0);
      r.bestScore = Math.max(0, Number(o.bestScore) || 0);
    }
  } catch(e){}
  return r;
}
function saveRecords(r, store){
  const st = store || defaultStore();
  try {
    r.updated = Date.now();
    st.setItem(REC_KEY, JSON.stringify(r));
    return true;
  } catch(e){ return false; }
}
function commitRun(sim, store){
  const r = Object.assign(blankRecords(), sim.rec || {});
  r.bestKm = Math.max(r.bestKm || 0, sim.dist);
  r.bestScore = Math.max(r.bestScore || 0, finalScore(sim));
  r.bestSpeed = Math.max(r.bestSpeed || 0, Math.round(sim.topSpeed));
  r.bestCombo = Math.max(r.bestCombo || 0, sim.maxCombo);
  r.runs = (r.runs || 0) + 1;
  r.totalKm = (r.totalKm || 0) + sim.dist;
  saveRecords(r, store);
  sim.rec = r;
  return r;
}

/* =========================================================
   difficulty / speed ramp
   ========================================================= */
function maxSpeedAt(dist){
  return Math.min(TOP_KMH, START_KMH + 260 * (1 - Math.exp(-dist / 230)));
}
function difficulty(sim){
  const t = 1 - Math.exp(-sim.dist / 320);            // 0 → 1
  const truckW = lerp(0.18, 0.24, t);
  const coneW  = lerp(0.12, 0.16, t);
  const cutW   = lerp(0.10, 0.30, t);
  const zigW   = lerp(0.05, 0.16, t);
  return {
    t: t,
    blockMax: clamp(Math.round(2 + 4 * t), 2, 6),
    coneMax:  clamp(1 + Math.round(2 * t), 1, 3),
    coneLen:  clamp(3 + Math.round(2 * t), 3, 5),
    gapScale: clamp(1 - 0.50 * t, 0.45, 1),
    truckMax: clamp(1 + Math.round(2 * t), 1, 3),
    blinker:  lerp(0.34, 0.05, t),
    cutDur:   lerp(0.32, 0.19, t),
    weights:  { pack: Math.max(0.10, 1 - truckW - coneW - cutW - zigW), truck: truckW, cone: coneW, cut: cutW, zig: zigW },
    dangerRate: 0.10 + 0.12 * t
  };
}

function playerY(sim){ return sim.worldH - PLAYER_Y_OFF; }
function playerX(sim){ return laneCenter(sim.lanePos); }

function newGame(opts){
  opts = opts || {};
  const seed = (opts.seed === undefined || opts.seed === null)
    ? ((Date.now() ^ 0x9e3779b9) >>> 0) : (opts.seed >>> 0);
  const rec = opts.records || loadRecords(opts.store);
  const sim = {
    state: 'title',
    mode: 'endless',
    seed: seed,
    rng: mulberry32(seed),
    rec: rec,

    worldH: opts.worldH || 1422,
    lanePos: 4, targetLane: 4, laneVel: 0,
    speed: START_KMH, maxSpeed: START_KMH, topSpeed: START_KMH,
    dist: 0, bonus: 0, score: 0,
    kalchi: 0, combo: 0, comboMaxEver: 0, maxCombo: 0, comboT: 0,
    time: 0, rush: 0, scroll: 0, dayT: 0, themeP: 0,
    theme: toCss(THEMES.day),

    obstacles: [], pops: [], particles: [],
    nextId: 1, spawnTimer: 0.42, waveCount: 0, coneCount: 0,

    leg: 0, landSeq: null, landIdx: 0, corridor: 4,

    blocked: false, blockT: 0,
    danger: 0, dangerMax: 0,
    shake: 0, crashT: 0, crashCause: null, endInfo: null, endStats: null,
    gantry: null, horn: 0,
    newRec: { km:false, score:false, speed:false, combo:false },
    god: false
  };
  sim.landSeq = buildSeq(0);
  return sim;
}

function start(sim){
  sim.state = 'playing';
  sim.speed = START_KMH;
  sim.topSpeed = START_KMH;
  sim.spawnTimer = 0.42;
  sim.danger = 0;
  sim.combo = 0;
  sim.comboT = 0;
  sim.dayT = 0;
  return sim;
}

function steer(sim, dir){
  if (sim.state !== 'playing') return false;
  const t = clamp(Math.round(sim.targetLane) + dir, 0, LANES - 1);
  if (t === sim.targetLane) return false;
  sim.targetLane = t;
  return true;
}
function setLane(sim, lane){
  if (lane < 0 || lane > LANES - 1) return false;
  if (lane === sim.targetLane) return false;
  sim.targetLane = lane;
  return true;
}

/* =========================================================
   obstacles
   ========================================================= */
const CAR_COLORS = ['#e6e8ef','#2f3d59','#8c2434','#1f6f4a','#c8c1b2','#3c3c46','#8a5a2b','#4a6fa5','#5c2b6b','#d8a03a'];

function makeObstacle(sim, props){
  return {
    id: sim.nextId++,
    type: props.type || 'car',
    x: props.x,
    y: props.y,
    w: props.w,
    h: props.h,
    speed: props.speed === undefined ? 90 : props.speed,
    color: props.color || '#e6e8ef',
    lane: props.lane === undefined ? 0 : props.lane,
    cutter: !!props.cutter,
    cutLane: props.cutLane === undefined ? null : props.cutLane,
    blinker: !!props.blinker,
    cutState: 'idle',
    cutT: 0,
    cutDur: props.cutDur || 0.26,
    cutFrom: props.x,
    cutTo: props.x,
    passed: false,
    minGap: Infinity,
    dead: false
  };
}
function addObstacle(sim, props){ const o = makeObstacle(sim, props); sim.obstacles.push(o); return o; }

/* 차선이 y 밴드 안에서 점유됐는지 (차체 폭 + 여유) */
function freeInBand(sim, y0, y1){
  const busy = new Array(LANES).fill(false);
  const margin = PLAYER.w * 0.34;
  for (let k=0;k<sim.obstacles.length;k++){
    const o = sim.obstacles[k];
    if (o.dead) continue;
    if (o.y + o.h/2 < y0 || o.y - o.h/2 > y1) continue;
    const x0 = o.x - o.w/2 - margin, x1 = o.x + o.w/2 + margin;
    for (let i=0;i<LANES;i++){
      const cx = laneCenter(i);
      if (cx > x0 && cx < x1) busy[i] = true;
    }
  }
  const free = [];
  for (let i=0;i<LANES;i++) if (!busy[i]) free.push(i);
  return free;
}
function addCone(sim, lane, y){
  sim.coneCount++;
  return addObstacle(sim, { type:'cone', x: laneCenter(lane), y: y, w: 24, h: 26, speed: 0, lane: lane });
}

/* 웨이브 하나 스폰: 항상 탈출 차로를 남긴다 */
function spawnWave(sim){
  const rng = sim.rng;
  const d = difficulty(sim);
  const y0 = -240 - rng() * 150;
  const free = freeInBand(sim, y0 - 120, y0 + 120);
  if (free.length < 3) return null;

  /* 예약 차로: 플레이어 ±2 안에 반드시 뚫린 차로를 하나 남긴다 (탈출 보장) */
  const mine = clamp(Math.round(sim.lanePos), 0, LANES - 1);
  let reserved = -1, rd = 9;
  for (let k=0;k<free.length;k++){
    const gap = Math.abs(free[k] - mine);
    if (gap >= 1 && gap <= 2 && gap < rd){ rd = gap; reserved = free[k]; }
  }
  if (reserved < 0 && free.indexOf(mine) >= 0) reserved = mine;
  if (reserved < 0){
    for (let k=0;k<free.length;k++){
      const gap = Math.abs(free[k] - mine);
      if (gap < rd){ rd = gap; reserved = free[k]; }
    }
  }
  sim.corridor = reserved;
  const pool = free.filter(function(l){ return l !== reserved; });
  if (!pool.length) return null;

  const ids = [];
  function place(props){
    const o = addObstacle(sim, props);
    ids.push(o.id);
    return o;
  }

  const w = d.weights;
  const roll = rng();
  let kind;
  if (roll < w.pack) kind = 'pack';
  else if (roll < w.pack + w.truck) kind = 'truck';
  else if (roll < w.pack + w.truck + w.cone) kind = 'cone';
  else if (roll < w.pack + w.truck + w.cone + w.cut) kind = 'cut';
  else kind = 'zig';

  /* --- 화물차/버스 병렬 길막 --- */
  if (kind === 'truck'){
    const nMax = Math.min(pool.length, d.truckMax);
    const n = 1 + Math.floor(rng() * nMax);
    if (n <= 0) return null;
    const lanes = shuffle(pool.slice(), rng).slice(0, n);
    for (let i=0;i<lanes.length;i++){
      const isBus = rng() < 0.45;
      place({
        type: isBus ? 'bus' : 'truck',
        lane: lanes[i],
        x: laneCenter(lanes[i]),
        y: y0 - i * 26,
        w: isBus ? 70 : 68,
        h: isBus ? 212 : 198,
        speed: sim.speed * (0.40 + rng() * 0.14),
        color: isBus ? '#2b6fd6' : (rng() < 0.5 ? '#eceff5' : '#d7dbe4')
      });
    }
  }

  /* --- 차량 벽 (1~2개 빈틈) --- */
  else if (kind === 'pack'){
    const maxBlock = Math.min(pool.length, d.blockMax);
    if (maxBlock <= 0) return null;
    const k = 1 + Math.floor(rng() * maxBlock);
    const lanes = shuffle(pool.slice(), rng).slice(0, k);
    const v = sim.speed * (0.55 + rng() * 0.18);
    for (let i=0;i<lanes.length;i++){
      place({
        type: 'car', lane: lanes[i], x: laneCenter(lanes[i]),
        y: y0 - rng() * 34, w: 50, h: 104,
        speed: v * (0.96 + rng() * 0.08),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)]
      });
    }
  }

  /* --- 공사구간 꼬깔콘 클러스터 --- */
  else if (kind === 'cone'){
    const maxBlock = Math.min(pool.length, d.coneMax, d.blockMax);
    if (maxBlock < 1) return null;
    const k = 1 + Math.floor(rng() * maxBlock);
    const lanes = shuffle(pool.slice(), rng).slice(0, k);
    const n = Math.max(2, d.coneLen - 1 + Math.floor(rng() * 2));
    for (let i=0;i<lanes.length;i++){
      for (let j=0;j<n;j++){
        addCone(sim, lanes[i], y0 - j * 88);
        ids.push(sim.obstacles[sim.obstacles.length-1].id);
      }
    }
  }

  /* --- 깜빡이 없는 급차선 변경 --- */
  else if (kind === 'cut'){
    const near = pool.filter(function(l){ return Math.abs(l - mine) <= 2; });
    const cutPool = near.length ? near : pool;
    const lane = cutPool[Math.floor(rng() * cutPool.length)];
    const n = rng() < 0.35 ? 2 : 1;
    for (let i=0;i<n;i++){
      let dir = mine - lane;
      dir = dir === 0 ? (rng() < 0.5 ? -1 : 1) : (dir > 0 ? 1 : -1);
      if (rng() < 0.22) dir = -dir;
      const cutLane = clamp(lane + dir, 0, LANES - 1);
      const o = place({
        type: 'car', lane: lane, x: laneCenter(lane),
        y: y0 - rng() * 90, w: 50, h: 104,
        speed: Math.max(90, sim.speed * (0.88 + rng() * 0.16)),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)],
        cutter: cutLane !== lane, cutLane: cutLane,
        blinker: rng() < d.blinker,
        cutDur: d.cutDur
      });
      if (o.cutter) sim.cutCount = (sim.cutCount || 0) + 1;
    }
  }

  /* --- 지그재그 --- */
  else {
    const lanes = shuffle(pool.slice(), rng).slice(0, Math.min(3, pool.length));
    for (let i=0;i<3;i++){
      if (!lanes.length) break;
      const lane = lanes[Math.floor(rng() * lanes.length)];
      place({
        type: 'car', lane: lane, x: laneCenter(lane),
        y: y0 - i * 118, w: 50, h: 104,
        speed: sim.speed * (0.55 + rng() * 0.2),
        color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)]
      });
    }
  }

  if (!ids.length) return null;

  /* 탈출 차로 보장: 밴드 안에 최소 2차로가 비어 있어야 함 */
  pruneForEscape(sim, ids, y0 - 220, y0 + 480, 2);
  if (!ids.length) return null;

  sim.waveCount++;
  return { kind: kind, y: y0, ids: ids };
}

function pruneForEscape(sim, ids, y0, y1, minFree){
  let guard = 0;
  while (ids.length && guard++ < 60){
    if (freeInBand(sim, y0, y1).length >= minFree) return true;
    const id = ids.pop();
    for (let i=sim.obstacles.length-1;i>=0;i--){
      if (sim.obstacles[i].id === id){ sim.obstacles.splice(i,1); break; }
    }
  }
  return freeInBand(sim, y0, y1).length >= minFree;
}
